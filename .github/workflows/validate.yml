---
name: validate
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: opentofu/setup-opentofu@v2.0.2
      # config/versions.env is already in the KEY=value shape $GITHUB_ENV wants, so the pins CI
      # uses are the same ones `just ops deps` installs, with no parsing step. See
      # .just/operator.just.
      - name: Load pinned tool versions
        run: grep -v '^#' config/versions.env | grep . >> "$GITHUB_ENV"
      # kustomize-build (in .pre-commit-config.yaml) shells out to both binaries with
      # language: system — neither ships on the runner image, and neither was previously
      # installed here, so the hook only ever passed if the image happened to carry them.
      - name: Install kustomize
        run: |
          curl -fsSL -o /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install -m 755 /tmp/kustomize /usr/local/bin/kustomize
      - name: Install helm
        run: |
          curl -fsSL -o /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 755 /tmp/linux-amd64/helm /usr/local/bin/helm
      # just-fmt (in .pre-commit-config.yaml) is language: system and the runner image does not
      # ship just. Same pinned-release pattern as the two above.
      - name: Install just
        run: |
          curl -fsSL -o /tmp/just.tar.gz "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 755 /tmp/just /usr/local/bin/just
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv tool install pre-commit
      # tofu-validate (in .pre-commit-config.yaml) only runs fmt/validate, not init — init can
      # touch .terraform.lock.hcl, and pre-commit fails a hook that modifies tracked files.
      - run: for d in $(find tofu -name "*.tf" -exec dirname {} \; | sort -u); do tofu -chdir="$d" init -backend=false -input=false; done
      - run: pre-commit run --all-files
      # gitleaks' own pre-commit hook only diffs the staged index (`--staged`), which is empty
      # under `run --all-files` — it silently scans nothing above. Run a real full-tree scan.
      - name: gitleaks (full tree, not just the staged index)
        run: |
          # The tag carries a leading v, the tarball's name does not — hence the ${x#v} strip.
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks dir . --config .gitleaks.toml

  # A malformed .github/renovate.json5 fails silently: Renovate skips the repo at 03:00 in a
  # workflow nobody is watching, and updates simply stop arriving. Catch it on the PR instead.
  # Unpinned on purpose — the validator that matters is the one the current Renovate ships.
  renovate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: npx --yes --package renovate -- renovate-config-validator --strict

  ansible-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv tool install ansible-core
      - uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yml') }}
      - run: ansible-galaxy collection install -r requirements.yml
        working-directory: ansible
      - run: ansible-playbook --syntax-check playbooks/*.yml
        working-directory: ansible
