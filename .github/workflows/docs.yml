---
name: docs
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # config/versions.env is already in the KEY=value shape $GITHUB_ENV wants, so the pins CI
      # uses are the same ones `just ops deps` installs, with no parsing step. See
      # .just/operator.just.
      - name: Load pinned tool versions
        run: grep -v '^#' config/versions.env | grep . >> "$GITHUB_ENV"
      - name: Install mdbook
        run: |
          curl -fsSL -o /tmp/mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/mdbook.tar.gz -C /tmp
          sudo install -m 755 /tmp/mdbook /usr/local/bin/mdbook
      # Without both of these every ```d2 fence renders as a code block instead of a diagram,
      # and mdbook exits 0 either way — so the failure would ship silently. Checked below.
      - name: Install d2 and the mdbook-d2 preprocessor
        run: |
          curl -fsSL -o /tmp/d2.tar.gz \
            "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/d2.tar.gz -C /tmp
          sudo install -m 755 "/tmp/d2-${D2_VERSION}/bin/d2" /usr/local/bin/d2
          curl -fsSL -o /tmp/mdbook-d2.tar.gz \
            "https://github.com/danieleades/mdbook-d2/releases/download/${MDBOOK_D2_VERSION}/mdbook-d2-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/mdbook-d2.tar.gz -C /tmp
          sudo install -m 755 /tmp/mdbook-d2 /usr/local/bin/mdbook-d2
      - run: mdbook build docs
      # Every d2 fence must have become an <svg>. A missing or broken preprocessor is not an
      # mdbook build error, so assert on the output rather than trusting the exit code.
      - name: Assert diagrams rendered
        run: |
          want=$(grep -rc '^```d2$' docs/src --include='*.md' | awk -F: '{s+=$2} END {print s}')
          # print.html concatenates every page, so it holds a second copy of each diagram.
          got=$(grep -ro 'data-d2-version' docs/book --include='*.html' | grep -vc '^docs/book/print.html')
          echo "$want d2 fences, $got rendered diagrams"
          test "$got" -eq "$want"
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master'
        with:
          path: docs/book

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
