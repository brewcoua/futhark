---
name: docs
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # mdbook, d2 and the mdbook-d2 preprocessor, at the same pins `just docs build` uses
      # locally. Without all three every ```d2 fence renders as a code block instead of a
      # diagram, and mdbook exits 0 either way — so the failure would ship silently. Checked
      # below.
      - uses: jdx/mise-action@v4.2.4
      - run: mdbook build docs
      # Every d2 fence must have become an <svg>. A missing or broken preprocessor is not an
      # mdbook build error, so assert on the output rather than trusting the exit code.
      - name: Assert diagrams rendered
        run: |
          want=$(grep -rc '^```d2$' docs/src --include='*.md' | awk -F: '{s+=$2} END {print s}')
          # print.html concatenates every page, so it holds a second copy of each diagram.
          got=$(grep -ro 'data-d2-version' docs/book --include='*.html' | grep -vc '^docs/book/print.html')
          echo "$want d2 fences, $got rendered diagrams"
          test "$got" -eq "$want"
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master'
        with:
          path: docs/book

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
