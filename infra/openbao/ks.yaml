---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
# Root of the dependency graph: OpenBao needs nothing else to come up, and everything else
# (ESO, and transitively cert-manager/traefik/storage/monitoring/nodes) needs OpenBao. See
# docs/src/conventions/ordering.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao
spec:
  path: ./infra/openbao/app
