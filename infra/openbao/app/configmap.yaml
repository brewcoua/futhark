---
# Public, non-identifying config only. The seal stanza (endpoint, key id, mTLS material —
# all identifying, this repo is public) lives in the seal Secret instead, bridged in by
# ansible/roles/openbao's prep.yml from Proton Pass. `bao server -config=<dir>` merges
# every *.hcl in the config directory, so this needs no templating to combine with it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: openbao
data:
  openbao.hcl: |
    storage "raft" {
      path    = "/openbao/data"
      node_id = "ogma"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }

    api_addr      = "http://openbao.openbao.svc.cluster.local:8200"
    cluster_addr  = "http://openbao.openbao.svc.cluster.local:8201"
    disable_mlock = true
    ui            = true
