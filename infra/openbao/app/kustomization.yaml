---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - statefulset.yaml
  - service.yaml
  - ingress.yaml

# Splices INT_DOMAIN into the ingress host — see infra/monitoring/app/kustomization.yaml and
# docs/src/conventions/domains.md.
components:
  - ../../../config/domain

replacements:
  - source:
      kind: ConfigMap
      name: domain
      fieldPath: data.INT_DOMAIN
    targets:
      - select:
          kind: Ingress
          name: openbao
        fieldPaths:
          - spec.rules.0.host
        options:
          delimiter: "."
          index: 1
