---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
# The default-deny NetworkPolicy baseline and the per-namespace ESO RBAC bridge. The Namespace
# CRs themselves belong to infra/namespaces; what these edges buy is that a namespace's policy
# lands with its workload rather than ahead of it, plus the Middleware CRD that
# middleware-ratelimit needs. See docs/src/conventions/ordering.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
spec:
  path: ./infra/configs
  dependsOn:
    - name: cert-manager
    - name: monitoring
    - name: storage
    - name: auth
    - name: external-secrets
    - name: tailscale-operator
    - name: traefik-internal
    - name: traefik-edge
    - name: edge-ips
  # netpol-allow-from-ingress-edge needs kenaz's mesh IP — traefik-edge's hostNetwork pod
  # connects to backends as itself, not as a namespaced pod identity. Same Secret
  # infra/traefik-edge consumes as ${PUBLIC_IP}/${MESH_IP}.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: edge-ips
