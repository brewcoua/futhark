---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
# Tenant/node namespaces, the default-deny NetworkPolicy baseline, and the per-namespace ESO
# RBAC bridge. Every overlay here sets kustomize's top-level `namespace:` field, so its
# Namespace CR must already exist or the whole overlay fails to apply — hence a dependsOn on
# every infra controller that declares one. See docs/src/conventions/ordering.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
spec:
  path: ./infra/configs
  dependsOn:
    - name: cert-manager
    - name: monitoring
    - name: storage
    - name: openbao
    - name: auth
    - name: external-secrets
    - name: tailscale-operator
    - name: traefik-internal
    - name: traefik-edge
