---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
#
# One repeated three-policy block per non-control-plane namespace (NetworkPolicy has no
# cluster-wide form, same reason app-limitrange.yaml in futhark-old repeated its LimitRange per
# namespace). flux-system is deliberately excluded — it's the trusted control plane.
#
# - default-deny: policyTypes: [Ingress] with no ingress: rules denies all inbound by default.
#   Egress is left open everywhere (ESO's call out to OpenBao on ogma, cert-manager's ACME/DNS-01
#   calls, arbitrary app egress) — the lateral-movement risk that matters in a single-tenant
#   homelab is inbound, and leaving egress open sidesteps k0s's apiserver-is-a-host-process
#   problem (see infra/cert-manager/app/networkpolicy-webhook.yaml) entirely.
# - allow-same-namespace: an ingress.from entry with only podSelector: {} (no namespaceSelector)
#   matches only pods in the policy's own namespace, per the NetworkPolicy spec.
# - allow-from-monitoring: monitoring's vmagent/node-exporter scrape broadly
#   (infra/monitoring/app/{exporters,vmagent}.yaml), so every namespace grants it ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: actual
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: actual
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-monitoring
  namespace: actual
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
