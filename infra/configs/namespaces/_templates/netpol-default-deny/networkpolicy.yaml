---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
#
# policyTypes: [Ingress] with no ingress: rules denies all inbound by default. Egress is left
# open everywhere (ESO's call out to OpenBao on ogma, cert-manager's ACME/DNS-01 calls, arbitrary
# app egress) — the lateral-movement risk that matters in a single-tenant homelab is inbound,
# and leaving egress open sidesteps k0s's apiserver-is-a-host-process problem (see
# infra/cert-manager/app/networkpolicy-webhook.yaml) entirely. flux-system is deliberately
# excluded from this baseline — it's the trusted control plane.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress]
