---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
#
# Bespoke to this namespace, not a shared _templates/ entry: only external-secrets ever
# needs to reach OpenBao's API port. netpol-allow-from-ingress-internal already covers the
# vault.INT_DOMAIN Ingress path (Traefik -> Service, from the ingress-internal namespace);
# this covers the direct ESO -> Service path instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - protocol: TCP
          port: 8200
