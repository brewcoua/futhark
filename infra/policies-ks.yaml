---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
# The default-deny NetworkPolicy baseline, per namespace. The Namespace CRs themselves belong to
# infra/namespaces; what these edges buy is that a namespace's policy lands with its workload
# rather than ahead of it, plus the Middleware CRD that middleware-ratelimit needs. See
# docs/src/conventions/ordering.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-policies
spec:
  path: ./infra/policies
  dependsOn:
    - name: infisical-operator
    - name: cert-manager
    - name: monitoring
    - name: storage
    - name: backup
    - name: auth
    - name: traefik-internal
    - name: traefik-edge
    - name: trivy-operator
  # No postBuild here. netpol-allow-from-ingress-edge used to substitute ${MESH_IP} out of the
  # cluster-values Secret — hence a `substitutions` edge as well — and now spells the mesh CIDR
  # literally, for the reasons in that template's own comment.
