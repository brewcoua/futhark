---
# Internal ingress: reachable ONLY over the NetBird mesh. Serves the wildcard cert for
# the internal subdomain (config/sops/cluster.sops.yaml), so internal Ingresses never carry
# their own tls: block. Binds 443 on the node's mesh address with hostNetwork, the same way
# traefik-edge binds the public one. Why, and what the split costs:
# docs/src/gitops/infra.md#the-two-ingresses. ${MESH_IP} is substituted by
# postBuild.substituteFrom in ks.yaml, from the SOPS-encrypted cluster-values Secret in config/.
#
# hostNetwork: true means CNI NetworkPolicy enforcement never sees these sockets, so the
# ingress-internal baseline cannot govern this traffic; what bounds it is that the address is only
# reachable from the mesh at all, plus tofu/netbird's policies and Traefik's own rate limiting.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: flux-system
spec:
  interval: 1h
  releaseName: traefik-internal
  targetNamespace: ingress-internal
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: traefik
      version: "41.1.1" # chart 41.0.2 -> Traefik v3.7.6
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      kind: Deployment
      replicas: 1
      dnsPolicy: ClusterFirstWithHostNet
    updateStrategy:
      type: Recreate
      rollingUpdate: null
    hostNetwork: true
    # Pinned because the hostIP below only exists on this node's interfaces; anywhere else the pod
    # would sit Pending. The same node runs traefik-edge and is named in ansible/nodes/<host>/
    # host.yml (public_ingress) and tofu/bunny/refs.env. tofu/netbird/refs.env reads its recorded
    # mesh_ip for the wildcard DNS record, so moving internal ingress means changing it there too.
    nodeSelector:
      kubernetes.io/hostname: ogma
    # No Service at all: the entryPoints below are bound on the host, and nothing in the cluster
    # dials this ingress by name. The metrics job discovers the pod instead, see
    # infra/monitoring/app/metrics/scrape-configs.yaml.
    service:
      enabled: false
    ingressClass:
      enabled: true
      name: internal
      isDefaultClass: false
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: internal
      kubernetesCRD:
        enabled: true
        ingressClass: internal
        # Lets ingresses in any namespace reference a forwardAuth Middleware in the `auth`
        # namespace once one exists there. Without this the cross-namespace ref is SILENTLY
        # rejected and the router fails. Nothing references one yet — infra/auth (Pocket ID)
        # is a plain OIDC provider, not a forwardAuth backend; see infra/monitoring/app/
        # vmsingle.yaml for what's actually still missing.
        allowCrossNamespace: true
    ports:
      # No plaintext HTTP, and no redirect from it: this node's
      # net.ipv4.ip_unprivileged_port_start is lowered only to 443 (ansible/roles/firewall_ingress),
      # so the chart's non-root user cannot bind 80 at all. `null` removes the entryPoint rather
      # than leaving one that fails to bind. Plain http:// to an internal host refuses.
      web: null
      websecure:
        port: 443
        hostIP: ${MESH_IP}
        http:
          tls:
            enabled: true
      # The chart's liveness/readiness probes hit this entryPoint's /ping, so it cannot be removed
      # the way `web` is. 8082, not the chart's 8080 and not 8081: traefik-edge already holds 8081
      # on this same address, since both pods share the node's network namespace.
      traefik:
        port: 8082
        hostIP: ${MESH_IP}
      metrics:
        port: 9180
        hostIP: ${MESH_IP}
        exposedPort: 9180
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
    # JSON access logs to stdout, collected into VictoriaLogs by the vlagent DaemonSet.
    accessLog:
      enabled: true
      format: json
    # Default cert served on websecure for any internal host.
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-int-tls
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
