---
# Internal ingress: reachable ONLY over the Tailscale mesh. Serves the wildcard cert for
# INT_DOMAIN (infra/substitutions/app/int-domain.sops.yaml), so internal Ingresses never carry
# their own tls: block. Exposed via the Tailscale operator rather than hostNetwork/hostIP — see
# docs/src/gitops/infra.md#the-two-ingresses.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: flux-system
spec:
  interval: 1h
  releaseName: traefik-internal
  targetNamespace: ingress-internal
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: traefik
      version: "41.*" # Traefik v3.7.x; pin a patch for reproducibility
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      kind: Deployment
      replicas: 1
    nodeSelector:
      kubernetes.io/hostname: kenaz
    # Verify service.spec passthrough and the loadBalancerClass value against the traefik
    # chart's and tailscale-operator's current docs before first apply — new territory, no
    # prior usage in this repo to crib from.
    service:
      enabled: true
      type: LoadBalancer
      spec:
        loadBalancerClass: tailscale
      annotations:
        tailscale.com/hostname: internal
    ingressClass:
      enabled: true
      name: internal
      isDefaultClass: false
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: internal
      kubernetesCRD:
        enabled: true
        ingressClass: internal
        # Lets ingresses in any namespace reference a forwardAuth Middleware in the `auth`
        # namespace once one exists there. Without this the cross-namespace ref is SILENTLY
        # rejected and the router fails. Nothing references one yet — infra/auth (Pocket ID)
        # is a plain OIDC provider, not a forwardAuth backend; see infra/monitoring/app/
        # vmsingle.yaml for what's actually still missing.
        allowCrossNamespace: true
    ports:
      web:
        port: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        port: 443
        http:
          tls:
            enabled: true
      metrics:
        port: 9180
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
    # JSON access logs to stdout, collected into VictoriaLogs by the vlagent DaemonSet.
    accessLog:
      enabled: true
      format: json
    # Default cert served on websecure for any host under INT_DOMAIN.
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-int-tls
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
