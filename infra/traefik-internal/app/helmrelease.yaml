---
# Internal ingress: reachable ONLY over the NetBird mesh. Serves the wildcard cert for
# the internal subdomain (config/sops/cluster.sops.yaml), so internal Ingresses never carry
# their own tls: block. Reached over a mesh route to the service CIDR rather than
# hostNetwork/hostIP or a per-Service mesh device — see docs/src/gitops/infra.md#the-two-ingresses.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: flux-system
spec:
  interval: 1h
  releaseName: traefik-internal
  targetNamespace: ingress-internal
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: traefik
      version: "41.1.1" # chart 41.0.2 -> Traefik v3.7.6
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      kind: Deployment
      replicas: 1
    nodeSelector:
      kubernetes.io/hostname: kenaz
    # The ClusterIP is pinned, not allocated. tofu/netbird's wildcard DNS record points
    # every internal hostname at this address, and a wildcard record cannot follow an
    # address Kubernetes hands out afresh on each reinstall. It is read straight out of this
    # file by tofu/netbird/variables.tf, so there is one spelling of it — but the two planes are
    # still coupled: this address has to stay inside k8s_service_cidr
    # (ansible/inventory/group_vars/all/network.yml), which is what the mesh route advertises.
    service:
      enabled: true
      type: ClusterIP
      spec:
        clusterIP: 10.96.0.100
    ingressClass:
      enabled: true
      name: internal
      isDefaultClass: false
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: internal
      kubernetesCRD:
        enabled: true
        ingressClass: internal
        # Lets ingresses in any namespace reference a forwardAuth Middleware in the `auth`
        # namespace once one exists there. Without this the cross-namespace ref is SILENTLY
        # rejected and the router fails. Nothing references one yet — infra/auth (Pocket ID)
        # is a plain OIDC provider, not a forwardAuth backend; see infra/monitoring/app/
        # vmsingle.yaml for what's actually still missing.
        allowCrossNamespace: true
    ports:
      web:
        port: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        port: 443
        http:
          tls:
            enabled: true
      metrics:
        port: 9180
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
    # JSON access logs to stdout, collected into VictoriaLogs by the vlagent DaemonSet.
    accessLog:
      enabled: true
      format: json
    # Default cert served on websecure for any internal host.
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-int-tls
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
