---
# One wildcard cert for all internal services. Issued into ingress-internal — Traefik
# resolves secretName references in its own namespace, and this HelmRelease's
# targetNamespace is ingress-internal (see app/helmrelease.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-int-tls
  namespace: ingress-internal
spec:
  secretName: wildcard-int-tls
  issuerRef:
    name: letsencrypt-bunny
    kind: ClusterIssuer
  commonName: "*.INT_DOMAIN"
  dnsNames:
    - "*.INT_DOMAIN"
    - "INT_DOMAIN"
