---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-internal
spec:
  path: ./infra/traefik-internal/app
  dependsOn:
    - name: cert-manager-config
    - name: substitutions
  # INT_DOMAIN (certificate.yaml's commonName/dnsNames) is committed SOPS-encrypted in
  # infra/substitutions.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: int-domain
