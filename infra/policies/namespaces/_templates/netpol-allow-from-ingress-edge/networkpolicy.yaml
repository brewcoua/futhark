---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
#
# Opt-in bridge: only for namespaces that actually expose a publicly-routed Ingress via
# traefik-edge. Add this template to a namespace's overlay whenever its app/ingress.yaml
# uses ingressClassName: edge — see netpol-allow-from-ingress-internal for the mesh
# equivalent, referenced but never written until now in docs/src/conventions/network-policy.md.
#
# ipBlock, not namespaceSelector: traefik-edge runs hostNetwork (infra/traefik-edge/app/
# helmrelease.yaml), so its connections to backend pods carry the edge node's own IP, not a pod
# identity in the ingress-edge namespace — a namespaceSelector rule never matches and every
# such request gets dropped by the namespace's default-deny, surfacing as 502 Bad Gateway.
# The whole mesh CIDR, not the edge node's /32: ipBlock takes a literal, so a /32 meant substituting
# ${MESH_IP} out of the cluster-values Secret — a hand-maintained second copy of an address
# ansible already records under `nodes` in config/sops/ops.sops.yaml, with nothing catching drift
# between them.
# The CIDR is mesh_cidr from ansible/inventory/group_vars/all/network.yml, committed in the clear
# because it grants nothing on its own.
#
# The cost is real and deliberate: this rule now trusts every mesh peer, the other nodes and the
# operator machine, not only the edge. What keeps that bounded is tofu/netbird/policy.tf, which decides
# which peers may reach the cluster at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-edge
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 100.80.0.0/24
