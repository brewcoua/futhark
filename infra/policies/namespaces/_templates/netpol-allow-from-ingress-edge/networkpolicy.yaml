---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
#
# Opt-in bridge: only for namespaces that actually expose a publicly-routed Ingress via
# traefik-edge. Add this template to a namespace's overlay whenever its app/ingress.yaml
# uses ingressClassName: edge — see netpol-allow-from-ingress-internal for the mesh
# equivalent, referenced but never written until now in docs/src/conventions/network-policy.md.
#
# ipBlock, not namespaceSelector: traefik-edge runs hostNetwork (infra/traefik-edge/app/
# helmrelease.yaml), so its connections to backend pods carry kenaz's own IP, not a pod
# identity in the ingress-edge namespace — a namespaceSelector rule never matches and every
# such request gets dropped by the namespace's default-deny, surfacing as 502 Bad Gateway.
# ${MESH_IP} is substituted by postBuild.substituteFrom in infra/policies-ks.yaml, from the
# same edge-ips Secret infra/traefik-edge uses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-edge
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: ${MESH_IP}/32
