---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
#
# traefik-edge runs hostNetwork: true (see infra/traefik-edge/app/helmrelease.yaml) — these
# netpols don't govern its ingress traffic at all, only anything else ever added to this
# namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ingress-edge
resources:
  - ../_templates/netpol-default-deny
  - ../_templates/netpol-allow-same-namespace
  - ../_templates/netpol-allow-from-monitoring
