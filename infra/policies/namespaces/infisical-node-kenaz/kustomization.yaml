---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
#
# Same baseline as infisical-infra, one per node tier. Adding a tier means adding a copy of this
# with the namespace swapped — see docs/src/gitops/infra.md#adding-a-node-tier.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infisical-node-kenaz
resources:
  - ../_templates/netpol-default-deny
  - ../_templates/netpol-allow-same-namespace
  - ../_templates/netpol-allow-from-monitoring
