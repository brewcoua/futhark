---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
#
# Velero reaches Backblaze over the public internet, which needs no rule here: the baseline is
# policyTypes: [Ingress] only, so egress stays open everywhere. See
# docs/src/conventions/network-policy.md. Nothing outside the namespace needs to reach Velero
# except monitoring's scrape of its metrics endpoint.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: velero
resources:
  - ../_templates/netpol-default-deny
  - ../_templates/netpol-allow-same-namespace
  - ../_templates/netpol-allow-from-monitoring
