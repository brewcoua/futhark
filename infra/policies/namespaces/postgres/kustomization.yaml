---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
# No ingress template here, unlike every other namespace with an overlay: Postgres has no
# hostname and is never routed through Traefik. Reaching it means being a named namespace below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postgres
resources:
  - ../_templates/netpol-default-deny
  - ../_templates/netpol-allow-same-namespace
  - ../_templates/netpol-allow-from-monitoring
  - netpol-allow-from-cnpg-system.yaml
  - netpol-allow-from-linkwarden.yaml
