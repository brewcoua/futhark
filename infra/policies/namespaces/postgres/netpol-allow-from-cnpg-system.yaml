---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
#
# Without this the operator cannot reach the instance it manages and the Cluster never reports
# ready: 8000 is the instance manager, which is how the operator reads status and drives
# switchover, and how the Database and DatabaseRole objects get applied inside the pod.
#
# 5432 is included because the operator's own direct connections are not enumerated upstream, so
# the safe assumption is that it makes some. Narrow this to 8000 only if a rebuild proves it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-cnpg-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
        - port: 5432
