---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
# No netpol-allow-from-ingress-internal and no middleware-ratelimit, unlike every other node app:
# this one has no Ingress, so there is no router to rate limit and nothing should arrive from the
# ingress controller.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cli-proxy-api
resources:
  - ../_templates/netpol-default-deny
  - ../_templates/netpol-allow-same-namespace
  - ../_templates/netpol-allow-from-monitoring
  - netpol-allow-from-bifrost.yaml
