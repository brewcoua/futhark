---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
#
# Glance's Apps page renders this instance's /api/v1/endpoints/* over the cluster network, so it
# needs the same explicit opening as monitoring gives it. Same reasoning as
# ../monitoring/netpol-allow-from-glance.yaml: one file per consumer, so who reads what stays
# written down.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-glance
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: glance
      ports:
        - port: 8080
