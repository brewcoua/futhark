---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
#
# Vane queries this instance's JSON API over the cluster network rather than through its ingress
# host, so no mesh ipBlock covers it. Same reasoning as netpol-allow-from-open-webui.yaml: one
# file per consumer, so who reads what stays written down.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-vane
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vane
      ports:
        - port: 8080
