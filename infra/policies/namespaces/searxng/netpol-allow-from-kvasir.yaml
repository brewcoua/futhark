---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
#
# Kvasir queries this instance's JSON API over the cluster network, once per research question, so
# a run leans on it far harder than a person does. Same reasoning as netpol-allow-from-vane.yaml:
# one file per consumer, so who reads what stays written down.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-kvasir
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kvasir
      ports:
        - port: 8080
