---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
#
# Same baseline as infisical-infra. This tier namespace holds the backup-reader credential, the
# one identity that can read the B2 keys — see docs/src/conventions/secrets.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infisical-backup
resources:
  - ../_templates/netpol-default-deny
  - ../_templates/netpol-allow-same-namespace
  - ../_templates/netpol-allow-from-monitoring
