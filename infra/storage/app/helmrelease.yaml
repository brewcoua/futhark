---
# Provides the storagebox-crypt and gdrive-crypt StorageClasses. The node DaemonSet is left
# UNPINNED so a remote-backed PVC can mount wherever its pod lands.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-rclone
  namespace: flux-system
spec:
  interval: 1h
  releaseName: csi-driver-rclone
  targetNamespace: csi-rclone
  install:
    createNamespace: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: csi-driver-rclone
      version: "0.5.0" # image tag defaults to v{{ .Chart.AppVersion }}, so it follows the chart
      sourceRef:
        kind: HelmRepository
        name: csi-driver-rclone
        namespace: flux-system
  values:
    # The chart pins each Kubernetes CSI sidecar a version behind, far enough back to carry a
    # critical grpc CVE. Pinned here instead, in the repository+tag shape Renovate reads. Only the
    # sidecars are overridden; the rclone image still follows the chart's appVersion.
    image:
      csiProvisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.3.0
      livenessProbe:
        repository: registry.k8s.io/sig-storage/livenessprobe
        tag: v2.19.0
      nodeDriverRegistrar:
        repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
        tag: v2.17.0
    # No kubeletDir override: k3s uses the upstream /var/lib/kubelet the chart already assumes.
    # k0s did not, and getting that wrong times the install out on `/var/lib/kubelet/pods is not
    # a directory` — worth knowing before adding a distro that moves the kubelet root again.
    controller:
      resources:
        rclone:
          limits: { cpu: 200m }
        csiProvisioner:
          limits: { cpu: 100m }
        livenessProbe:
          limits: { cpu: 100m }
    node:
      resources:
        rclone:
          limits: { cpu: 200m }
        nodeDriverRegistrar:
          limits: { cpu: 100m }
        livenessProbe:
          limits: { cpu: 100m }
