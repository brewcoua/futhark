---
# Provides the storagebox-crypt and gdrive-crypt StorageClasses. The node DaemonSet is left
# UNPINNED so a remote-backed PVC can mount wherever its pod lands.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-rclone
  namespace: flux-system
spec:
  interval: 1h
  releaseName: csi-driver-rclone
  targetNamespace: csi-rclone
  install:
    createNamespace: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: csi-driver-rclone
      version: "0.5.0" # image tag defaults to v{{ .Chart.AppVersion }}, so it follows the chart
      sourceRef:
        kind: HelmRepository
        name: csi-driver-rclone
        namespace: flux-system
  values:
    # k0s runs kubelet with its own root, not the upstream default the chart assumes. Leave it
    # and every hostPath the node DaemonSet mounts points at /var/lib/kubelet, where only the
    # dirs these very mounts created exist — the pods/ subdir is under k0s's root, so the
    # DaemonSet never starts and the install times out on `/var/lib/kubelet/pods is not a
    # directory`.
    kubeletDir: /var/lib/k0s/kubelet
    controller:
      resources:
        rclone:
          limits: { cpu: 200m }
        csiProvisioner:
          limits: { cpu: 100m }
        livenessProbe:
          limits: { cpu: 100m }
    node:
      resources:
        rclone:
          limits: { cpu: 200m }
        nodeDriverRegistrar:
          limits: { cpu: 100m }
        livenessProbe:
          limits: { cpu: 100m }
