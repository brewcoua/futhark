---
# rclone CSI driver — mounts the Hetzner Storage Box and Google Drive as encrypted PVCs
# (OCI chart).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-rclone
  namespace: flux-system
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/veloxpack/charts
