---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: storagebox-secret
  namespace: csi-rclone
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-infra
  sources:
    - secretPath: /infra/csi-rclone
  targets:
    - kind: Secret
      name: storagebox-secret
      namespace: csi-rclone
      creationPolicy: Owner
      # csi-driver-rclone reads the whole rclone INI from a key named `configData`. Remapped
      # here for the same reason as cert-manager's `api-key` — the constraint is the driver's.
      #
      # The INI is assembled here rather than stored whole, as in velero-b2's `cloud`, so that
      # every credential is its own Infisical key and rotates on its own. What is committed is
      # the structure: the crypt section headers each StorageClass names in `remote:`, and the
      # option values that are decisions rather than credentials.
      #
      # STORAGEBOX_KEY_PEM is stored as the key file itself, newlines and all. rclone unquotes
      # key_pem as a Go string literal, so the INI needs `\n`; the store does not, and a key that
      # looks like a key is one less thing to get wrong at rotation.
      template:
        engineVersion: v1
        data:
          configData: |
            [storagebox]
            type = sftp
            host = {{ .STORAGEBOX_HOST.Value }}
            user = {{ .STORAGEBOX_USER.Value }}
            port = 23
            key_pem = {{ .STORAGEBOX_KEY_PEM.Value | replace "\n" "\\n" }}

            [storagebox-crypt]
            type = crypt
            remote = storagebox:
            password = {{ .STORAGEBOX_CRYPT_PASSWORD.Value }}
            password2 = {{ .STORAGEBOX_CRYPT_PASSWORD2.Value }}

            [gdrive]
            type = drive
            client_id = {{ .GDRIVE_CLIENT_ID.Value }}
            client_secret = {{ .GDRIVE_CLIENT_SECRET.Value }}
            scope = drive.file
            root_folder_id = {{ .GDRIVE_ROOT_FOLDER_ID.Value }}
            token = {{ .GDRIVE_TOKEN.Value }}

            [gdrive-crypt]
            type = crypt
            remote = gdrive:
            password = {{ .GDRIVE_CRYPT_PASSWORD.Value }}
            password2 = {{ .GDRIVE_CRYPT_PASSWORD2.Value }}
  syncOptions:
    refreshInterval: 1m
