---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace.json
# Every Namespace in the cluster, owned by one Kustomization that dependsOn nothing.
#
# They used to live next to the component that filled them, which deadlocks: infisical-operator
# runs the chart with scopedRBAC: true, so Helm emits a Role/RoleBinding *inside* each
# scopedNamespaces entry at install time — but those namespaces belong to components that
# dependsOn infisical-operator-config. The install failed with `namespaces "auth" not found`.
# See docs/src/conventions/ordering.md.
#
# One infisical-* namespace per tier, each holding that tier's operator, its InfisicalAuth and
# its copy of the universal-auth credential. The split is what makes the isolation real: with
# scopedRBAC: true the chart emits a Role/RoleBinding *per scoped namespace* and no cluster-wide
# secrets ClusterRole, so the node tier's ServiceAccount has no permissions at all in
# infisical-infra — it cannot read the infra tier's InfisicalAuth, let alone write a Secret into
# an infra namespace. See docs/src/conventions/secrets.md.
apiVersion: v1
kind: Namespace
metadata:
  name: infisical-infra
  labels:
    futk.eu/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: infisical-node-kenaz
  labels:
    futk.eu/tier: infra
---
# The backup tier is not a node tier: it exists so the B2 credentials sit behind a machine
# identity no other tier can authenticate as. Its operator's RBAC reaches only here and `k8up`.
# See docs/src/conventions/secrets.md.
apiVersion: v1
kind: Namespace
metadata:
  name: infisical-backup
  labels:
    futk.eu/tier: infra
---
# cert-manager and csi-rclone are also created implicitly by their HelmRelease's
# install.createNamespace: true (a harmless no-op once these exist) — declared here so Flux
# tracks/prunes them and they can carry labels.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    futk.eu/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: csi-rclone
  labels:
    futk.eu/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    futk.eu/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: k8up
  labels:
    futk.eu/tier: infra
---
# The CloudNativePG operator, and only the operator. Its chart's own default namespace, kept
# separate from the `postgres` namespace below so the thing that manages the database and the
# database itself have their own policy overlays: the operator's namespace has to accept
# admission calls from the apiserver, the data one never does.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    futk.eu/tier: infra
---
# The one PostgreSQL instance, shared by every service that needs a database. Infra tier rather
# than node: it serves both tiers, so its role passwords live under /infra/postgres. Tenancy is
# one Database and one DatabaseRole per service, in infra/postgres/config.
apiVersion: v1
kind: Namespace
metadata:
  name: postgres
  labels:
    futk.eu/tier: infra
---
# The Trivy operator and the scan Jobs it creates, which run here rather than beside the workload
# they scan (the chart's default). One namespace to hold both is what keeps the policy overlay to
# a single directory.
apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    futk.eu/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: auth
  labels:
    futk.eu/tier: infra
---
# The dashboard at home.$SUB_INTERNAL.$DOMAIN. Infra tier rather than a node app: everything on
# it is read out of monitoring, and monitoring's policy overlay names this namespace by hand.
apiVersion: v1
kind: Namespace
metadata:
  name: glance
  labels:
    futk.eu/tier: infra
---
# Every healthcheck in the cluster, and the status page at status.$SUB_INTERNAL.$DOMAIN. Infra
# tier: it probes infra and app hosts alike, and belongs to neither node.
apiVersion: v1
kind: Namespace
metadata:
  name: gatus
  labels:
    futk.eu/tier: infra
---
# The file manager at files.$SUB_INTERNAL.$DOMAIN. Infra tier: it mounts the two rclone remotes
# at their root, so it fronts cluster storage rather than any one node's data.
apiVersion: v1
kind: Namespace
metadata:
  name: copyparty
  labels:
    futk.eu/tier: infra
---
# The ingress controllers get their own namespaces instead of kube-system — a reserved namespace
# for cluster system components, not a place for a workload's HelmRelease to land.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-internal
  labels:
    futk.eu/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-edge
  labels:
    futk.eu/tier: infra
---
# Node/tenant namespaces (nodes/<hostname>.k8s/<app>/), one per app.
apiVersion: v1
kind: Namespace
metadata:
  name: actual
  labels:
    futk.eu/tier: node
    futk.eu/node: kenaz
---
# The LLM gateway at llm.$SUB_INTERNAL.$DOMAIN. Every model request in the cluster goes through
# it, so the provider credentials sit here rather than in each app that wants a model.
apiVersion: v1
kind: Namespace
metadata:
  name: bifrost
  labels:
    futk.eu/tier: node
    futk.eu/node: kenaz
---
# The subscription-CLI proxy behind bifrost. Its own namespace rather than a second workload in
# bifrost: it holds OAuth tokens for personal accounts, and keeping it separate means the only
# thing that can reach it is one named namespace rather than every pod beside it.
apiVersion: v1
kind: Namespace
metadata:
  name: cli-proxy-api
  labels:
    futk.eu/tier: node
    futk.eu/node: kenaz
---
# The chat UI at chat.$SUB_INTERNAL.$DOMAIN, talking to Ollama Cloud through bifrost. Node tier
# rather than infra: it is a tenant workload with its own data, and nothing else in the cluster
# reads it.
apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
  labels:
    futk.eu/tier: node
    futk.eu/node: kenaz
---
# The search engine at search.$SUB_INTERNAL.$DOMAIN. Its own namespace rather than a second
# workload in open-webui: it is a search engine the operator uses directly, and open-webui
# happens to be one more client of it.
apiVersion: v1
kind: Namespace
metadata:
  name: searxng
  labels:
    futk.eu/tier: node
    futk.eu/node: kenaz
---
# The bookmark manager at links.$SUB_INTERNAL.$DOMAIN. The first tenant of the shared PostgreSQL
# above: its rows live there, while the page archives and uploads stay on a PVC here.
apiVersion: v1
kind: Namespace
metadata:
  name: linkwarden
  labels:
    futk.eu/tier: node
    futk.eu/node: kenaz
---
# The quick answering engine at ask.$SUB_INTERNAL.$DOMAIN. Reads the searxng above and the
# bifrost above that, and keeps its own settings and history in SQLite on a PVC here.
apiVersion: v1
kind: Namespace
metadata:
  name: vane
  labels:
    futk.eu/tier: node
    futk.eu/node: kenaz
