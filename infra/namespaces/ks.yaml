---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
# A root with no dependsOn, upstream of everything that needs a namespace to already exist —
# which is any component whose chart writes into a namespace it does not own. See
# docs/src/conventions/ordering.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
spec:
  path: ./infra/namespaces/app
