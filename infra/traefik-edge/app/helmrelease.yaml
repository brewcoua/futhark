---
# Public edge ingress: binds 80/443 on the edge node's own interface. Give a public Ingress
# the class "edge" to route through here. ${PUBLIC_IP}/${MESH_IP} are substituted by
# postBuild.substituteFrom in ks.yaml, from the SOPS-encrypted edge-ips Secret committed in
# infra/edge-ips. MESH_IP is filled by hand — see docs/src/operations/setup.md step 7.
#
# hostNetwork: true means CNI NetworkPolicy enforcement never sees these sockets, so the
# ingress-edge baseline cannot govern this traffic — firewalld and the rate limiting below are
# what actually do. Why it's hostNetwork at all: docs/src/gitops/infra.md#the-two-ingresses.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-edge
  namespace: flux-system
spec:
  interval: 1h
  releaseName: traefik-edge
  targetNamespace: ingress-edge
  # traefik-internal owns the Traefik CRDs (installed once); this release must not also try to
  # own them, or Helm errors on CRD ownership.
  dependsOn:
    - name: traefik-internal
  install:
    createNamespace: true
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  chart:
    spec:
      chart: traefik
      version: "41.*" # Traefik v3.7.x; pin a patch for reproducibility
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      kind: Deployment
      replicas: 1
      dnsPolicy: ClusterFirstWithHostNet
    updateStrategy:
      type: Recreate
      rollingUpdate: null
    service:
      enabled: false
    ingressClass:
      enabled: true
      name: edge
      isDefaultClass: false
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: edge
      kubernetesCRD:
        enabled: true
        ingressClass: edge
    hostNetwork: true
    # Real 80/443 on the host, so the container needs the one capability the chart drops.
    # traefik-internal doesn't: it stays on the chart's unprivileged 8000/8443 behind a Service.
    securityContext:
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
    # kenaz is the only node with a public IP — pin here so the scheduler never lands this pod
    # on ogma, where neither hostIP below exists on any interface.
    nodeSelector:
      kubernetes.io/hostname: kenaz
    ports:
      web:
        port: 80
        hostIP: ${PUBLIC_IP}
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        port: 443
        hostIP: ${PUBLIC_IP}
        http:
          tls:
            enabled: true
      # Bound to the mesh IP, not the public one, so the dashboard/API is reachable over the
      # tailnet only, never on kenaz's public interface.
      traefik:
        port: 8081
        hostIP: ${MESH_IP}
      metrics:
        port: 9181
        hostIP: ${MESH_IP}
        exposedPort: 9181
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
    accessLog:
      enabled: true
      format: json
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
