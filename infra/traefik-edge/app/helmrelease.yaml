---
# Public edge ingress: binds 443 (TLS only) on the edge node's own interface. Give a public Ingress
# the class "edge" to route through here. ${PUBLIC_IP}/${MESH_IP} are substituted by
# postBuild.substituteFrom in ks.yaml, from the SOPS-encrypted edge-ips Secret committed in
# infra/substitutions. MESH_IP is filled by hand — see docs/src/operations/setup.md step 7.
#
# hostNetwork: true means CNI NetworkPolicy enforcement never sees these sockets, so the
# ingress-edge baseline cannot govern this traffic — firewalld and the rate limiting below are
# what actually do. Why it's hostNetwork at all: docs/src/gitops/infra.md#the-two-ingresses.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-edge
  namespace: flux-system
spec:
  interval: 1h
  releaseName: traefik-edge
  targetNamespace: ingress-edge
  # traefik-internal owns the Traefik CRDs (installed once); this release must not also try to
  # own them, or Helm errors on CRD ownership.
  dependsOn:
    - name: traefik-internal
  install:
    createNamespace: true
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  chart:
    spec:
      chart: traefik
      version: "41.0.*" # chart 41.0.x -> Traefik v3.7.x
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      kind: Deployment
      replicas: 1
      dnsPolicy: ClusterFirstWithHostNet
    updateStrategy:
      type: Recreate
      rollingUpdate: null
    service:
      enabled: false
    ingressClass:
      enabled: true
      name: edge
      isDefaultClass: false
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: edge
      kubernetesCRD:
        enabled: true
        ingressClass: edge
    hostNetwork: true
    # kenaz's net.ipv4.ip_unprivileged_port_start is lowered to 443 (ansible/roles/
    # firewall_ingress) so this can bind 443 as the chart's default non-root user, without
    # NET_BIND_SERVICE — this node's containerd never propagates that capability to a non-root
    # process (containerd/containerd#5644), so granting it here would have no effect anyway.
    # kenaz is the only node with a public IP — pin here so the scheduler never lands this pod
    # on ogma, where neither hostIP below exists on any interface.
    nodeSelector:
      kubernetes.io/hostname: kenaz
    ports:
      # No plaintext HTTP — this edge only ever serves TLS. `null` removes the chart's
      # default web (80) entryPoint entirely, rather than just hiding its Service port.
      web: null
      websecure:
        port: 443
        hostIP: ${PUBLIC_IP}
        http:
          tls:
            enabled: true
      # Bound to the mesh IP, not the public one, so the dashboard/API is reachable over the
      # tailnet only, never on kenaz's public interface.
      traefik:
        port: 8081
        hostIP: ${MESH_IP}
      metrics:
        port: 9181
        hostIP: ${MESH_IP}
        exposedPort: 9181
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
    accessLog:
      enabled: true
      format: json
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
