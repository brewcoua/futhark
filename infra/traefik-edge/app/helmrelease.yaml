---
# Public edge ingress: binds 80/443 on kenaz's public IP. Give a public Ingress the class
# "edge" to route through here. ${PUBLIC_IP}/${MESH_IP} below are substituted by
# postBuild.substituteFrom in ks.yaml, from the kenaz-ips ConfigMap ansible-pushed straight
# into the cluster (never git) — see ansible/roles/flux_bootstrap.
#
# hostNetwork: true is required — this is the only node with a public IP, there's no
# LoadBalancer/MetalLB to hand it a Service address (deliberately dropped in favor of the
# Tailscale operator for everything internal, see infra/traefik-internal), so it binds
# directly to kenaz's own interface. That means it shares kenaz's network namespace: the
# ingress-edge NetworkPolicy baseline (infra/configs/namespaces/ingress-edge) does not and
# cannot govern its traffic — CNI NetworkPolicy enforcement never sees hostNetwork sockets.
# The actual controls here are firewalld (ansible/roles/firewall_ingress, public zone limited
# to 80/443 + the hardened SSH port) and this chart's own rate limiting.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-edge
  namespace: flux-system
spec:
  interval: 1h
  releaseName: traefik-edge
  targetNamespace: ingress-edge
  # traefik-internal owns the Traefik CRDs (installed once); this release must not also try to
  # own them, or Helm errors on CRD ownership.
  dependsOn:
    - name: traefik-internal
  install:
    createNamespace: true
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  chart:
    spec:
      chart: traefik
      version: "41.*" # Traefik v3.7.x; pin a patch for reproducibility
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      kind: Deployment
      replicas: 1
      dnsPolicy: ClusterFirstWithHostNet
    updateStrategy:
      type: Recreate
      rollingUpdate: null
    service:
      enabled: false
    ingressClass:
      enabled: true
      name: edge
      isDefaultClass: false
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: edge
      kubernetesCRD:
        enabled: true
        ingressClass: edge
    hostNetwork: true
    # kenaz is the only node with a public IP — pin here so the scheduler never lands this pod
    # on ogma, where neither hostIP below exists on any interface.
    nodeSelector:
      kubernetes.io/hostname: kenaz
    ports:
      web:
        port: 80
        hostIP: ${PUBLIC_IP}
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        port: 443
        hostIP: ${PUBLIC_IP}
        http:
          tls:
            enabled: true
      # Bound to the mesh IP, not the public one, so the dashboard/API is reachable over the
      # tailnet only, never on kenaz's public interface.
      traefik:
        port: 8081
        hostIP: ${MESH_IP}
      metrics:
        port: 9181
        hostIP: ${MESH_IP}
        exposedPort: 9181
    metrics:
      prometheus:
        entryPoint: metrics
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
    accessLog:
      enabled: true
      format: json
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
