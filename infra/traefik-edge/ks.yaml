---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-edge
spec:
  path: ./infra/traefik-edge/app
  dependsOn:
    - name: traefik-internal
  # The public-ingress host's public/mesh IPs, ansible-pushed straight into the cluster (never
  # git) — see ansible/roles/flux_bootstrap. Consumed as ${PUBLIC_IP}/${MESH_IP} in
  # app/helmrelease.yaml.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: edge-ips
