---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-edge
spec:
  path: ./infra/traefik-edge/app
  dependsOn:
    - name: traefik-internal
    - name: substitutions
  # The public-ingress host's public/mesh IPs, committed SOPS-encrypted in config/sops/.
  # Consumed as ${PUBLIC_IP}/${MESH_IP} in app/helmrelease.yaml.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-values
