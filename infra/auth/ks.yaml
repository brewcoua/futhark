---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auth
spec:
  path: ./infra/auth/app
  dependsOn:
    - name: infisical-operator-config
    # app/ingress.yaml needs cert-manager's ClusterIssuer (letsencrypt-bunny) and the
    # ingressClassName: edge controller — the only edge-exposed component, previously the
    # weakest dependsOn in the tree.
    - name: cert-manager-config
    - name: traefik-edge
    # app/oauth2-proxy-ingress.yaml is internal-class, and app/middleware-sso.yaml needs the
    # Middleware CRD traefik-internal's release installs.
    - name: traefik-internal
    - name: substitutions
    # Pocket ID's database moved to the shared instance. This is the heaviest edge in the tree:
    # it makes every login in the cluster wait on a single-instance Postgres pinned to kenaz,
    # where Pocket ID itself runs on ogma and used to survive kenaz being down. Taken knowingly,
    # to trade that for a backup that is consistent rather than a live SQLite file copy.
    # See docs/src/gitops/infra.md.
    - name: postgres-config
  # ${DOMAIN} — the ingress host, the TLS SAN and Pocket ID's own APP_URL. ${SUB_INTERNAL} joins
  # it for oauth2-proxy's callback host and cookie domain.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-values
