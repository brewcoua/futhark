---
# The fleet's SSO gate, referenced from any namespace as auth-sso@kubernetescrd — cross-namespace
# Middleware references are what traefik-internal's allowCrossNamespace: true was turned on for.
# Add it after the namespace's own ratelimit middleware on an Ingress that should require a login:
#
#   traefik.ingress.kubernetes.io/router.middlewares: <ns>-ratelimit@kubernetescrd,auth-sso@kubernetescrd
#
# The address is the in-cluster Service, not sso.${SUB_INTERNAL}.${DOMAIN}: OAUTH2_PROXY_REVERSE_PROXY
# makes oauth2-proxy build the redirect from the X-Forwarded-* headers Traefik sends, so there is
# no reason to hairpin the check back out through the mesh IP. Requests to `/` return 202 when the
# session cookie is valid and 302 to Pocket ID when it is not, which Traefik passes straight back
# to the browser.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso
  namespace: auth
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/
    trustForwardHeader: true
    # Only meaningful for a backend that reads them; harmless for one that does not. Traefik
    # drops each of these from the incoming request before setting it from the auth response, so
    # listing a header here is also what stops a client from forging it. infra/copyparty is the
    # one backend that reads them today, and the groups entry is there for its access control.
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
