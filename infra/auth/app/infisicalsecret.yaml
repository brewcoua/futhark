---
# POCKETID_ENCRYPTION_KEY: openssl rand -base64 32, stored once in Infisical at /infra/auth.
# MAXMIND_LICENSE_KEY: from the MaxMind account, same folder. Both land in one Secret because
# a single secretPath maps to a single target. app/deployment.yaml mounts each as a file, and
# maps the key to the filename Pocket ID expects.
#
# POSTGRES_PASSWORD is seeded by hand in the same folder. It is the same value as
# POCKETID_POSTGRES_PASSWORD in /infra/postgres and has to be filed in both places: the
# ValidatingAdmissionPolicy confines a namespace to its own tier's folder, and both of these are
# infra tier but different folders. Rotating it means changing both, in the order given in
# docs/src/operations/rotation.md.
#
# A template block, because DB_CONNECTION_STRING is not a stored value: only its password is.
# Everything else in it is cluster-internal and belongs in git. Pocket ID reads no DB_PROVIDER;
# it infers the driver from the scheme. The password is interpolated into a URL, so generate it
# from letters and digits only: anything needing percent-encoding parses wrong or not at all.
#
# A template also narrows this Secret to the three keys named below, where the pass-through it
# replaced carried every key in /infra/auth, oauth2-proxy's included.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: pocketid
  namespace: auth
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-infra
  sources:
    - secretPath: /infra/auth
  targets:
    - kind: Secret
      name: pocketid-secrets
      namespace: auth
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          POCKETID_ENCRYPTION_KEY: "{{ .POCKETID_ENCRYPTION_KEY.Value }}"
          MAXMIND_LICENSE_KEY: "{{ .MAXMIND_LICENSE_KEY.Value }}"
          DB_CONNECTION_STRING: "postgresql://pocketid:{{ .POSTGRES_PASSWORD.Value }}@postgres-rw.postgres.svc.cluster.local:5432/pocketid"
  syncOptions:
    refreshInterval: 1m
