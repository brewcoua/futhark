---
# Same folder as pocketid's own secret — one Pocket ID deployment, one place its credentials
# live. Three keys are picked out of it here:
#   SSO_OIDC_CLIENT_ID / SSO_OIDC_CLIENT_SECRET  minted by tofu/oidc's pocketid_client.sso
#   SSO_COOKIE_SECRET                            seeded by hand, `openssl rand -base64 32 |
#                                                tr -- '+/' '-_'`, see docs/src/infra/sso.md
# The template block is what keeps SCREAMING_SNAKE_CASE Infisical names from having to be the
# names oauth2-proxy reads: it consumes the target Secret whole via envFrom, so every key in it
# has to be a valid OAUTH2_PROXY_* variable.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-infra
  sources:
    - secretPath: /infra/auth
  targets:
    - kind: Secret
      name: oauth2-proxy-secrets
      namespace: auth
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          OAUTH2_PROXY_CLIENT_ID: "{{ .SSO_OIDC_CLIENT_ID.Value }}"
          OAUTH2_PROXY_CLIENT_SECRET: "{{ .SSO_OIDC_CLIENT_SECRET.Value }}"
          OAUTH2_PROXY_COOKIE_SECRET: "{{ .SSO_COOKIE_SECRET.Value }}"
  syncOptions:
    refreshInterval: 1m
