---
# Pocket ID's SQLite DB + app data. local-path is node-local hostPath storage — avoids the
# locking issues a network filesystem (storagebox-crypt) can cause for SQLite, same
# reasoning as nodes/kenaz.k0s/actual's pvc-server-files.yaml. Node-local, so the volume is
# opted into Velero's nightly backup by the annotation on deployment.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocketid-data
  namespace: auth
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
