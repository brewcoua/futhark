---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketid
  namespace: auth
spec:
  replicas: 1
  # Single-writer SQLite on a non-shared volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocketid
  template:
    metadata:
      labels:
        app: pocketid
      annotations:
        # Users, passkeys and OIDC clients. Small, and the thing tofu/oidc's state assumes still
        # exists. See docs/src/operations/recovery.md.
        backup.velero.io/backup-volumes: data
    spec:
      nodeSelector:
        kubernetes.io/hostname: ogma
      # Same UID/GID convention as nodes/kenaz.k0s/actual's deployment. Not
      # readOnlyRootFilesystem: Pocket ID's cache/tmp write behavior under it is unverified.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: pocketid
          image: ghcr.io/pocket-id/pocket-id:v2.11.0@sha256:b7c37ab3044e53fd29b5f7295eebff5fdc0367dc043f36b41bcbe1815fcd965d
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 1411
          envFrom:
            - configMapRef:
                name: pocketid-config
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: encryption-key
              mountPath: /run/secrets/pocketid_encryption_key
              subPath: encryption_key
              readOnly: true
            - name: maxmind-key
              mountPath: /run/secrets/maxmind_license_key
              subPath: maxmind_license_key
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocketid-data
        - name: encryption-key
          secret:
            secretName: pocketid-secrets
            items:
              # key is the Secret key (Infisical's naming convention, see
              # docs/src/conventions/secrets.md); path is the filename Pocket ID reads.
              - key: POCKETID_ENCRYPTION_KEY
                path: encryption_key
        - name: maxmind-key
          secret:
            secretName: pocketid-secrets
            items:
              - key: MAXMIND_LICENSE_KEY
                path: maxmind_license_key
