---
# encryption_key: openssl rand -base64 32, seeded once into OpenBao (secret/pocketid/encryption-key,
# field "encryption_key"). maxmind_license_key: futharkd/pocketid/license key from Proton Pass,
# seeded into secret/pocketid/maxmind, field "maxmind_license_key". See the plan's Prerequisites.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocketid
  namespace: auth
spec:
  secretStoreRef:
    name: bao-infra
    kind: ClusterSecretStore
  target:
    name: pocketid-secrets
    namespace: auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: pocketid/encryption-key
    - extract:
        key: pocketid/maxmind # gitleaks:allow -- OpenBao path, not a credential
