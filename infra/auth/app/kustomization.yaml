---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - configmap.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Splices DOMAIN (Pocket ID is edge-exposed, not internal) into APP_URL and the ingress
# host/tls — see infra/monitoring/app/kustomization.yaml and docs/src/conventions/domains.md.
components:
  - ../../../config/domain
  - ../../../config/infisical

replacements:
  - source:
      kind: ConfigMap
      name: domain
      fieldPath: data.DOMAIN
    targets:
      - select:
          kind: ConfigMap
          name: pocketid-config
        fieldPaths:
          - data.APP_URL
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Ingress
          name: pocketid
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
        options:
          delimiter: "."
          index: 1
