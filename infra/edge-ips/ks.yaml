---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
# Deliberately dependency-free, and deliberately its own Kustomization rather than part of
# infra-configs: a postBuild.substituteFrom target must exist before its consumers reconcile,
# and infra-configs dependsOn traefik-edge — which is one of the consumers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge-ips
spec:
  path: ./infra/edge-ips/app
