---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
# Split from ks.yaml: the Cluster, Database and DatabaseRole here need the CloudNativePG CRDs and
# its admission webhook to already exist, which their own Kustomization cannot guarantee for
# itself. Same shape as infra/cert-manager/config-ks.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-config
spec:
  path: ./infra/postgres/config
  dependsOn:
    - name: postgres
    # The Cluster's volume comes from local-path, which k3s ships, but the storage Kustomization
    # is what this cluster treats as the readiness gate for any PVC-backed workload.
    - name: storage
    - name: infisical-operator-config
  # Without these, `dependsOn: postgres-config` promises less than it looks like it does. These CRs
  # carry a status of {applied, observedGeneration} and no conditions array, so kstatus cannot
  # assess them and `wait: true` reports the Kustomization Ready the moment they are applied to the
  # API server rather than when the instance manager has actually created the database. A tenant
  # gated on that edge then starts against a database that does not exist yet, which is not a
  # permission it can be granted its way out of: Prisma reacts by trying CREATE DATABASE, and a
  # role that owns one database deliberately cannot.
  #
  # healthCheckExprs rather than healthChecks: the two are not alternatives. Flux ignores
  # healthChecks entirely under `wait: true`, and evaluates these only under it.
  #
  # `current` only, deliberately. A `failed` expression on `status.applied == false` reads a
  # controller mid-convergence as a terminal failure: CloudNativePG applies a Database before the
  # DatabaseRole that owns it exists, reports applied: false once, then succeeds on its own
  # retry. Flux saw the first report, gave up with "failed early due to stalled resources", and
  # took every tenant down with it. Without `failed`, an object that never converges runs out the
  # Kustomization's timeout instead, which is the honest outcome for a controller that retries.
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied == true
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: has(status.applied) && status.applied == true
