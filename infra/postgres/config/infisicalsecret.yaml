---
# One role password per tenant, in the shape CloudNativePG requires: a kubernetes.io/basic-auth
# Secret whose `username` matches the role it belongs to.
#
# The path is /infra/postgres and not the tenant's own folder, and that is the
# ValidatingAdmissionPolicy doing its job rather than an oversight: this namespace is infra tier,
# so infra/infisical-operator/config/validatingadmissionpolicy.yaml refuses any secretPath
# outside /infra. The consequence is that a role password is filed twice, once here and once in
# the tenant's DATABASE_URL, and a rotation has to change both. See docs/src/operations/rotation.md.
#
# cnpg.io/reload: "true" is what makes a rotation take effect on the next sync instead of at the
# next reconciliation of the Cluster.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: postgres-roles
  namespace: postgres
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-infra
  sources:
    - secretPath: /infra/postgres
  targets:
    - kind: Secret
      name: postgres-role-linkwarden
      namespace: postgres
      creationPolicy: Owner
      secretType: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: linkwarden
          password: "{{ .LINKWARDEN_POSTGRES_PASSWORD.Value }}"
  syncOptions:
    refreshInterval: 1m
