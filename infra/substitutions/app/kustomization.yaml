---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
# Every `postBuild.substituteFrom` source in the cluster, in one place. They were three separate
# Kustomizations (`edge-ips`, `int-domain`, and a third for `${DOMAIN}`), each dependency-free
# and each holding a single object — three roots to express one idea.
#
# The Component generates the `domain` ConfigMap from config/domain/domain.env, which stays the
# single source; this only publishes it. The two Secrets are SOPS-encrypted and sealed to the
# cluster age key as well as the operator's, since Flux decrypts them in-cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - edge-ips.sops.yaml
  - int-domain.sops.yaml
components:
  - ../../../config/domain
