---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
# Every `postBuild.substituteFrom` source in the cluster, in one place. They were separate
# Kustomizations, each dependency-free and each holding a single object — several roots to
# express one idea.
#
# `dns` lives under config/ rather than here: tofu reads the same file through its refs.env, so
# it is not a cluster-only value. The Secrets are SOPS-encrypted and sealed to the cluster age
# key as well as the operator's, since Flux decrypts them in-cluster. monitoring-sizing is a
# plain ConfigMap — its values are tuning knobs, not identifying ones.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - edge-ips.sops.yaml
  - ../../../config/dns
  - backup-location.sops.yaml
  - monitoring-sizing.yaml
