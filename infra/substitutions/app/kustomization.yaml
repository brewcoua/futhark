---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
# Every `postBuild.substituteFrom` source in the cluster, in one place.
#
# The identifying ones are the single `cluster-values` Secret under config/sops/, which is where
# every encrypted file in this repo lives — ansible and tofu read the same file, so it is not a
# cluster-only value. monitoring-sizing is a plain ConfigMap: its values are tuning knobs, not
# identifying ones.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../config/sops
  - monitoring-sizing.yaml
