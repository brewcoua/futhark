---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty
  namespace: copyparty
spec:
  replicas: 1
  # The index in /hist is SQLite on a ReadWriteOnce volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: copyparty
  template:
    metadata:
      labels:
        app: copyparty
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Not optional on the two rclone volumes. csi-driver-rclone advertises VOLUME_MOUNT_GROUP,
        # so the kubelet passes this down as the mount's group instead of walking and chowning the
        # volume, and the driver turns it into rclone's --uid/--gid. Without it the FUSE mount
        # belongs to the mounting process alone and every access from uid 1000 is EACCES, which
        # copyparty reports as `cannot access /w/...: FileExistsError(17)`.
        fsGroup: 1000
      containers:
        - name: copyparty
          image: ghcr.io/9001/copyparty-ac:1.20.21@sha256:341e3b6ee5fe4fc667435d96534d07b98060394024eb8c6f16a054a7e49a77bc
          ports:
            - name: http
              containerPort: 3923
          env:
            # The image sets this to /cfg, which is the read-only ConfigMap. copyparty falls back
            # to /tmp when it cannot write there, decides its own state is untrusted, and disables
            # both sessions and idp-store as a safeguard. Its own `% /cfg` include is hardcoded in
            # /z/initcfg, so moving this does not stop the config being read.
            - name: XDG_CONFIG_HOME
              value: /hist/xdg
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /cfg
              readOnly: true
            - name: storagebox
              mountPath: /w/storagebox
            - name: gdrive
              mountPath: /w/gdrive
            - name: hist
              mountPath: /hist
            # The image's WORKDIR, which copyparty writes to when a setting does not name a path
            # of its own. Nothing in it needs to survive a restart.
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: copyparty-config
        - name: storagebox
          persistentVolumeClaim:
            claimName: copyparty-storagebox
        - name: gdrive
          persistentVolumeClaim:
            claimName: copyparty-gdrive
        - name: hist
          persistentVolumeClaim:
            claimName: copyparty-hist
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
