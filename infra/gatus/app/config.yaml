# Every healthcheck in the cluster, in one place. Glance reads this instance's API rather than
# probing anything itself (see infra/glance/config/widget-gatus.yml), so a check is written once
# and shows up on both the status page and the dashboard.
#
# Unlike infra/glance, this file is expanded by Flux: postBuild fills in the hostnames. See
# ../ks.yaml. Write no bare dollar-brace pair anywhere in here, comments included: envsubst reads
# the whole file and an empty variable name fails the build.
#
# Gatus does spell its own placeholders the same way, because it runs os.ExpandEnv over these
# bytes at load. Two expansions over one file, so a value meant for Gatus has to survive the
# first: doubling the dollar is envsubst's escape, and postBuild writes a single dollar into the
# generated ConfigMap for Gatus to expand from its environment. That is how the database password
# reaches storage.path below without ever being committed here.
#
# Every endpoint is probed over its public name through traefik-internal, not over a cluster
# Service, deliberately: that path also covers DNS, the mesh route, the router and the
# certificate, which is what actually breaks.
#
# Every endpoint asserts more than a status code, because a service that answers slowly or sits
# behind a certificate nobody is renewing is not healthy:
#   [CONNECTED]              separates "TCP/TLS never came up" from "answered wrongly"
#   [CERTIFICATE_EXPIRATION] cert-manager renews at 30 days, so under 10 days left means the
#                            renewal itself has stopped working
#   [RESPONSE_TIME]          1s for a health handler, 2s for the two endpoints that render a page
#   [BODY]                   proves the process is serving, not merely listening
storage:
  # The shared instance in infra/postgres. This was `type: memory`, which lost every result on
  # restart; uptime percentages now survive one. Still no PVC and nothing for k8up: the nightly
  # pg_dumpall covers it.
  #
  # The cost is an ordering edge. Gatus cannot start if Postgres is down, so the status page is
  # unavailable in exactly the outage it would be most wanted for. Alerting does not run through
  # here, so a down cluster still pages; see docs/src/gitops/infra.md.
  type: postgres
  path: "$${GATUS_DB_URL}"

ui:
  title: futhark status
  header: futhark

endpoints:
  - name: Grafana
    group: Core
    url: https://dash.${SUB_INTERNAL}.${DOMAIN}/api/health
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY].database == ok"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: VictoriaMetrics
    group: Core
    url: https://metrics.${SUB_INTERNAL}.${DOMAIN}/health
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY] == pat(*OK*)"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: VictoriaLogs
    group: Core
    url: https://logs.${SUB_INTERNAL}.${DOMAIN}/health
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY] == pat(*OK*)"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  # 204, not 200: Pocket ID's healthz answers with no content at all, so there is no body to assert.
  - name: Pocket ID
    group: Core
    url: https://auth.${DOMAIN}/healthz
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 204"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: oauth2-proxy
    group: Core
    url: https://sso.${SUB_INTERNAL}.${DOMAIN}/ping
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY] == pat(*OK*)"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  # Behind auth-sso, so an anonymous probe is redirected to Pocket ID. A 302 here means the
  # forwardAuth chain is intact; a 200 would mean the login had stopped being enforced — or that
  # the redirect was followed, which is why ignore-redirect is set. Gatus spells the option that
  # way; a `follow-redirects` key is silently ignored and the check then measures Pocket ID's
  # login page instead. The redirect body is empty, so the status is the whole assertion.
  - name: Glance
    group: Apps
    url: https://home.${SUB_INTERNAL}.${DOMAIN}
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 302"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  # Behind auth-sso as well, so the same 302 assertion as Glance applies.
  - name: Copyparty
    group: Apps
    url: https://files.${SUB_INTERNAL}.${DOMAIN}
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 302"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  # Behind auth-sso as well, so the same 302 assertion as Glance applies.
  - name: SearXNG
    group: Apps
    url: https://search.${SUB_INTERNAL}.${DOMAIN}
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 302"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  # Both of the next two sit behind auth-sso, so the 302 is oauth2-proxy answering and the check
  # reaches the router rather than the app. Same shape as SearXNG above.
  - name: Vane
    group: Apps
    url: https://ask.${SUB_INTERNAL}.${DOMAIN}
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 302"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  # Open WebUI is its own OIDC client rather than an auth-sso tenant, so the unauthenticated
  # request reaches the app and its login page renders 200.
  - name: Open WebUI
    group: Apps
    url: https://chat.${SUB_INTERNAL}.${DOMAIN}
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  # Unauthenticated requests are redirected to the login page rather than served it, so this
  # asserts the redirect instead of a 200. Reaching that far still proves the pod answered, and
  # the pod cannot start without its database.
  - name: Linkwarden
    group: Apps
    url: https://links.${SUB_INTERNAL}.${DOMAIN}
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  # /health is outside the inference paths, so it answers without a virtual key. It pings the
  # config store before replying and returns 503 if that fails, so the body assertion covers the
  # SQLite volume as well as the process.
  - name: Bifrost
    group: Apps
    url: https://llm.${SUB_INTERNAL}.${DOMAIN}/health
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  # Behind auth-sso like Vane, but its Ingress leaves /healthz and /readyz outside the middleware,
  # so this asserts a body rather than a redirect. /healthz deliberately, not /readyz: the latter
  # reaches out to bifrost and searxng, both of which have rows of their own here, so one outage
  # would paint three red instead of one.
  - name: Kvasir
    group: Apps
    url: https://research.${SUB_INTERNAL}.${DOMAIN}/healthz
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: Actual
    group: Apps
    url: https://actual.${SUB_INTERNAL}.${DOMAIN}
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - '[BODY] == pat(*<div id="root">*)'
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 240h"
