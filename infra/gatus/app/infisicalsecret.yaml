---
# One key at /infra/gatus, POSTGRES_PASSWORD, seeded by hand. It is the same value as
# GATUS_POSTGRES_PASSWORD in /infra/postgres and has to be filed in both places: the
# ValidatingAdmissionPolicy confines a namespace to its own tier's folder, and both of these are
# infra tier but different folders. Rotating it means changing both, in the order given in
# docs/src/operations/rotation.md.
#
# A template block, because the connection URL is not a stored value: only its password is.
# Everything else in it is cluster-internal and belongs in git. The password is interpolated into
# a URL, so generate it from letters and digits only: anything needing percent-encoding produces
# a connection string that parses wrong or not at all.
#
# sslmode=disable, matching every other tenant. CloudNativePG's pg_hba ends in
# `host all all all scram-sha-256`, which accepts a plaintext connection.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: gatus
  namespace: gatus
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-infra
  sources:
    - secretPath: /infra/gatus
  targets:
    - kind: Secret
      name: gatus-secrets
      namespace: gatus
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          GATUS_DB_URL: "postgres://gatus:{{ .POSTGRES_PASSWORD.Value }}@postgres-rw.postgres.svc.cluster.local:5432/gatus?sslmode=disable"
  syncOptions:
    refreshInterval: 1m
