---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: gatus
          image: twinproduction/gatus:v5.36.0@sha256:c5f210d095fa78e6efaa20ffeb14803f2ba4f10615e16a6d12087697149617f0
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          env:
            # The image defaults this to empty, which makes Gatus search its working directory.
            # Naming the file is what lets the ConfigMap mount stay read-only.
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
            - name: TZ
              value: Europe/Amsterdam
          # GATUS_DB_URL, which config.yaml reads back through Gatus's own os.ExpandEnv rather
          # than having it baked into the generated ConfigMap.
          envFrom:
            - secretRef:
                name: gatus-secrets
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          # /health is Gatus reporting on itself and never touches an endpoint, so a service that
          # is genuinely down never restarts the pod that is meant to be reporting it.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: gatus-config
