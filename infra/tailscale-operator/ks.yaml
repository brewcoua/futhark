---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator
spec:
  path: ./infra/tailscale-operator/app
  # config-ks.yaml, not namespaces: the operator Deployment mounts the Secret that produces —
  # this is the one operator whose config is a prerequisite rather than a follow-on. It reaches
  # namespaces transitively, through infisical-operator-config.
  dependsOn:
    - name: tailscale-operator-config
