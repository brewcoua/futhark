---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
# Split from ks.yaml: the ExternalSecret here needs the external-secrets CRDs and OpenBao's
# ClusterSecretStore to already exist, which the operator's own Kustomization can't guarantee
# for itself (chicken-and-egg on first apply) — same pattern as cert-manager/config-ks.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator-config
spec:
  path: ./infra/tailscale-operator/config
  dependsOn:
    - name: tailscale-operator
    - name: external-secrets-config
