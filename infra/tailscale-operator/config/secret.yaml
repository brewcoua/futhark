---
# Tailscale OAuth client (scoped to the Kubernetes operator, tagged tag:k8s-operator in the
# tailnet ACL — created once, manually, in the Tailscale admin console). Synced from Infisical's
# /infra/tailscale folder. Keys must be named client_id/client_secret exactly — that's the
# pre-created-secret shape the operator chart auto-detects (secret name operator-oauth, same
# namespace as the operator), so they must carry those names in Infisical too.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-infra
  sources:
    - secretPath: /infra/tailscale
  targets:
    - kind: Secret
      name: operator-oauth
      namespace: tailscale
      creationPolicy: Owner
      # The operator chart auto-detects a pre-created Secret only when its keys are exactly
      # client_id/client_secret. Remapped here rather than in Infisical — the constraint is the
      # chart's, and it is easier to find next to the thing that imposes it.
      template:
        engineVersion: v1
        data:
          client_id: "{{ .TAILSCALE_CLIENT_ID }}"
          client_secret: "{{ .TAILSCALE_CLIENT_SECRET }}"
  syncOptions:
    refreshInterval: 1m
