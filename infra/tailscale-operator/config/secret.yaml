---
# Tailscale OAuth client (scoped to the Kubernetes operator, tagged tag:k8s-operator in the
# tailnet ACL — created once, manually, in the Tailscale admin console). Synced from OpenBao's
# infra namespace via infra/external-secrets/app/clustersecretstore-infra.yaml. Keys must be
# named client_id/client_secret exactly — that's the pre-created-secret shape the operator
# chart auto-detects (secret name operator-oauth, same namespace as the operator).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  secretStoreRef:
    name: bao-infra
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    namespace: tailscale
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tailscale/operator-oauth
