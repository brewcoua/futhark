---
# ESO's own namespace. Only two things live here now: the Bitwarden machine-account token that
# the ClusterSecretStore authenticates with, and the cert-manager-issued CA for the
# bitwarden-sdk-server, which the store reads via caProvider.
#
# The previous serviceaccounts + serviceaccounts/token grant is gone with OpenBao: it existed so
# ESO could mint a TokenRequest for OpenBao's kubernetes auth method. Bitwarden Secrets Manager
# authenticates with a static token instead, so ESO no longer needs to mint anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-controller
  namespace: external-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-controller
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-controller
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
