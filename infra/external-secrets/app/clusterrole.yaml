---
# Replaces the chart's own cluster-wide RBAC (disabled via values.rbac.create: false in
# helmrelease.yaml) with a slim ClusterRole covering only what's genuinely cluster-scoped:
# ClusterSecretStore and core Namespace objects. No `secrets` access here — that's granted per
# namespace by the rbac-eso-writer template. No `namespaces update/patch` (only needed for
# ClusterExternalSecret) and no generators rule; neither is used in this repo. See
# docs/src/conventions/secrets.md#eso-rbac.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-controller
rules:
  - apiGroups: [external-secrets.io]
    resources: [clustersecretstores]
    verbs: [get, list, watch]
  - apiGroups: [external-secrets.io]
    resources: [clustersecretstores/status]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-controller
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
