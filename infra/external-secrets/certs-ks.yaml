---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
# Split out of config-ks.yaml, and ahead of the operator rather than behind it: the chart's
# bitwarden-sdk-server Deployment mounts the Secret this Certificate issues, so the Helm install
# never goes Ready while the cert waits on the install. Same inversion as
# tailscale-operator/config-ks.yaml — see docs/src/conventions/ordering.md.
#
# The ClusterSecretStore stays in config/, downstream, because it needs the ESO CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-certs
spec:
  path: ./infra/external-secrets/certs
  dependsOn:
    - name: namespaces
    - name: cert-manager
