---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
spec:
  path: ./infra/external-secrets/app
  # certs, not namespaces: the chart's bitwarden-sdk-server Deployment mounts the Secret that
  # Certificate issues, so the install hangs without it. namespaces comes along transitively.
  dependsOn:
    - name: external-secrets-certs
