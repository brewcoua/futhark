---
# Bunny.net API token for the DNS-01 webhook solver. Synced from Infisical's /infra/cert-manager
# folder by the infra-tier operator — see docs/src/conventions/secrets.md.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: bunny-api
  namespace: cert-manager
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-infra
  sources:
    - secretPath: /infra/cert-manager
  targets:
    - kind: Secret
      name: bunny-api
      namespace: cert-manager
      creationPolicy: Owner
      # cert-manager-webhook-bunny hardcodes the key `api-key`, which does not match the naming
      # convention. Remap here rather than naming it that way in Infisical: the constraint is
      # this chart's, so it belongs in this file where the chart is configured.
      template:
        engineVersion: v1
        data:
          api-key: "{{ .BUNNY_API_KEY }}"
  syncOptions:
    refreshInterval: 1m
