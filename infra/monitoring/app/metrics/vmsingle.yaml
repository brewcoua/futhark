---
# The metrics DB (vmsingle). Fallback UI only — Grafana is the primary dashboard.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmsingle
  namespace: flux-system
spec:
  interval: 1h
  releaseName: vmsingle
  targetNamespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.43.0" # chart 0.13.10 -> VictoriaMetrics v1.111.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  values:
    server:
      # Retention and volume size are set in infra/substitutions/app/monitoring-sizing.yaml —
      # they are tuned together with vlsingle's, against one disk.
      retentionPeriod: "${VM_RETENTION}"
      extraArgs:
        search.maxMemoryPerQuery: 100MB
        dedup.minScrapeInterval: 60s
        memory.allowedPercent: "40"
      # local-path PVCs are hostPath-backed and can't move nodes.
      strategy:
        type: Recreate
      persistentVolume:
        enabled: true
        storageClassName: local-path
        size: ${VM_STORAGE}
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 768Mi
      ingress:
        enabled: true
        ingressClassName: internal
        annotations:
          # Unauthenticated on the mesh — see docs/src/conventions/domains.md.
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-ratelimit@kubernetescrd
        hosts:
          - name: metrics.${INT_DOMAIN}
            path:
              - /
            port: http
