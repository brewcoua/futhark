---
# vmagent's scrape targets, merged into its HelmRelease as `values` — see vmagent.yaml. Split out
# because this is the one block with per-target churn: adding a target should not mean editing a
# release. One file, not one per job: Flux merges `valuesFrom` entries with arrays replaced, so
# two ConfigMaps each holding scrape_configs would clobber each other.
config:
  global:
    # Prometheus default is 15s; 60s roughly quarters ingestion/storage load on this homelab.
    scrape_interval: 60s
  scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels:
            [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $${1}:$${2}
          target_label: __address__
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # exporters/node-exporter.yaml renders the Service as `node-exporter` (fullnameOverride) in
    # this namespace.
    - job_name: node-exporter
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [monitoring]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: node-exporter
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: metrics
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: instance
    # exporters/kube-state-metrics.yaml renders the Service as `kube-state-metrics`
    # (fullnameOverride).
    - job_name: kube-state-metrics
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [monitoring]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: kube-state-metrics
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http
    - job_name: cadvisor
      scheme: https
      kubernetes_sd_configs:
        - role: node
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        # $${1} (not ${1}): vmagent's own regex-capture syntax, not a Flux cluster var.
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
      metric_relabel_configs:
        - source_labels: [__name__]
          action: drop
          regex: (container_tasks_state|container_memory_failures_total|container_fs_.*)
    # traefik-internal has no hostNetwork/hostIP: it is an ordinary ClusterIP Service, reached
    # from the mesh over a NetBird route (see infra/traefik-internal/app/helmrelease.yaml), so
    # its metrics port is just an ordinary in-cluster Service too.
    # The chart names the metrics Service `velero` in its own namespace. node-agent exposes its
    # own metrics on the pods, but the backup/restore counters the alerts read are the server's.
    - job_name: velero
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [velero]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: velero
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http-monitoring
    - job_name: traefik-internal
      static_configs:
        - targets: ["traefik-internal.ingress-internal.svc.cluster.local:9180"]
          labels:
            instance: traefik-internal
    # traefik-edge is hostNetwork, so its status.podIP is the edge node's kubelet --node-ip, which
    # ansible/roles/k8s_cluster/templates/config.yaml.j2 sets to the node's mesh IP. That is the
    # address the metrics entryPoint binds to, so discovery finds it without the address being
    # written down anywhere; this was a static ${MESH_IP} target out of the cluster-values Secret.
    #
    # role: pod, not endpoints — the chart's metrics Service targets a port on a hostNetwork pod,
    # and a Service adds nothing here when there is exactly one replica pinned to one node.
    - job_name: traefik-edge
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: [ingress-edge]
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          action: keep
          regex: traefik
        # The discovered address carries whichever container port came first; force the metrics
        # entryPoint's, so the job never silently scrapes 443 or the dashboard.
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $${1}:9181
          target_label: __address__
        - target_label: instance
          replacement: traefik-edge
