---
# vmagent's scrape targets, merged into its HelmRelease as `values` — see vmagent.yaml. Split out
# because this is the one block with per-target churn: adding a target should not mean editing a
# release. One file, not one per job: Flux merges `valuesFrom` entries with arrays replaced, so
# two ConfigMaps each holding scrape_configs would clobber each other.
config:
  global:
    # Prometheus default is 15s; 60s roughly quarters ingestion/storage load on this homelab.
    scrape_interval: 60s
    # Stamped on every series at remote_write. One cluster, one value — it exists because the
    # Kubernetes dashboards in grafana/dashboards/ select `cluster="$cluster"` on every query,
    # and nothing else in this stack emits the label.
    external_labels:
      cluster: futhark
  scrape_configs:
    # role: pod yields one target per container port, so a multi-port pod reaches the address
    # rewrite below N times and collapses onto N identical targets. Only the port the pod asked for
    # survives; a pod annotating scrape without port is not scraped by this job.
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"
        - source_labels:
            [
              __meta_kubernetes_pod_container_port_number,
              __meta_kubernetes_pod_annotation_prometheus_io_port,
            ]
          action: keep_if_equal
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels:
            [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $${1}:$${2}
          target_label: __address__
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # exporters/node-exporter.yaml renders the Service as `node-exporter` (fullnameOverride) in
    # this namespace.
    - job_name: node-exporter
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [monitoring]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: node-exporter
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: metrics
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: instance
    # exporters/kube-state-metrics.yaml renders the Service as `kube-state-metrics`
    # (fullnameOverride).
    - job_name: kube-state-metrics
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [monitoring]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: kube-state-metrics
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http
    # The kubelet's own two endpoints, scraped directly on 10250 rather than through the
    # apiserver's /api/v1/nodes/<node>/proxy/ path. The two authorize against different
    # subresources: the proxy path needs `nodes/proxy`, which the chart's ClusterRole does not
    # grant — this job answered 403 and scraped nothing at all — while a direct scrape needs
    # `nodes/metrics`, which it does. insecure_skip_verify because the kubelet's cert is
    # self-signed.
    - job_name: cadvisor
      scheme: https
      kubernetes_sd_configs:
        - role: node
      tls_config:
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        # Regex captures are written $${1} — vmagent's own syntax, not a Flux cluster var, and the
        # escape is mandatory: Flux's substitution runs over this whole file, comments included.
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $${1}:10250
          target_label: __address__
        - target_label: __metrics_path__
          replacement: /metrics/cadvisor
        # cadvisor carries no node of its own, and `node` is what the Kubernetes dashboards select
        # on. `instance` matches the node-exporter job's, so a node reads the same in both.
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node
        - source_labels: [__meta_kubernetes_node_name]
          target_label: instance
      metric_relabel_configs:
        - source_labels: [__name__]
          action: drop
          regex: (container_tasks_state|container_memory_failures_total|container_fs_.*)
    # Same endpoint minus /cadvisor: the kubelet's own metrics, kept down to the PVC gauges. The
    # raw endpoint is ~76k samples per node per scrape and would outweigh every other job here.
    - job_name: kubelet
      scheme: https
      kubernetes_sd_configs:
        - role: node
      tls_config:
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - source_labels: [__address__]
          action: replace
          regex: ([^:]+)(?::\d+)?
          replacement: $${1}:10250
          target_label: __address__
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node
        - source_labels: [__meta_kubernetes_node_name]
          target_label: instance
      metric_relabel_configs:
        - source_labels: [__name__]
          action: keep
          regex: kubelet_volume_stats_.*
    # The chart names the metrics Service `k8up-metrics` in its own namespace. The job counters
    # the alerts read are the operator's — the backup Jobs it creates run in the backed up
    # namespaces and expose nothing themselves.
    - job_name: k8up
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [k8up]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: k8up-metrics
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http
    # The Trivy operator's own metrics: the per-image severity counts the Security alert rules
    # read. The chart renders the Service as `trivy-operator` with its port named `metrics`; the
    # built-in Trivy server next to it (`trivy-service`) exposes no metrics of its own.
    - job_name: trivy-operator
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [trivy-system]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: trivy-operator
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: metrics
    # cert-manager's controller Service, created by the chart whenever prometheus.enabled is left
    # at its default of true and no podmonitor is asked for. The one series that matters here is
    # certmanager_certificate_expiration_timestamp_seconds: without it, the expiry of the internal
    # wildcard and the edge certs is only visible by reading the Certificate objects.
    - job_name: cert-manager
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [cert-manager]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: cert-manager
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          action: keep
          regex: http-metrics
    # The Flux controllers, which the flux-operator's FluxInstance labels app.kubernetes.io/part-of:
    # flux. Kept by container port name rather than by forcing an address: role: pod yields one
    # target per container port, and every controller exposes healthz alongside http-prom.
    #
    # gotk_reconcile_condition is the drift signal — a Kustomization or HelmRelease whose Ready
    # condition is False is a commit that did not land, which nothing else in this stack reports.
    - job_name: flux
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: [flux-system]
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
          action: keep
          regex: flux
        - source_labels: [__meta_kubernetes_pod_container_port_name]
          action: keep
          regex: http-prom
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    # Both Traefiks are discovered the same way, for the same reason: each is a hostNetwork pod, so
    # its status.podIP is the node's kubelet --node-ip, which
    # ansible/roles/k8s_cluster/templates/config.yaml.j2 sets to the node's mesh IP. That is the
    # address the metrics entryPoint binds to, so neither address is written down here.
    #
    # role: pod, not endpoints: the chart's metrics Service targets a port on a hostNetwork pod,
    # and a Service adds nothing when there is exactly one replica pinned to one node.
    # traefik-internal has no Service at all now. Kept by container port name, as in the flux job:
    # role: pod yields one target per container port, and forcing __address__ to the metrics port
    # instead collapsed all of them onto identical labels ("skipping duplicate scrape target"). The
    # port is named after the chart's entryPoint, so `metrics` in both helmreleases.
    #
    # This job used to be a static target at the traefik-internal Service's ClusterIP on 9180, which
    # never scraped: the chart puts 9180 on a second Service, traefik-internal-metrics, while the
    # one named exposed only 80/443.
    - job_name: traefik-internal
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: [ingress-internal]
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          action: keep
          regex: traefik
        - source_labels: [__meta_kubernetes_pod_container_port_name]
          action: keep
          regex: metrics
        - target_label: instance
          replacement: traefik-internal
    # Same shape as traefik-internal above, on the edge Traefik's own metrics port. This one was a
    # static ${MESH_IP} target out of the cluster-values Secret before discovery replaced it.
    - job_name: traefik-edge
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names: [ingress-edge]
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          action: keep
          regex: traefik
        - source_labels: [__meta_kubernetes_pod_container_port_name]
          action: keep
          regex: metrics
        - target_label: instance
          replacement: traefik-edge
