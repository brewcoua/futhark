---
# ADMIN_USER/ADMIN_PASSWORD (Grafana admin.existingSecret) plus SLACK_WEBHOOK_URL/
# HEALTHCHECKS_PING_URL (envFromSecret, consumed by grafana.yaml's alerting contact points).
# No template block: Grafana's userKey/passwordKey are configurable, so grafana.yaml was
# pointed at the convention-conforming names instead of remapping them here.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: grafana
  namespace: monitoring
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-infra
  sources:
    - projectSlug: futhark
      environmentSlug: prod
      secretPath: /infra/monitoring
  targets:
    - kind: Secret
      name: grafana
      namespace: monitoring
      creationPolicy: Owner
  syncOptions:
    refreshInterval: 1m
