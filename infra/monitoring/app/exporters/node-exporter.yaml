---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: flux-system
spec:
  interval: 1h
  releaseName: node-exporter
  targetNamespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.56.1" # chart 4.45.3 -> node_exporter v1.9.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    # Fixes the rendered Service name to `node-exporter` for metrics/scrape-configs.yaml.
    fullnameOverride: node-exporter
    # The textfile collector, so host-side agents can publish metrics without each shipping its
    # own exporter. Its one producer today is the NetBird watchdog
    # (ansible/roles/netbird, futhark_mesh_* — see docs/src/ansible/mesh-watchdog.md); the host
    # directory is created by that same role, on every node the role runs on.
    #
    # Read-only from here on purpose: node-exporter only ever reads this directory, and the
    # watchdog writes into it atomically so a half-written file is never scraped.
    extraArgs:
      - --collector.textfile.directory=/run/prometheus
    extraHostVolumeMounts:
      - name: textfile
        hostPath: /var/lib/node_exporter/textfile_collector
        mountPath: /run/prometheus
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        cpu: 100m
        memory: 64Mi
