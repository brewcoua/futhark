---
# Node-local log shipper (vlagent) — unpinned DaemonSet, reads each node's own /var/log/pods.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vlagent
  namespace: flux-system
spec:
  interval: 1h
  releaseName: vlagent
  targetNamespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: victoria-logs-collector
      version: "0.3.7" # chart 0.3.7 -> VictoriaLogs v1.52.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  values:
    resources:
      requests:
        cpu: 20m
        memory: 24Mi
      limits:
        cpu: 150m
        memory: 128Mi
    remoteWrite:
      # Couples to the vlsingle release name in vlsingle.yaml. No path -> the chart's own
      # default (/insert/native).
      - url: http://vlsingle-victoria-logs-single-server.monitoring.svc.cluster.local:9428
        # vlagent only accepts KB/MB/GB/TB/KiB/MiB/GiB/TiB suffixes, not bare "G".
        maxDiskUsagePerURL: 1GiB
    collector:
      # The field is kubernetes.pod_namespace — kubernetes.namespace_name does not exist, so the
      # filter matched nothing and kube-system was shipped in full.
      excludeFilter: kubernetes.pod_namespace:=kube-system
    # The only host-level log collected: fail2ban's, written to a file by ansible's fail2ban
    # role precisely so this DaemonSet can read it — the chart's defaultVolumes already mount
    # /var/log read-only from each node. vlagent adds `hostname` and `file` itself.
    fileCollector:
      - glob: /var/log/fail2ban.log
        extraFields: '{"app":"fail2ban"}'
