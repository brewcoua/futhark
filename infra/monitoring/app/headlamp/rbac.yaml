---
# The built-in `view` role excludes cluster-scoped `nodes`, so Headlamp's Nodes page and node
# CPU/memory charts render blank. Grant read-only `nodes` — additive to the chart-created SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-nodes-view
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-nodes-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-nodes-view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: monitoring
