---
# Primary dashboard + alerting UI. Everything Grafana serves is provisioned from git: datasources
# here (editable: false), contact points/notification policies/alert rules from alerting/, and
# dashboards from dashboards/ — the last two through the chart's sidecars, one ConfigMap per
# concern, generated in kustomization.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1h
  releaseName: grafana
  targetNamespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: grafana
      version: "10.5.15" # chart 8.5.12 -> Grafana 11.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    # Grafana's image is Alpine/musl: under ndots:5 it can't resolve Service DNS reliably.
    # Chart exposes dnsConfig, so fix via values instead of a postRenderer.
    dnsConfig:
      options:
        - name: ndots
          value: "1"
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 200m
        memory: 384Mi
    # Redundant with the pod's fsGroup: local-path is hostPath-backed, so kubelet already fixes
    # ownership at mount. It also cannot work here — the chart runs it as uid 0 with every
    # capability but CHOWN dropped, so `chown -R` gets EACCES descending into the 0700 dirs
    # grafana creates on first boot, and the pod wedges in Init:Error on every restart after.
    initChownData:
      enabled: false
    persistence:
      enabled: true
      storageClassName: local-path
      size: ${GRAFANA_STORAGE}
      # Opts grafana.db into the nightly backup. Dashboards and alert rules come from git now, so
      # what is actually irreplaceable in there is the state Grafana owns itself: alert instance
      # state, silences, annotations, and the user/org table.
      # VictoriaMetrics and VictoriaLogs deliberately
      # carry no equivalent: both already expire their own data
      # (${VM_RETENTION}/${VL_RETENTION}), and metrics worth B2 egress is not a trade this
      # cluster makes. See docs/src/operations/recovery.md.
      annotations:
        k8up.io/backup: "true"
        # grafana.db is 1.3 MB of it; the plugins directory is 255 MB, most of that the
        # VictoriaLogs datasource shipping a backend binary for every platform. Grafana
        # reinstalls plugins from the `plugins` value below whenever they are missing, so
        # copying them to B2 nightly buys nothing.
        #
        # K8up mounts each PVC at /data/<claim-name>, which is where the path comes from. The
        # value is a JSON array; a malformed one makes K8up log "failed to parse restic backup
        # args from the annotation" and skip this PVC entirely, so verify the snapshot after
        # changing it.
        k8up.io/backup-restic-args: '["--exclude=/data/grafana/plugins"]'
    # local-path is single-node hostPath; a rolling update can schedule the new pod before the
    # old one releases the volume. Recreate avoids two grafana.db writers.
    # `deploymentStrategy`, not `strategy`: the chart ignores the latter silently, and a rolling
    # update deadlocks — helm waits for a new pod that RollingUpdate won't let start.
    deploymentStrategy:
      type: Recreate
    admin:
      existingSecret: grafana
      userKey: ADMIN_USER
      passwordKey: ADMIN_PASSWORD
    # Slack/healthchecks webhook URLs, expanded by Grafana into alerting/contactpoints.yaml.
    envFromSecret: grafana
    # Community datasource plugin — VictoriaLogs isn't a built-in Prometheus-compatible source.
    plugins:
      - victoriametrics-logs-datasource
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            access: proxy
            url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
            isDefault: true
            editable: false
          - name: VictoriaLogs
            uid: victorialogs
            type: victoriametrics-logs-datasource
            access: proxy
            url: http://vlsingle-victoria-logs-single-server.monitoring.svc.cluster.local:9428
            isDefault: false
            editable: false
    # Alert rules, contact points and notification policies come from alerting/*.yaml via the
    # chart's sidecar (ConfigMap labelled grafana_alert, generated in kustomization.yaml). Kept
    # out of `values` deliberately: the chart runs the whole `alerting:` block through Helm's
    # `tpl`, which re-parses a literal Grafana template like `{{ $labels.x }}` as a Helm action.
    # The sidecar copies the files in verbatim, so they stay readable.
    sidecar:
      # Chart 10.5.15 is the newest release and still defaults this to 2.5.0, which carries two
      # critical openssl CVEs. 2.10.1 scans clean.
      image:
        tag: "2.10.1"
      resources:
        requests:
          cpu: 10m
          memory: 80Mi
        limits:
          cpu: 100m
          # 64Mi OOMKilled the alerts sidecar on startup; its Python/kube-client baseline alone
          # is over that.
          memory: 128Mi
      alerts:
        enabled: true
        # Chart default is "both", which also watches Secrets. searchNamespace stays unset, so
        # the sidecar only looks in its own namespace.
        resource: configmap
      # Dashboards come from dashboards/*.json, one ConfigMap each, reconciled by their own
      # Kustomization (infra/monitoring/dashboards-ks.yaml). The sidecar writes each into
      # /var/lib/grafana/dashboards/<grafana_folder>/, and foldersFromFilesStructure is what turns
      # that directory back into the Grafana folder.
      dashboards:
        enabled: true
        resource: configmap
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana_folder
        provider:
          # A UI edit would be overwritten on the next sync anyway; refusing the save says so
          # instead of losing the work silently.
          allowUiUpdates: false
          foldersFromFilesStructure: true
    rbac:
      # Chart default (namespaced: false) hands the sidecar configmaps+secrets read across the
      # whole cluster. Namespaced instead — but the chart's Role omits the read rule for the
      # alerts sidecar (templates/role.yaml only tests dashboards/datasources/plugins), so it
      # has to be supplied here.
      namespaced: true
      extraRoleRules:
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["get", "watch", "list"]
    # Login against Pocket ID. tofu/oidc registers the client and writes GRAFANA_OIDC_CLIENT_ID
    # and _SECRET into /infra/monitoring, the folder secret.yaml already syncs, so both arrive as
    # environment through envFromSecret above. $__env{} keeps them out of the rendered ConfigMap.
    #
    # The local admin login stays enabled: Pocket ID is edge-exposed and Grafana is mesh-only, so
    # an outage there must not lock the operator out of the alerting UI.
    grafana.ini:
      server:
        # Grafana builds the OAuth redirect URI from this. Wrong here is an invalid_request at the
        # callback, with nothing in Grafana's own logs.
        root_url: https://dash.${SUB_INTERNAL}.${DOMAIN}
      auth.generic_oauth:
        enabled: true
        name: Pocket ID
        icon: signin
        client_id: $__env{GRAFANA_OIDC_CLIENT_ID}
        client_secret: $__env{GRAFANA_OIDC_CLIENT_SECRET}
        # Without the `groups` scope the claim role_attribute_path reads is absent, and every
        # login is refused by the strict flag below.
        scopes: openid profile email groups
        auth_url: https://auth.${DOMAIN}/authorize
        token_url: https://auth.${DOMAIN}/api/oidc/token
        api_url: https://auth.${DOMAIN}/api/oidc/userinfo
        use_pkce: true
        # The groups are fleet-wide, in tofu/oidc/groups.tf.
        role_attribute_path: contains(groups[*], 'administrators') && 'Admin' || contains(groups[*], 'users') && 'Viewer'
        # A user in neither group is refused rather than admitted with a default role.
        role_attribute_strict: true
    ingress:
      enabled: true
      ingressClassName: internal
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: monitoring-ratelimit@kubernetescrd
      hosts:
        - dash.${SUB_INTERNAL}.${DOMAIN}
      path: /
