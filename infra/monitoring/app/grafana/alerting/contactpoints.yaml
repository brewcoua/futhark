---
# Env references are written $${VAR}: Flux's postBuild substitution runs over the generated
# ConfigMap — comments included, so an unescaped one errors here rather than in Grafana — and
# `$$` escapes it to the literal reference that Grafana's own env expansion then reads, from the
# secret mounted by helmrelease.yaml's envFromSecret.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack1
        type: slack
        settings:
          url: $${SLACK_WEBHOOK_URL}
          title: "{{ .Status | toUpper }} {{ .CommonLabels.alertname }}"
          text: |-
            {{ range .Alerts }}• {{ .Status }}: {{ .Annotations.summary }}
            {{ end }}
  - orgId: 1
    name: healthchecks
    receivers:
      - uid: healthchecks1
        type: webhook
        settings:
          url: $${HEALTHCHECKS_PING_URL}
