---
apiVersion: 1
groups:
  - orgId: 1
    name: backup
    folder: System
    interval: 10m
    rules:
      - uid: backup-failed
        title: Velero backup failed
        condition: A
        for: 0m
        data:
          - refId: A
            datasourceUid: victoriametrics
            relativeTimeRange: { from: 86400, to: 0 }
            model:
              refId: A
              instant: true
              expr: increase(velero_backup_failure_total[24h]) > 0
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Velero schedule {{ $labels.schedule }} recorded a failed backup in the last 24h"
      - uid: backup-partially-failed
        title: Velero backup partially failed
        condition: A
        for: 0m
        data:
          - refId: A
            datasourceUid: victoriametrics
            relativeTimeRange: { from: 86400, to: 0 }
            model:
              refId: A
              instant: true
              # A partial failure still reports Completed-with-warnings and leaves a restorable
              # backup, so it is not caught by backup-failed — but the volume that failed to copy
              # is exactly the one you would want back.
              expr: increase(velero_backup_partial_failure_total[24h]) > 0
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Velero schedule {{ $labels.schedule }} recorded a partially failed backup in the last 24h"
      - uid: backup-stale
        title: No successful backup in 26h
        condition: A
        for: 0m
        data:
          - refId: A
            datasourceUid: victoriametrics
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              refId: A
              instant: true
              # The schedule runs at 03:00, so 26h is one missed run plus slack. This is the rule
              # that catches the silent cases the two above cannot — a suspended schedule, a
              # Velero pod that never came up, an expired B2 key — where nothing fails because
              # nothing ran.
              expr: time() - velero_backup_last_successful_timestamp > 93600
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "Velero schedule {{ $labels.schedule }} has no successful backup in over 26h"
