---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
spec:
  path: ./infra/monitoring/app
  dependsOn:
    - name: traefik-internal
    - name: external-secrets-config
  # kenaz's mesh IP, ansible-pushed straight into the cluster (never git) — used to scrape
  # traefik-edge's metrics port, still hostNetwork-bound. See ansible/roles/flux_bootstrap.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: kenaz-ips
