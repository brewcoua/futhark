---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
spec:
  path: ./infra/monitoring/app
  dependsOn:
    - name: traefik-internal
    - name: infisical-operator-config
    - name: edge-ips
    - name: int-domain
  # The public-ingress host's mesh IP — used to scrape traefik-edge's metrics port, still
  # hostNetwork-bound. Committed SOPS-encrypted in infra/edge-ips. INT_DOMAIN (internal
  # hostnames below) is committed SOPS-encrypted in infra/int-domain.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: edge-ips
      - kind: Secret
        name: int-domain
