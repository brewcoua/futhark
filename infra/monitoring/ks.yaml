---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
spec:
  path: ./infra/monitoring/app
  dependsOn:
    - name: traefik-internal
    - name: infisical-operator-config
    - name: substitutions
  # The internal hostnames, committed SOPS-encrypted, alongside monitoring-sizing's retention and
  # volume knobs. edge-ips was here too, for a static ${MESH_IP} traefik-edge scrape target;
  # app/metrics/scrape-configs.yaml discovers that address from the API server instead.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: dns
      - kind: ConfigMap
        name: monitoring-sizing
