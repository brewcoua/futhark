---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
spec:
  path: ./infra/monitoring/app
  dependsOn:
    - name: traefik-internal
    - name: infisical-operator-config
    - name: substitutions
  # The public-ingress host's mesh IP — used to scrape traefik-edge's metrics port, still
  # hostNetwork-bound — and the internal hostnames. Both committed SOPS-encrypted, alongside
  # monitoring-sizing's retention and volume knobs.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: edge-ips
      - kind: Secret
        name: dns
      - kind: ConfigMap
        name: monitoring-sizing
