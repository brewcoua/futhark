---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - namespaces/ks.yaml
  - policies-ks.yaml
  - substitutions/ks.yaml
  - infisical-operator/ks.yaml
  - infisical-operator/config-ks.yaml
  - auth/ks.yaml
  - cert-manager/ks.yaml
  - cert-manager/config-ks.yaml
  - coredns/ks.yaml
  - traefik-internal/ks.yaml
  - traefik-edge/ks.yaml
  - storage/ks.yaml
  - copyparty/ks.yaml
  - backup/ks.yaml
  - backup/config-ks.yaml
  - monitoring/ks.yaml
  - monitoring/dashboards-ks.yaml
  - gatus/ks.yaml
  - glance/ks.yaml
  - glance/config-ks.yaml
# Every Flux Kustomization CR under infra/ shares interval/prune/sourceRef/wait — patched in
# here so each ks.yaml only states name, path, dependsOn. See docs/src/conventions/layout.md.
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
    patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: unused
      spec:
        interval: 10m
        prune: true
        sourceRef:
          kind: GitRepository
          name: flux-system
        # Patched in here rather than repeated per ks.yaml: any Kustomization may grow a
        # *.sops.yaml, and a missing decryption block fails as an unparseable manifest rather
        # than as anything that names SOPS. The sops-age Secret is seeded by
        # ansible/roles/flux_bootstrap — see docs/src/conventions/secrets.md.
        decryption:
          provider: sops
          secretRef:
            name: sops-age
        # Explicit rather than relying on the API's default: a dependsOn edge is only a
        # readiness guarantee (not just an apply-ordering one) if the upstream Kustomization
        # actually health-checks what it reconciled — e.g. traefik-internal's HelmRelease
        # reporting Ready before infra-policies (which needs its Middleware CRD) reconciles.
        wait: true
