---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - openbao/ks.yaml
  - configs-ks.yaml
  - external-secrets/ks.yaml
  - external-secrets/config-ks.yaml
  - auth/ks.yaml
  - cert-manager/ks.yaml
  - cert-manager/config-ks.yaml
  - tailscale-operator/ks.yaml
  - tailscale-operator/config-ks.yaml
  - traefik-internal/ks.yaml
  - traefik-edge/ks.yaml
  - storage/ks.yaml
  - monitoring/ks.yaml
# Every Flux Kustomization CR under infra/ shares interval/prune/sourceRef/wait — patched in
# here so each ks.yaml only states name, path, dependsOn. See docs/src/conventions/layout.md.
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
    patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: unused
      spec:
        interval: 10m
        prune: true
        sourceRef:
          kind: GitRepository
          name: flux-system
        # Explicit rather than relying on the API's default: a dependsOn edge is only a
        # readiness guarantee (not just an apply-ordering one) if the upstream Kustomization
        # actually health-checks what it reconciled — e.g. traefik-internal's HelmRelease
        # reporting Ready before infra-configs (which needs its Middleware CRD) reconciles.
        wait: true
