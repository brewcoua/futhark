---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trivy-operator
spec:
  path: ./infra/trivy-operator/app
  # The chart installs into trivy-system, which it does not create. Nothing else: this component
  # reads no cluster value and no secret, so it has no substitutions/infisical-operator edge.
  dependsOn:
    - name: namespaces
