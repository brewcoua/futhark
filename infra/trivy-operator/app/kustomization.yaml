---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  # The repository's ignore list, which CI and `just sec scan` read from the same path. Reading
  # above this directory is what kustomize-controller allows and a bare `kustomize build` does
  # not, so .pre-commit-config.yaml and .github/workflows/trivy.yml pass
  # --load-restrictor LoadRestrictionsNone.
  #
  # Keyed without the leading dot: a replacement's fieldPath splits on dots, and `data..trivyignore`
  # has no escape.
  - name: trivy-ignorefile
    namespace: flux-system
    options:
      # Carrier for the replacement below, not an object the cluster needs. This annotation is
      # what keeps it out of the build output.
      annotations:
        config.kubernetes.io/local-config: "true"
    files:
      - trivyignore=../../../.trivyignore
generatorOptions:
  disableNameSuffixHash: true
# Written into the HelmRelease itself rather than referenced with valuesFrom: Flux resolves a
# valuesFrom key through Helm's --set parser, which reads the commas in the file's comments as
# value separators and fails the release.
replacements:
  - source:
      kind: ConfigMap
      name: trivy-ignorefile
      fieldPath: data.trivyignore
    targets:
      - select:
          kind: HelmRelease
          name: trivy-operator
        fieldPaths:
          - spec.values.trivy.ignoreFile
        options:
          create: true
