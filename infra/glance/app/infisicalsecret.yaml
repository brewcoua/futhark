---
# The API tokens the widgets need, all read-only and all for third-party services:
#   NETBIRD_API_KEY  a NetBird PAT, for the peers widget on the network page
#   GITHUB_TOKEN     a read-only PAT, so the releases widget is not rate limited to 60/hour
#   WAQI_TOKEN       air quality, home page
#
# The NetBird and GitHub tokens grant real access, so Proton Pass holds the source of truth and
# these are copies — see docs/src/conventions/secrets.md. No template block: the Infisical names
# are already the names the config files reference.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: glance
  namespace: glance
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-infra
  sources:
    - secretPath: /infra/glance
  targets:
    - kind: Secret
      name: glance-secrets
      namespace: glance
      creationPolicy: Owner
  syncOptions:
    refreshInterval: 1m
