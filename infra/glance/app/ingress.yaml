---
# Internal-only, TLS from traefik-internal's default *.${SUB_INTERNAL}.${DOMAIN} wildcard.
#
# The first internal ingress to require a login: auth-sso@kubernetescrd is the forwardAuth
# Middleware in the auth namespace, and it sends anyone without a session to Pocket ID. Order
# matters — the rate limit runs first, so a flood is dropped before it costs a session lookup.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glance
  namespace: glance
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: glance-ratelimit@kubernetescrd,auth-sso@kubernetescrd
spec:
  ingressClassName: internal
  rules:
    - host: home.${SUB_INTERNAL}.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glance
                port:
                  number: 80
