# What is running and whether it is answering. The counterpart to the cluster page: this one is
# about the workloads, that one is about the platform underneath them.
#
# Nothing here probes a service itself any more. infra/gatus owns every healthcheck and this page
# renders its API, so a check is written down once.
- name: Apps
  slug: apps

  columns:
    - size: small
      widgets:
        - $include: widget-gatus-summary.yml
        - $include: widget-workloads.yml
        - $include: widget-restarts.yml

        - type: releases
          title: Upgrades
          cache: 6h
          limit: 12
          collapse-after: 6
          show-source-icon: true
          # Renovate opens the PRs; this is the same set seen from the other side, so a release
          # showing up here with no PR against it means Renovate is not watching that dependency.
          token: ${GITHUB_TOKEN}
          repositories:
            - fluxcd/flux2
            - k3s-io/k3s
            - traefik/traefik
            - cert-manager/cert-manager
            - VictoriaMetrics/VictoriaMetrics
            - grafana/grafana
            - k8up-io/k8up
            - pocket-id/pocket-id
            - oauth2-proxy/oauth2-proxy
            - Infisical/infisical
            - netbirdio/netbird
            - actualbudget/actual
            - 9001/copyparty
            - open-webui/open-webui
            - searxng/searxng
            - glanceapp/glance
            - TwiN/gatus

    - size: full
      widgets:
        - $include: widget-gatus.yml
        - $include: widget-http-services.yml
        - $include: widget-namespace-usage.yml

    - size: small
      widgets:
        - $include: widget-flux.yml
        - $include: widget-log-errors.yml

        # The Renovate queue, seen from GitHub. Anything sitting here is a pinned version in this
        # repository that has moved upstream.
        - type: repository
          repository: brewcoua/futhark
          token: ${GITHUB_TOKEN}
          pull-requests-limit: 8
          issues-limit: 3
          commits-limit: 3
