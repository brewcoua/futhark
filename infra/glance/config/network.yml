# The mesh and the edge. Two sources: NetBird's own cloud API for what the control plane believes,
# and vmsingle for what the nodes and Traefik actually observe. They disagree when something is
# wrong, which is the point of showing both.
- name: Network
  slug: network

  columns:
    - size: small
      widgets:
        - $include: widget-egress.yml
        - $include: widget-mesh.yml

        - type: bookmarks
          hide-header: true
          groups:
            - title: Consoles
              links:
                - title: NetBird
                  url: https://app.netbird.io
                  icon: sh:netbird
                # No selfh.st icon, so this one points at its own favicon rather than render as
                # the only blank row in the group.
                - title: Bunny DNS
                  url: https://dash.bunny.net/dns
                  icon: https://bunny.net/favicon.ico
                - title: Infisical
                  url: https://app.infisical.com
                  icon: sh:infisical
                - title: Backblaze B2
                  url: https://secure.backblaze.com
                  icon: sh:backblaze

    - size: full
      widgets:
        - $include: widget-netbird-peers.yml
        - $include: widget-ingress-traffic.yml

    - size: small
      widgets:
        - $include: widget-served-certs.yml
