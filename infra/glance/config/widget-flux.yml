# How much of the cluster is currently reconciled, next to the PR queue that changes it. Which
# resource is failing is the cluster page's GitOps widget; this is only the ratio.
#
# gotk exports one series per resource per condition status, holding 1 for the status that is
# currently true. So `count` over the True series is every resource, and `sum` over the same
# series is the ones actually ready.
- type: custom-api
  title: Flux
  cache: 1m
  url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
  parameters:
    query: count(gotk_reconcile_condition{type="Ready",status="True"})
  subrequests:
    ready:
      url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
      parameters:
        query: sum(gotk_reconcile_condition{type="Ready",status="True"})
    suspended:
      url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
      parameters:
        query: sum(gotk_suspend_status)
  template: |
    {{ $total := .JSON.Float "data.result.0.value.1" }}
    {{ $ready := (.Subrequest "ready").JSON.Float "data.result.0.value.1" }}
    {{ $suspended := (.Subrequest "suspended").JSON.Float "data.result.0.value.1" }}
    {{ $percent := 0.0 }}
    {{ if gt $total 0.0 }}{{ $percent = mul 100.0 (div $ready $total) }}{{ end }}

    <div class="flex justify-between items-end size-h5">
      <span>Reconciled</span>
      <span class="color-highlight text-very-compact">{{ printf "%.0f" $ready }}<span class="color-base">/{{ printf "%.0f" $total }}</span></span>
    </div>
    <div class="progress-bar">
      <div class="progress-value{{ if lt $percent 100.0 }} progress-value-notice{{ end }}" style="--percent: {{ printf "%.0f" $percent }}"></div>
    </div>
    <p class="size-h6 color-subdue margin-top-10">
      {{ if gt $suspended 0.0 }}
        <span class="color-primary">{{ printf "%.0f" $suspended }} suspended</span>
      {{ else }}
        Nothing suspended
      {{ end }}
    </p>
