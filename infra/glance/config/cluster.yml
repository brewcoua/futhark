# The platform under the apps. Every widget is an instant query against vmsingle over the cluster
# network, which is what infra/policies/namespaces/monitoring/netpol-allow-from-glance.yaml opens.
# Grafana remains the place to ask why; this page only answers whether.
- name: Cluster
  slug: cluster

  columns:
    - size: small
      widgets:
        - type: custom-api
          title: Nodes
          cache: 1m
          url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
          parameters:
            query: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
          subrequests:
            memory:
              url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
              parameters:
                query: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
            disk:
              url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
              parameters:
                query: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100
            uptime:
              url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
              parameters:
                query: node_time_seconds - node_boot_time_seconds
          template: |
            <p class="size-h6 color-subdue">CPU</p>
            <ul class="list list-gap-4 margin-top-5">
              {{ range .JSON.Array "data.result" }}
                <li class="flex justify-between">
                  <span class="text-truncate">{{ .String "metric.instance" }}</span>
                  <span class="{{ if gt (.Float "value.1") 85.0 }}color-negative{{ end }}">{{ printf "%.0f" (.Float "value.1") }}%</span>
                </li>
              {{ end }}
            </ul>
            <p class="size-h6 color-subdue margin-top-15">Memory</p>
            <ul class="list list-gap-4 margin-top-5">
              {{ range (.Subrequest "memory").JSON.Array "data.result" }}
                <li class="flex justify-between">
                  <span class="text-truncate">{{ .String "metric.instance" }}</span>
                  <span class="{{ if gt (.Float "value.1") 90.0 }}color-negative{{ end }}">{{ printf "%.0f" (.Float "value.1") }}%</span>
                </li>
              {{ end }}
            </ul>
            <p class="size-h6 color-subdue margin-top-15">Root filesystem</p>
            <ul class="list list-gap-4 margin-top-5">
              {{ range (.Subrequest "disk").JSON.Array "data.result" }}
                <li class="flex justify-between">
                  <span class="text-truncate">{{ .String "metric.instance" }}</span>
                  <span class="{{ if gt (.Float "value.1") 80.0 }}color-negative{{ end }}">{{ printf "%.0f" (.Float "value.1") }}%</span>
                </li>
              {{ end }}
            </ul>
            <p class="size-h6 color-subdue margin-top-15">Uptime</p>
            <ul class="list list-gap-4 margin-top-5">
              {{ range (.Subrequest "uptime").JSON.Array "data.result" }}
                <li class="flex justify-between">
                  <span class="text-truncate">{{ .String "metric.instance" }}</span>
                  <span>{{ printf "%.0f" (div (.Float "value.1") 86400.0) }}d</span>
                </li>
              {{ end }}
            </ul>

        # Volume headroom. local-path PVCs are hostPath-backed and cannot move node, so a full one
        # is a manual resize rather than a rescheduling problem.
        - type: custom-api
          title: Volumes
          cache: 5m
          url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
          parameters:
            query: sort_desc(100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)
          template: |
            <ul class="list list-gap-4">
              {{ range .JSON.Array "data.result" }}
                <li class="flex justify-between">
                  <span class="text-truncate">
                    <span class="color-subdue">{{ .String "metric.namespace" }}/</span>{{ .String "metric.persistentvolumeclaim" }}
                  </span>
                  <span class="{{ if gt (.Float "value.1") 85.0 }}color-negative{{ end }}">{{ printf "%.0f" (.Float "value.1") }}%</span>
                </li>
              {{ end }}
            </ul>

    - size: full
      widgets:
        # A Kustomization or HelmRelease whose Ready condition is False is a commit that did not
        # land. Nothing else in this stack reports that, which is why vmagent grew the `flux` scrape
        # job in infra/monitoring/app/metrics/scrape-configs.yaml.
        - type: custom-api
          title: GitOps
          cache: 1m
          url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
          parameters:
            query: gotk_reconcile_condition{type="Ready",status="False"} == 1
          subrequests:
            suspended:
              url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
              parameters:
                query: gotk_suspend_status == 1
          template: |
            {{ if eq (len (.JSON.Array "data.result")) 0 }}
              <p class="color-positive">Every Flux resource reconciled.</p>
            {{ else }}
              <ul class="list list-gap-10">
                {{ range .JSON.Array "data.result" }}
                  <li class="flex justify-between items-center">
                    <span class="text-truncate">
                      <span class="color-subdue">{{ .String "metric.kind" }}</span> {{ .String "metric.namespace" }}/{{ .String "metric.name" }}
                    </span>
                    <span class="color-negative">not ready</span>
                  </li>
                {{ end }}
              </ul>
            {{ end }}
            {{ with .Subrequest "suspended" }}
              {{ if gt (len (.JSON.Array "data.result")) 0 }}
                <p class="size-h6 color-subdue margin-top-15">Suspended</p>
                <ul class="list list-gap-4 margin-top-5">
                  {{ range .JSON.Array "data.result" }}
                    <li class="text-truncate">{{ .String "metric.kind" }} {{ .String "metric.namespace" }}/{{ .String "metric.name" }}</li>
                  {{ end }}
                </ul>
              {{ end }}
            {{ end }}

        # K8up's operator counters. The restic gauges that would give a snapshot count and a per-PVC
        # repository size are only ever pushed to a Prometheus Pushgateway by the backup job itself,
        # and there is no Pushgateway here, so this is job outcomes and nothing more. `just bak
        # snapshots` is the way to ask the repository what it actually holds.
        - type: custom-api
          title: Backups
          cache: 10m
          url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
          parameters:
            query: sum by (namespace) (increase(k8up_jobs_successful_counter{jobType="backup"}[24h]))
          subrequests:
            failed:
              url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
              parameters:
                query: sum by (namespace, jobType) (increase(k8up_jobs_failed_counter[24h])) > 0
            schedules:
              url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
              parameters:
                query: sum(k8up_schedules_gauge)
          template: |
            <div class="flex justify-between items-center">
              <span class="size-h6 color-subdue">Active schedules</span>
              <span class="size-h4 color-highlight">{{ printf "%.0f" ((.Subrequest "schedules").JSON.Float "data.result.0.value.1") }}</span>
            </div>
            <p class="size-h6 color-subdue margin-top-15">Successful backups, last 24h</p>
            <ul class="list list-gap-4 margin-top-5">
              {{ range .JSON.Array "data.result" }}
                <li class="flex justify-between">
                  <span>{{ .String "metric.namespace" }}</span>
                  <span>{{ printf "%.0f" (.Float "value.1") }}</span>
                </li>
              {{ end }}
            </ul>
            {{ with .Subrequest "failed" }}
              {{ if eq (len (.JSON.Array "data.result")) 0 }}
                <p class="color-positive margin-top-15">No failed jobs in the last 24 hours.</p>
              {{ else }}
                <p class="size-h6 color-negative margin-top-15">Failed jobs, last 24h</p>
                <ul class="list list-gap-4 margin-top-5">
                  {{ range .JSON.Array "data.result" }}
                    <li class="flex justify-between">
                      <span>{{ .String "metric.namespace" }} {{ .String "metric.jobType" }}</span>
                      <span class="color-negative">{{ printf "%.0f" (.Float "value.1") }}</span>
                    </li>
                  {{ end }}
                </ul>
              {{ end }}
            {{ end }}

        - type: custom-api
          title: Pods
          cache: 1m
          url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
          parameters:
            query: sum by (phase) (kube_pod_status_phase) > 0
          subrequests:
            nodes:
              url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
              parameters:
                query: kube_node_status_condition{condition="Ready"} == 1
          template: |
            <ul class="list list-gap-4">
              {{ range .JSON.Array "data.result" }}
                <li class="flex justify-between">
                  <span>{{ .String "metric.phase" }}</span>
                  <span class="{{ if eq (.String "metric.phase") "Failed" }}color-negative{{ end }}">{{ printf "%.0f" (.Float "value.1") }}</span>
                </li>
              {{ end }}
            </ul>
            <p class="size-h6 color-subdue margin-top-15">Node readiness</p>
            <ul class="list list-gap-4 margin-top-5">
              {{ range (.Subrequest "nodes").JSON.Array "data.result" }}
                <li class="flex justify-between">
                  <span>{{ .String "metric.node" }}</span>
                  <span class="{{ if eq (.String "metric.status") "true" }}color-positive{{ else }}color-negative{{ end }}">{{ .String "metric.status" }}</span>
                </li>
              {{ end }}
            </ul>

    - size: small
      widgets:
        # Days left on every certificate cert-manager holds, the internal wildcard included. Needs
        # the `cert-manager` scrape job; a renewal that quietly stopped working shows up here weeks
        # before it becomes an outage.
        - type: custom-api
          title: Certificates
          cache: 1h
          url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
          parameters:
            query: sort((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)
          template: |
            {{ if eq (len (.JSON.Array "data.result")) 0 }}
              <p class="color-subdue">No certificate metrics. Check the cert-manager scrape job.</p>
            {{ else }}
              <ul class="list list-gap-4">
                {{ range .JSON.Array "data.result" }}
                  <li class="flex justify-between">
                    <span class="text-truncate">{{ .String "metric.name" }}</span>
                    <span class="{{ if lt (.Float "value.1") 14.0 }}color-negative{{ end }}">{{ printf "%.0f" (.Float "value.1") }}d</span>
                  </li>
                {{ end }}
              </ul>
            {{ end }}
