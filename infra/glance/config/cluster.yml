# The platform under the apps. Every widget is an instant query against vmsingle over the cluster
# network, which is what infra/policies/namespaces/monitoring/netpol-allow-from-glance.yaml opens.
# Grafana remains the place to ask why; this page only answers whether.
- name: Cluster
  slug: cluster

  columns:
    - size: small
      widgets:
        - $include: widget-nodes.yml
        - $include: widget-volumes.yml

    - size: full
      widgets:
        - $include: widget-gitops.yml
        - $include: widget-pods.yml
        - $include: widget-backups.yml

    - size: small
      widgets:
        - $include: widget-certificates.yml
