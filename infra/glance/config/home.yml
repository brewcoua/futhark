# The one page with nothing to do with the cluster. It is first, so it is what the tab opens on.
- name: Home
  slug: home

  columns:
    - size: small
      widgets:
        - type: clock
          hide-header: true
          hour-format: 24h
          timezones:
            - timezone: America/New_York
              label: New York
            - timezone: Asia/Tokyo
              label: Tokyo

        - type: calendar
          hide-header: true
          first-day-of-week: monday

        # Open-Meteo's geocoder matches on place name, not on "city, country": searching
        # "Delft, Netherlands" returns nothing at all. The province is what narrows it to the
        # right Delft.
        - type: weather
          hide-header: true
          location: Delft, South Holland
          units: metric
          hour-format: 24h

        - $include: widget-air-quality.yml

    - size: full
      widgets:
        # The header of a group widget is its tab strip, so it is never hidden.
        - type: group
          widgets:
            - type: hacker-news
            - type: lobsters
              sort-by: hot

        - type: rss
          title: Feeds
          style: detailed-list
          limit: 12
          collapse-after: 6
          feeds:
            - url: https://nltimes.nl/rss
              title: NL Times
            - url: https://www.dutchnews.nl/feed/
              title: DutchNews
            - url: https://www.lemonde.fr/rss/une.xml
              title: Le Monde
            - url: https://feeds.arstechnica.com/arstechnica/index
              title: Ars Technica
            - url: https://lwn.net/headlines/newrss
              title: LWN

    - size: small
      widgets:
        - type: markets
          hide-header: true
          sort-by: change
          markets:
            - symbol: "^AEX"
              name: AEX
            - symbol: "^GSPC"
              name: S&P 500
            - symbol: EURUSD=X
              name: EUR/USD
            - symbol: BTC-USD
              name: Bitcoin
            - symbol: ETH-USD
              name: Ethereum

        - $include: widget-xkcd.yml

        - type: bookmarks
          hide-header: true
          groups:
            - title: Futhark
              links:
                - title: Grafana
                  url: https://dash.${SUB_INTERNAL}.${DOMAIN}
                  icon: sh:grafana
                - title: Actual Budget
                  url: https://actual.${SUB_INTERNAL}.${DOMAIN}
                  icon: sh:actual-budget
            - title: Personal
              links:
                - title: Proton Mail
                  url: https://mail.proton.me
                  icon: sh:proton-mail
                - title: GitHub
                  url: https://github.com
                  icon: sh:github
            # Neither has an icon in selfh.st, so both point at their own favicon rather than
            # render as the only two blank rows on the page.
            - title: University
              links:
                - title: Brightspace
                  url: https://brightspace.tudelft.nl
                  icon: https://brightspace.tudelft.nl/favicon.ico
                - title: Osiris
                  url: https://my.tudelft.nl
                  icon: https://my.tudelft.nl/favicon.png
