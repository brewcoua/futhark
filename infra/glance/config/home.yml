# The one page with nothing to do with the cluster. It is first, so it is what the tab opens on.
- name: Home
  slug: home

  head-widgets:
    - type: search
      search-engine: duckduckgo
      autofocus: true

  columns:
    - size: small
      widgets:
        - type: clock
          hour-format: 24h
          timezones:
            - timezone: America/New_York
              label: New York
            - timezone: Asia/Tokyo
              label: Tokyo

        - type: calendar
          first-day-of-week: monday

        # Open-Meteo's geocoder matches on place name, not on "city, country": searching
        # "Delft, Netherlands" returns nothing at all. The province is what narrows it to the
        # right Delft.
        - type: weather
          location: Delft, South Holland
          units: metric
          hour-format: 24h

    - size: full
      widgets:
        - type: group
          widgets:
            - type: hacker-news
            - type: lobsters
              sort-by: hot
            - type: reddit
              subreddit: selfhosted
            - type: reddit
              subreddit: kubernetes

        - type: rss
          title: Feeds
          style: detailed-list
          limit: 12
          collapse-after: 6
          feeds:
            - url: https://feeds.nos.nl/nosnieuwsalgemeen
              title: NOS
            - url: https://feeds.feedburner.com/tweakers/mixed
              title: Tweakers
            - url: https://feeds.arstechnica.com/arstechnica/index
              title: Ars Technica
            - url: https://lwn.net/headlines/newrss
              title: LWN

        - type: split-column
          widgets:
            - type: custom-api
              title: xkcd
              title-url: https://xkcd.com/
              cache: 6h
              url: https://xkcd.com/info.0.json
              template: |
                <p class="size-h5 color-highlight">{{ .JSON.String "title" }}</p>
                <img class="margin-top-10 max-width-100" src="{{ .JSON.String "img" }}" alt="{{ .JSON.String "alt" }}" title="{{ .JSON.String "alt" }}">

            - type: custom-api
              title: Astronomy Picture of the Day
              title-url: https://apod.nasa.gov/apod/astropix.html
              cache: 12h
              url: https://api.nasa.gov/planetary/apod?api_key=${NASA_API_KEY}
              headers:
                Accept: application/json
              template: |
                {{ if eq (.JSON.String "media_type") "image" }}
                  <p class="size-h5 color-highlight">{{ .JSON.String "title" }}</p>
                  <img class="margin-top-10 max-width-100" src="{{ .JSON.String "url" }}" alt="{{ .JSON.String "title" }}">
                {{ else }}
                  <p class="color-subdue">Today's entry is a {{ .JSON.String "media_type" }}, not an image.</p>
                {{ end }}

    - size: small
      widgets:
        - type: markets
          sort-by: change
          markets:
            - symbol: "^AEX"
              name: AEX
            - symbol: "^GSPC"
              name: S&P 500
            - symbol: EURUSD=X
              name: EUR/USD
            - symbol: BTC-USD
              name: Bitcoin
            - symbol: ETH-USD
              name: Ethereum

        # WAQI reports the nearest station to the coordinates, which for Delft is usually one of the
        # Rijnmond stations rather than Delft itself, so treat it as regional.
        - type: custom-api
          title: Air Quality
          cache: 1h
          url: https://api.waqi.info/feed/geo:52.0116;4.3571/?token=${WAQI_TOKEN}
          template: |
            <div class="flex justify-between items-center">
              <span class="size-h2 color-highlight">{{ .JSON.String "data.aqi" }}</span>
              {{ if le (.JSON.Int "data.aqi") 50 }}
                <span class="color-positive">Good</span>
              {{ else if le (.JSON.Int "data.aqi") 100 }}
                <span class="color-primary">Moderate</span>
              {{ else }}
                <span class="color-negative">Poor</span>
              {{ end }}
            </div>
            <p class="size-h6 margin-top-5">AQI at {{ .JSON.String "data.city.name" }}</p>
            <ul class="list list-gap-4 margin-top-10">
              <li class="flex justify-between"><span class="color-subdue">PM2.5</span><span>{{ .JSON.String "data.iaqi.pm25.v" }}</span></li>
              <li class="flex justify-between"><span class="color-subdue">Humidity</span><span>{{ .JSON.String "data.iaqi.h.v" }}%</span></li>
              <li class="flex justify-between"><span class="color-subdue">Pressure</span><span>{{ .JSON.String "data.iaqi.p.v" }} hPa</span></li>
            </ul>

        - type: bookmarks
          groups:
            - title: Daily
              links:
                - title: GitHub
                  url: https://github.com
                  icon: si:github
                - title: Proton Mail
                  url: https://mail.proton.me
                  icon: si:protonmail
                - title: NS
                  url: https://www.ns.nl/en
