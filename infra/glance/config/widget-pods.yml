# Phase counts as chips, then the two questions the counts raise: where the pods are, and which
# ones are not ready. Node readiness is deliberately not here — widget-nodes.yml already colours
# each node by it.
#
# Header hidden: every section carries its own label.
- type: custom-api
  hide-header: true
  cache: 1m
  url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
  parameters:
    query: sum by (phase) (kube_pod_status_phase) > 0
  subrequests:
    namespaces:
      url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
      parameters:
        query: topk(8, sum by (namespace) (kube_pod_status_phase{phase="Running"}) > 0)
    notready:
      url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/query
      parameters:
        query: kube_pod_status_ready{condition="true"} == 0
  template: |
    <p class="size-h6 color-subdue">Pods by phase</p>
    <ul class="list-horizontal-text margin-top-5">
      {{ range .JSON.Array "data.result" }}
        {{ $phase := .String "metric.phase" }}
        <li class="{{ if eq $phase "Running" }}color-positive{{ else if eq $phase "Succeeded" }}color-subdue{{ else if eq $phase "Pending" }}color-primary{{ else }}color-negative{{ end }}">
          {{ printf "%.0f" (.Float "value.1") }} {{ $phase }}
        </li>
      {{ end }}
    </ul>

    {{ with .Subrequest "namespaces" }}
      {{ $max := 1.0 }}
      {{ range .JSON.Array "data.result" }}{{ if gt (.Float "value.1") $max }}{{ $max = .Float "value.1" }}{{ end }}{{ end }}
      <p class="size-h6 color-subdue margin-top-15">Running by namespace</p>
      <ul class="list list-gap-10 margin-top-5">
        {{ range .JSON.Array "data.result" }}
          <li>
            <div class="flex justify-between items-end size-h5">
              <span class="text-truncate">{{ .String "metric.namespace" }}</span>
              <span class="color-highlight text-very-compact">{{ printf "%.0f" (.Float "value.1") }}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-value" style="--percent: {{ printf "%.0f" (mul 100.0 (div (.Float "value.1") $max)) }}"></div>
            </div>
          </li>
        {{ end }}
      </ul>
    {{ end }}

    {{/* A Job's pod stays not-ready for its whole life and is not a fault, so a Completed pod
         showing up in this list is expected. Anything else here is worth a look. */}}
    {{ with .Subrequest "notready" }}
      {{ if eq (len (.JSON.Array "data.result")) 0 }}
        <p class="color-positive margin-top-15">Every pod is ready.</p>
      {{ else }}
        <p class="size-h6 color-negative margin-top-15">Not ready</p>
        <ul class="list list-gap-4 margin-top-5">
          {{ range .JSON.Array "data.result" }}
            <li class="text-truncate">
              <span class="color-subdue">{{ .String "metric.namespace" }}/</span>{{ .String "metric.pod" }}
            </li>
          {{ end }}
        </ul>
      {{ end }}
    {{ end }}
