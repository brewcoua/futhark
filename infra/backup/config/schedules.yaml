---
# yaml-language-server: $schema=https://raw.githubusercontent.com/k8up-io/k8up/master/config/crd/apiextensions.k8s.io_v1_customresourcedefinition_schedules.k8up.io.yaml
#
# One Schedule per namespace holding data worth keeping. A Schedule is what puts a namespace in
# scope at all; within it, a PVC is copied only if it carries k8up.io/backup: "true", which is
# declared next to the PVC itself. So adding an app means one entry here and one annotation
# there, and nothing else.
#
# The postgres entry below works the other way round: it backs up the output of a command rather
# than a volume, through k8up.io/backupcommand on the pod. Its PVC carries no annotation and must
# not gain one, because copying a live data directory with restic produces a snapshot that only
# fails at restore time.
#
# Central rather than in each app's own directory on purpose. A Schedule needs the k8up.io CRDs,
# so an app shipping its own would need dependsOn: backup on its Kustomization — which would stop
# Pocket ID reconciling whenever the backup stack is unhealthy. The half that genuinely varies
# per app is the annotation, and that does live with the app.
#
# Every field these three share is stamped by kustomization.yaml. What is left is the namespace.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: actual
spec: {}
---
# What bifrost keeps that git does not is the usage its config store accumulates per virtual key.
# Everything else in config.db is reapplied from its ConfigMap on the next start.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: bifrost
spec: {}
---
# The OAuth tokens, which no apply recreates. Without this, losing the volume means repeating the
# browser login for every account. See docs/src/operations/cli-proxy-login.md.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: cli-proxy-api
spec: {}
---
# The page archives, previews and uploads under STORAGE_FOLDER. The bookmarks themselves are rows
# in the shared PostgreSQL and are covered by the postgres entry below, so a full restore of this
# app needs both.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: linkwarden
spec: {}
---
# searxng is deliberately absent: its only volume is a disposable favicon cache on an emptyDir.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: open-webui
spec: {}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: auth
spec: {}
---
# Every tenant's rows, as one pg_dumpall taken at backup time. The command and the reasoning are
# in infra/postgres/config/cluster.yaml. Restoring it is in docs/src/operations/recovery.md.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
  namespace: postgres
spec: {}

# monitoring is deliberately absent, alongside searxng. Grafana's PVC was the only annotated
# volume in it, and Grafana's state moved into the Schedule above; what is left on that volume is
# a plugin cache the chart reinstalls. VictoriaMetrics and VictoriaLogs never carried an
# annotation. A Schedule over a namespace with nothing annotated backs up nothing and still
# reports a run, which is worse than not having one.
