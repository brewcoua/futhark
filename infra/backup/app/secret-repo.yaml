---
# The Kopia repository password, which is what actually encrypts volume data in the bucket.
#
# This file is not optional and not a duplicate of secret.yaml. Velero looks for exactly this
# Secret name and key, and when it is absent it falls back to a password hardcoded in Velero's
# own source — published, identical in every installation, and therefore no encryption at all.
# Creating it is the whole difference between AES-256-GCM and plaintext-with-extra-steps.
#
# It must exist before node-agent first initialises the repository: the password is baked into
# the repo at creation and cannot be changed afterwards without starting a new one.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-backup
  sources:
    - secretPath: /infra/velero
  targets:
    - kind: Secret
      name: velero-repo-credentials
      namespace: velero
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          repository-password: "{{ .KOPIA_REPOSITORY_PASSWORD }}"
  syncOptions:
    refreshInterval: 1m
