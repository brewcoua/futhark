---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/helm-controller/main/config/crd/bases/helm.toolkit.fluxcd.io_helmreleases.yaml
# Off-node durability for the local-path PVCs, as restic snapshots in a Backblaze B2 bucket.
#
# Which volumes those are is not decided here: a PVC is backed up only if it carries
# k8up.io/backup: "true", and which namespaces are in scope at all is decided by where a Schedule
# exists. See docs/src/operations/recovery.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
  namespace: flux-system
spec:
  interval: 1h
  releaseName: k8up
  targetNamespace: k8up
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    # Helm never upgrades a chart's crds/ directory on its own, which would leave the CRDs pinned
    # at whatever version first installed them while the operator moves on.
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: k8up
      version: "4.10.0" # chart 4.10.0 -> K8up 2.16.0
      sourceRef:
        kind: HelmRepository
        name: k8up
        namespace: flux-system
  values:
    k8up:
      # Opt-in, not opt-out. Without this K8up backs up every PVC in a namespace that has a
      # Schedule, which would drag VictoriaMetrics and VictoriaLogs into the bucket and pull
      # actual-user-files back through rclone to re-upload bytes the Storage Box already holds.
      skipWithoutAnnotation: true

      # Global backend settings. Declared once here rather than in each Schedule's own backend
      # block, which is what keeps a Schedule down to the name of its namespace.
      #
      # restic reaches B2 over its S3 endpoint. Velero could not: velero-plugin-for-aws sets an
      # x-amz-tagging header on every PutObject even when no tagging is configured, and B2 rejects
      # that header, which failed every backup at the point of writing its metadata.
      envVars:
        - name: BACKUP_GLOBALS3BUCKET
          value: ${B2_BUCKET}
        - name: BACKUP_GLOBALS3ENDPOINT
          value: https://s3.${B2_REGION}.backblazeb2.com
        - name: BACKUP_GLOBALACCESSKEYID
          valueFrom:
            secretKeyRef:
              name: k8up-b2
              key: B2_KEY_ID
        - name: BACKUP_GLOBALSECRETACCESSKEY
          valueFrom:
            secretKeyRef:
              name: k8up-b2
              key: B2_APPLICATION_KEY
        # What actually encrypts the bucket's contents: restic is client-side AES-256, so
        # Backblaze holds ciphertext it cannot read. Baked into the repository at creation and
        # unchangeable afterwards without starting a new one. Losing it loses every backup.
        - name: BACKUP_GLOBALREPOPASSWORD
          valueFrom:
            secretKeyRef:
              name: k8up-b2
              key: RESTIC_PASSWORD

      # Applied to the backup, check and prune Jobs the operator creates, which run in the backed
      # up namespaces rather than here.
      globalResources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 1Gi

    # Scraped by vmagent from infra/monitoring/app/metrics/scrape-configs.yaml, like everything
    # else here — the chart's ServiceMonitor would need an operator this cluster does not run.
    # The default rules it would ship are replaced by the two in
    # infra/monitoring/app/grafana/alerting/backup.yaml.
    metrics:
      serviceMonitor:
        enabled: false
      prometheusRule:
        enabled: false
      grafanaDashboard:
        enabled: false

    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 256Mi
