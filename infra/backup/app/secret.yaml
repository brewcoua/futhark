---
# The B2 credentials and the restic repository password, read with the backup tier's own machine
# identity — this is the only InfisicalStaticSecret in the tree whose infisicalAuthRef is not its
# namespace's usual tier. See docs/src/conventions/secrets.md.
#
# No template block: the operator reads all three as plain environment variables, so the keys are
# passed through under the names Infisical already uses.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: k8up-b2
  namespace: k8up
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-backup
  sources:
    - secretPath: /infra/k8up
  targets:
    - kind: Secret
      name: k8up-b2
      namespace: k8up
      creationPolicy: Owner
  syncOptions:
    refreshInterval: 1m
