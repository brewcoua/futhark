---
# The B2 credentials and the SSE-C key, read with the backup tier's own machine identity — this
# is the only InfisicalStaticSecret in the tree whose infisicalAuthRef is not its namespace's
# usual tier. See docs/src/conventions/secrets.md.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: velero-b2
  namespace: velero
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-backup
  sources:
    - secretPath: /infra/velero
  targets:
    - kind: Secret
      name: velero-b2
      namespace: velero
      creationPolicy: Owner
      # Two keys, both named by something outside this repo. `cloud` is the AWS credentials INI
      # the plugin reads via AWS_SHARED_CREDENTIALS_FILE; `customer-key` is the raw 32-byte SSE-C
      # key named by customerKeyEncryptionFile in the HelmRelease. The chart mounts this whole
      # Secret at /credentials, which is what puts both at the paths those two expect.
      template:
        engineVersion: v1
        data:
          cloud: |
            [default]
            aws_access_key_id={{ .B2_KEY_ID }}
            aws_secret_access_key={{ .B2_APPLICATION_KEY }}
          customer-key: "{{ .B2_SSE_C_KEY }}"
  syncOptions:
    refreshInterval: 1m
