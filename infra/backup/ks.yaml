---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup
spec:
  path: ./infra/backup/app
  dependsOn:
    - name: infisical-operator-config
    - name: substitutions
  # Which B2 bucket to write to. Identifying, so committed SOPS-encrypted in
  # infra/substitutions rather than literally here — and not in Infisical with the B2 keys,
  # because a BackupStorageLocation fixes its bucket at render time. The reasoning is in
  # infra/substitutions/app/backup-location.sops.yaml.example.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: backup-location
