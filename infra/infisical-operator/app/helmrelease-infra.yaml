---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/helm-controller/main/config/crd/bases/helm.toolkit.fluxcd.io_helmreleases.yaml
# The infra tier's operator. Owns the secrets.infisical.com CRDs for the whole cluster —
# helmrelease-node-kenaz.yaml sets installCRDs: false and dependsOn this release, because two
# installs racing to own the same CRDs is the documented failure mode.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-infra
  namespace: infisical-infra
spec:
  interval: 1h
  releaseName: infisical-infra
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: secrets-operator
      version: "0.11.8"
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: infisical-infra
  values:
    installCRDs: true
    scopedRBAC: true
    # Its own namespace is listed first and deliberately: the scoped Role is what grants the
    # operator read access to the InfisicalAuth/InfisicalConnection and the credential Secret
    # that live there. Without it the operator cannot authenticate at all.
    #
    # Every other entry is a namespace that actually holds an InfisicalStaticSecret. Adding a
    # namespace here widens what this operator can write Secrets into — do it deliberately.
    scopedNamespaces:
      - infisical-infra
      - cert-manager
      - csi-rclone
      - monitoring
      - auth
      - glance
      - postgres
      - gatus
