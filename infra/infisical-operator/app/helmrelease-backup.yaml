---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/helm-controller/main/config/crd/bases/helm.toolkit.fluxcd.io_helmreleases.yaml
# The backup tier. Unlike the node tiers this one is not per-host: it exists to put the B2
# credentials behind their own machine identity, so a compromise of the shared cluster-reader
# does not hand over the keys that decrypt every backup. See docs/src/conventions/secrets.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-backup
  namespace: infisical-backup
spec:
  interval: 1h
  releaseName: infisical-backup
  # The infra release owns the CRDs; installing them twice is what the chart docs warn against.
  dependsOn:
    - name: infisical-infra
      namespace: infisical-infra
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: secrets-operator
      version: "0.11.8"
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: infisical-infra
  values:
    installCRDs: false
    scopedRBAC: true
    scopedNamespaces:
      - infisical-backup
      - velero
