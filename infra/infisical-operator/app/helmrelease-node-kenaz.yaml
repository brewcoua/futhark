---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/helm-controller/main/config/crd/bases/helm.toolkit.fluxcd.io_helmreleases.yaml
# kenaz's tier. Add one of these per k0s node, alongside a matching config/nodes/<hostname>.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-node-kenaz
  namespace: infisical-node-kenaz
spec:
  interval: 1h
  releaseName: infisical-node-kenaz
  # The infra release owns the CRDs; installing them twice is what the chart docs warn against.
  dependsOn:
    - name: infisical-infra
      namespace: infisical-infra
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: secrets-operator
      version: "0.11.*"
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: infisical-infra
  values:
    installCRDs: false
    scopedRBAC: true
    scopedNamespaces:
      - infisical-node-kenaz
      - actual
