---
# kenaz's own tier. Add one nodes/<hostname>.yaml like this per cluster node, alongside a matching
# app/helmrelease-node-<hostname>.yaml.
#
# The credential here is the same Infisical machine identity the infra tier uses — the free tier
# caps identities at five, so there is only one. What differs is reach: this copy lives in a
# namespace only the node-kenaz operator has RBAC in, that operator can only write Secrets into
# `actual`, and the ValidatingAdmissionPolicy in infra/infisical-operator/config confines this tier's
# InfisicalStaticSecrets to /nodes/kenaz. See docs/src/conventions/secrets.md.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalConnection
metadata:
  name: infisical
  namespace: infisical-node-kenaz
spec:
  address: https://eu.infisical.com
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: infisical
  namespace: infisical-node-kenaz
spec:
  method: universal
  infisicalConnectionRef:
    name: infisical
    namespace: infisical-node-kenaz
  universal:
    clientIdRef:
      name: infisical-universal-auth
      namespace: infisical-node-kenaz
      key: clientId
    clientSecretRef:
      name: infisical-universal-auth
      namespace: infisical-node-kenaz
      key: clientSecret
