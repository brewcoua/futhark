---
# One key at /nodes/kenaz/local-deep-research: LDR_LLM_OPENAI_ENDPOINT_API_KEY, the virtual key
# bifrost issues this app. tofu/bifrost writes it here and the identical value to
# /nodes/kenaz/bifrost as VK_LDR, because both ends have to spell one token the same way. See
# docs/src/tofu/bifrost.md.
#
# No template block: the one key passes through under the name the app already expects, and a
# template would mean listing every key for no gain.
#
# The app's own database is encrypted per user with a key derived from that user's password, so
# nothing about it is stored here. Losing the password loses the research history with it.
#
# This is the node tier: the auth it references lives in infisical-node-kenaz, an operator that
# has RBAC in no infra namespace at all, and the ValidatingAdmissionPolicy rejects any secretPath
# here that does not start with /nodes/kenaz.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: local-deep-research
  namespace: local-deep-research
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-node-kenaz
  sources:
    - secretPath: /nodes/kenaz/local-deep-research
  targets:
    - kind: Secret
      name: local-deep-research-secrets
      namespace: local-deep-research
      creationPolicy: Owner
  syncOptions:
    refreshInterval: 1m
