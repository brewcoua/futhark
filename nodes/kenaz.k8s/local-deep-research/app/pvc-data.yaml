---
# The per-user SQLCipher databases: accounts, settings, and every report this app has produced.
#
# local-path is node-local hostPath storage, which avoids the locking issues a network filesystem
# can cause for SQLite. Node-local means this disk dying takes the data with it, so the volume
# opts into the nightly backup. What that backup restores is only readable with the account
# password that derived its key, which makes the password part of the recovery procedure. See
# docs/src/operations/recovery.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-deep-research-data
  namespace: local-deep-research
  annotations:
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
