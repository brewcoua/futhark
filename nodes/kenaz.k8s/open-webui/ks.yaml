---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
spec:
  path: ./nodes/kenaz.k8s/open-webui/app
  dependsOn:
    - name: infra-policies
    - name: traefik-internal
    - name: infisical-operator-config
    - name: substitutions
    # webui.db moved to the shared instance, so the Database and DatabaseRole have to exist
    # before the app opens a connection. See app/infisicalsecret.yaml.
    - name: postgres-config
  # No `auth` edge: Open WebUI is an OIDC client of Pocket ID directly rather than a consumer of
  # infra/auth's Middleware. No `storage` edge either: its one PVC is local-path, which arrives
  # with k3s rather than from that Kustomization.
  #
  # The internal hostname (ingress host, WEBUI_URL, OIDC callback) and the edge one (Pocket ID's
  # discovery URL) are both spelled from the same Secret.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-values
