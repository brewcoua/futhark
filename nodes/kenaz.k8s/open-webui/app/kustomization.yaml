---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The generated ConfigMap has no namespace of its own, and a reference is only rewritten when the
# two agree, so this has to be spelled even though every resource already carries it.
namespace: open-webui
resources:
  - pvc-data.yaml
  - infisicalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Generated, so the content hash lands in the name and an edit rolls the Deployment. A ConfigMap
# manifest would not: envFrom reads a fixed name, which is not part of the pod template, so the
# change would sit in the cluster while the running pod kept the values it started with.
# Kustomize rewrites the envFrom reference, so nothing outside this overlay may spell it.
configMapGenerator:
  - name: open-webui-config
    envs:
      - config.env

components:
  - ../../../../config/infisical
