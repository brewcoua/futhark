---
# Four keys at /nodes/kenaz/open-webui, from three sources. OAUTH_CLIENT_SECRET and
# OAUTH_CLIENT_ID are minted by tofu/oidc's pocketid_client.open_webui and written by the same
# apply. See docs/src/tofu/oidc.md. The ID is not secret; it rides along because Pocket ID
# generates it and only the apply knows its value.
#
# OPENAI_API_KEYS is the virtual key bifrost issues this app, keyed by the connection's index in
# OPENAI_API_BASE_URLS, and is what becomes the Bearer token. tofu/bifrost writes it here and the
# identical value to /nodes/kenaz/bifrost, because both ends have to spell one token the same way.
# See docs/src/tofu/bifrost.md. It replaced OLLAMA_API_CONFIGS when the Ollama Cloud key moved to
# /nodes/kenaz/bifrost.
#
# WEBUI_SECRET_KEY is the one seeded by hand, as SSO_COOKIE_SECRET is in /infra/auth. It signs
# JWTs and encrypts data at rest, and setting it is not optional here: left unset, Open WebUI
# generates one and writes .webui_secret_key into a root filesystem this pod mounts read-only.
#
# This is the node tier: the auth it references lives in infisical-node-kenaz, an operator that
# has RBAC in no infra namespace at all, and the ValidatingAdmissionPolicy rejects any
# secretPath here that does not start with /nodes/kenaz.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: open-webui
  namespace: open-webui
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-node-kenaz
  sources:
    - secretPath: /nodes/kenaz/open-webui
  targets:
    - kind: Secret
      name: open-webui-secrets
      namespace: open-webui
      creationPolicy: Owner
  syncOptions:
    refreshInterval: 1m
