---
# Four keys at /nodes/kenaz/open-webui, from two sources. OAUTH_CLIENT_SECRET and
# OAUTH_CLIENT_ID are minted by tofu/oidc's pocketid_client.open_webui and written by the same
# apply. See docs/src/tofu/oidc.md. The ID is not secret; it rides along because Pocket ID
# generates it and only the apply knows its value.
#
# The other two are seeded by hand, as SSO_COOKIE_SECRET is in /infra/auth. WEBUI_SECRET_KEY
# signs JWTs and encrypts data at rest, and setting it is not optional here: left unset, Open
# WebUI generates one and writes .webui_secret_key into a root filesystem this pod mounts
# read-only. OLLAMA_API_CONFIGS is {"0":{"enable":true,"key":"<ollama cloud key>"}}, keyed by
# the connection's index in OLLAMA_BASE_URLS, and `key` is what becomes the Bearer token.
#
# This is the node tier: the auth it references lives in infisical-node-kenaz, an operator that
# has RBAC in no infra namespace at all, and the ValidatingAdmissionPolicy rejects any
# secretPath here that does not start with /nodes/kenaz.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: open-webui
  namespace: open-webui
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-node-kenaz
  sources:
    - secretPath: /nodes/kenaz/open-webui
  targets:
    - kind: Secret
      name: open-webui-secrets
      namespace: open-webui
      creationPolicy: Owner
  syncOptions:
    refreshInterval: 1m
