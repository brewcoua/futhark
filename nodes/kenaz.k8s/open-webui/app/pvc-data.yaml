---
# webui.db (SQLite), uploads, and the cached sentence-transformers model. local-path is
# node-local hostPath storage, which avoids the locking issues a network filesystem can cause for
# SQLite. Node-local means this disk dying takes the data with it, so the volume opts into the
# nightly backup. See docs/src/operations/recovery.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: open-webui
  annotations:
    k8up.io/backup: "true"
    # DATA_DIR is also HOME and the model cache, so most of this volume is downloads rather than
    # state: ~700 MB of embedding model the pod refetches from Hugging Face, and pip's HTTP
    # cache. Excluding cache/ whole holds only while image generation and TTS stay off, as
    # config.env has them; turning either on puts generated images and speech under cache/ that
    # chats reference and nothing recreates. Same annotation as infra/auth/app/pvc.yaml, and the
    # same footgun: a malformed array makes K8up skip this PVC silently.
    k8up.io/backup-restic-args: '["--exclude=/data/open-webui-data/cache", "--exclude=/data/open-webui-data/.cache"]'
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
