---
# Internal-only: routed by traefik-internal (mesh interface). TLS served from its default
# *.$SUB_INTERNAL.$DOMAIN wildcard cert, so no per-app Certificate/Secret needed here.
#
# No auth-sso here, unlike copyparty and searxng: Open WebUI is its own OIDC client, so the
# middleware would stack a second login in front of one that already exists, and swallow the
# /oauth/oidc/callback redirect on the way back from Pocket ID.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: open-webui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: open-webui-ratelimit@kubernetescrd
spec:
  ingressClassName: internal
  rules:
    - host: chat.${SUB_INTERNAL}.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 80
