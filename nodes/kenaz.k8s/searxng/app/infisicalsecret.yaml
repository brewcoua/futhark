---
# SEARXNG_SECRET, seeded by hand at /nodes/kenaz/searxng: nothing in tofu/ mints it. It signs
# the image-proxy and result URLs, so it must stay stable across restarts rather than be
# regenerated per pod.
#
# Node tier: the auth it references lives in infisical-node-kenaz, and the
# ValidatingAdmissionPolicy rejects any secretPath here that does not start with /nodes/kenaz.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: searxng
  namespace: searxng
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-node-kenaz
  sources:
    - secretPath: /nodes/kenaz/searxng
  targets:
    - kind: Secret
      name: searxng-secrets
      namespace: searxng
      creationPolicy: Owner
  syncOptions:
    refreshInterval: 1m
