---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The generated ConfigMap has no namespace of its own, and a reference is only rewritten when the
# two agree, so this has to be spelled even though every resource already carries it.
namespace: searxng
resources:
  - infisicalsecret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Generated, so the content hash lands in the name and an edit rolls the Deployment. The volume
# mount does refresh on its own, but SearXNG reads settings.yml once at startup, so without the
# roll a change would land on disk and change nothing. Kustomize rewrites the volume's
# configMap.name, so nothing outside this overlay may spell it. Mounted at /etc/searxng, the path
# the container entrypoint checks: because settings.yml is already there, the entrypoint's
# "create from template" branch never runs and the read-only mount is fine.
configMapGenerator:
  - name: searxng-settings
    files:
      - settings.yml

components:
  - ../../../../config/infisical
