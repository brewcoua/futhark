---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: searxng
spec:
  path: ./nodes/kenaz.k8s/searxng/app
  dependsOn:
    - name: infra-policies
    - name: traefik-internal
    - name: infisical-operator-config
    # app/ingress.yaml names auth-sso@kubernetescrd, which is infra/auth's Middleware.
    - name: auth
    - name: substitutions
  # The ingress host and SearXNG's own base_url are both spelled from the same Secret.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-values
