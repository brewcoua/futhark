---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  namespace: bifrost
spec:
  replicas: 1
  # Single-writer SQLite on a non-shared volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bifrost
  template:
    metadata:
      labels:
        app: bifrost
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bifrost
          image: docker.io/maximhq/bifrost:v1.6.11@sha256:ef8e686b3588884066ec3d0e57f3fc15136b11047ad94678adefe5a9573539af
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: bifrost-secrets
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # The app directory. config.db lives here; upstream's own Kubernetes guide adds an
            # init container to chown it, which fsGroup does instead.
            - name: data
              mountPath: /app/data
            # subPath so the file lands inside the app directory without masking the volume
            # mounted above it.
            - name: config
              mountPath: /app/data/config.json
              subPath: config.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Startup reconciles every section of config.json into the config store before the
          # server answers, so the first boot after a config change is slower than a restart.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bifrost-data
        - name: config
          configMap:
            name: bifrost-config
        - name: tmp
          emptyDir: {}
