---
# Six keys at /nodes/kenaz/bifrost, from two sources. VK_OPEN_WEBUI and VK_CLI are generated by
# tofu/bifrost and written by the same apply; nothing here comes from tofu/oidc, because Bifrost
# is not an OIDC client. See docs/src/tofu/bifrost.md.
#
# The other four are seeded by hand. BIFROST_ENCRYPTION_KEY encrypts provider keys at rest in
# config.db and must be set before first start: rotating it later makes every stored row
# unreadable. BIFROST_ADMIN_USERNAME and BIFROST_ADMIN_PASSWORD are the dashboard and management
# API login, which is why this app needs no auth-sso Middleware. OLLAMA_API_KEY is the Ollama
# Cloud key, which moved here from /nodes/kenaz/open-webui when that app stopped calling Ollama
# directly.
#
# The two virtual keys are one per client, so either can be revoked without touching the other.
# What each may reach is declared in config.json; only the token lives here.
#
# This is the node tier: the auth it references lives in infisical-node-kenaz, an operator that
# has RBAC in no infra namespace at all, and the ValidatingAdmissionPolicy rejects any secretPath
# here that does not start with /nodes/kenaz.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: bifrost
  namespace: bifrost
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-node-kenaz
  sources:
    - secretPath: /nodes/kenaz/bifrost
  targets:
    - kind: Secret
      name: bifrost-secrets
      namespace: bifrost
      creationPolicy: Owner
  syncOptions:
    refreshInterval: 1m
