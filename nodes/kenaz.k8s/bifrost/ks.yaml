---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bifrost
spec:
  path: ./nodes/kenaz.k8s/bifrost/app
  dependsOn:
    - name: infra-policies
    - name: traefik-internal
    - name: infisical-operator-config
    - name: substitutions
  # No `auth` edge: Bifrost authenticates its own dashboard and management API from
  # governance.auth_config, so the auth-sso Middleware would stack a second login in front of one
  # that already exists. Same reasoning as open-webui, by a different mechanism. No `storage` edge
  # either: its one PVC is local-path, which arrives with k3s rather than from that Kustomization.
  #
  # The ingress host is spelled from the Secret, and so is client.allowed_origins in config.json,
  # which pins CORS to that same host. Everything else config.json needs from outside the file
  # arrives as an environment variable instead. config.json is strict JSON and cannot carry a
  # comment, so the reasoning for that one-entry list lives in docs/src/gitops/nodes.md.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-values
