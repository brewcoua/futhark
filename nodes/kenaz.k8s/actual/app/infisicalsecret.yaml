---
# ACTUAL_OPENID_CLIENT_SECRET and ACTUAL_OPENID_CLIENT_ID, both minted by tofu/oidc's
# pocketid_client.actual and written to Infisical at /nodes/kenaz/actual by the same apply — see
# docs/src/tofu/oidc.md. The ID is not secret; it rides along because Pocket ID generates it and
# only the apply knows its value.
#
# This is the node tier: the auth it references lives in infisical-node-kenaz, an operator that
# has RBAC in no infra namespace at all, and the ValidatingAdmissionPolicy rejects any
# secretPath here that does not start with /nodes/kenaz.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: actual
  namespace: actual
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-node-kenaz
  sources:
    - secretPath: /nodes/kenaz/actual
  targets:
    - kind: Secret
      name: actual-secrets
      namespace: actual
      creationPolicy: Owner
  syncOptions:
    refreshInterval: 1m
