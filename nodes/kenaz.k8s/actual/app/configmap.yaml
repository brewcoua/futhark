---
apiVersion: v1
kind: ConfigMap
metadata:
  name: actual-config
  namespace: actual
data:
  # Default is ${ACTUAL_DATA_DIR}/server-files; flattened onto the data dir itself so the
  # server-files PVC covers both account.sqlite and the `.migrate` state file at the root.
  ACTUAL_SERVER_FILES: /data
  ACTUAL_OPENID_SERVER_HOSTNAME: https://actual.${SUB_INTERNAL}.${DOMAIN}
  # ACTUAL_OPENID_CLIENT_ID is deliberately absent: Pocket ID generates the client ID, so it
  # arrives with the client secret through actual-secrets. See tofu/oidc/clients.tf.
  ACTUAL_OPENID_ENFORCE: "true"
  # First OIDC login becomes the server owner automatically, no manual promotion step.
  ACTUAL_USER_CREATION_MODE: "login"
  # Pocket ID's own public endpoint (infra/auth, edge-exposed). ${DOMAIN} rather than a
  # `replacements` block because the domain sits mid-string, ahead of a path — see
  # infra/substitutions/ks.yaml.
  ACTUAL_OPENID_DISCOVERY_URL: https://auth.${DOMAIN}/.well-known/openid-configuration
