---
# SQLite budget DBs. local-path is node-local hostPath storage — avoids the locking issues
# a network filesystem (storagebox-crypt) can cause for SQLite. Node-local means this disk dying
# takes the data with it, so the volume opts into the nightly backup below. See
# docs/src/operations/recovery.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-server-files
  namespace: actual
  annotations:
    # The whole volume is state worth keeping, so no exclude argument here. Its sibling
    # actual-user-files carries no annotation at all: it is on storagebox-crypt, which the
    # Storage Box's own snapshots already cover.
    k8up.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
