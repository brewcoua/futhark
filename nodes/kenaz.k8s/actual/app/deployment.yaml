---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  namespace: actual
spec:
  replicas: 1
  # Single-writer SQLite on a non-shared volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual
  template:
    metadata:
      labels:
        app: actual
      annotations:
        # The budget SQLite, whose only off-node copy is Velero's. `user-files` is deliberately
        # absent: it is storagebox-crypt, already off-node and covered by the box's own
        # snapshots, and naming it here would drag every attachment back through rclone to be
        # re-uploaded to B2. See docs/src/operations/recovery.md.
        backup.velero.io/backup-volumes: server-files
    spec:
      # Service "actual" -> kubelet injects ACTUAL_PORT=tcp://<ip>:80, colliding with
      # convict's ACTUAL_* env prefix and breaking Actual's port validation.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: actual
          image: actualbudget/actual-server:26.8.1@sha256:6478d9ddfc0924479c09e6699c205e354c6f2216dfe7de3c0fb7b590d6edcdc5
          ports:
            - name: http
              containerPort: 5006
          envFrom:
            - configMapRef:
                name: actual-config
            - secretRef:
                name: actual-secrets
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Actual takes its migration lock at the data dir root, which readOnlyRootFilesystem
            # makes unwritable; the two PVCs below nest inside this. Ephemeral on purpose — the
            # lock is per-process, migration state itself lives in the server-files SQLite.
            - name: data
              mountPath: /data
            - name: server-files
              mountPath: /data/server-files
            - name: user-files
              mountPath: /data/user-files
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: server-files
          persistentVolumeClaim:
            claimName: actual-server-files
        - name: user-files
          persistentVolumeClaim:
            claimName: actual-user-files
        - name: tmp
          emptyDir: {}
