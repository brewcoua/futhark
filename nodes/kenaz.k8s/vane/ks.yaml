---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vane
spec:
  path: ./nodes/kenaz.k8s/vane/app
  dependsOn:
    - name: infra-policies
    - name: traefik-internal
    - name: infisical-operator-config
    - name: storage
    # app/ingress.yaml names auth-sso@kubernetescrd, which is infra/auth's Middleware. This app
    # has no login of its own, so that Middleware is the only thing in front of it.
    - name: auth
    - name: substitutions
  # The ingress host is spelled from the same Secret. Neither backend URL needs it: both are
  # cluster-internal Services.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-values
