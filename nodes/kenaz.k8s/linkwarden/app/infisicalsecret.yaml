---
# Four keys at /nodes/kenaz/linkwarden. OIDC_CLIENT_SECRET and OIDC_CLIENT_ID are minted by
# tofu/oidc's pocketid_client.linkwarden and written by the same apply. See docs/src/tofu/oidc.md.
# The ID is not secret; it rides along because Pocket ID generates it and only the apply knows
# its value.
#
# NEXTAUTH_SECRET and POSTGRES_PASSWORD are seeded by hand. POSTGRES_PASSWORD is the same value
# as LINKWARDEN_POSTGRES_PASSWORD in /infra/postgres, and it has to be filed in both places: the
# ValidatingAdmissionPolicy confines the postgres namespace to /infra and this one to
# /nodes/kenaz, so neither can read the other's folder. Rotating it means changing both, in the
# order given in docs/src/operations/rotation.md.
#
# A template block, unlike the other apps here, because DATABASE_URL is not a stored value: only
# its password is. Everything else in the connection string is cluster-internal and belongs in
# git, so it is written out here rather than duplicated into the secret store. A template also
# means every key the app needs has to be listed, since the untemplated keys no longer pass
# through. The password is interpolated into a URL, so generate it from letters and digits only:
# anything needing percent-encoding produces a connection string that parses wrong or not at all.
#
# This is the node tier: the auth it references lives in infisical-node-kenaz, an operator that
# has RBAC in no infra namespace at all, and the ValidatingAdmissionPolicy rejects any
# secretPath here that does not start with /nodes/kenaz.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: linkwarden
  namespace: linkwarden
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-node-kenaz
  sources:
    - secretPath: /nodes/kenaz/linkwarden
  targets:
    - kind: Secret
      name: linkwarden-secrets
      namespace: linkwarden
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET.Value }}"
          OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID.Value }}"
          OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET.Value }}"
          DATABASE_URL: "postgresql://linkwarden:{{ .POSTGRES_PASSWORD.Value }}@postgres-rw.postgres.svc.cluster.local:5432/linkwarden"
  syncOptions:
    refreshInterval: 1m
