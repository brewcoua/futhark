---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvasir
  namespace: kvasir
spec:
  replicas: 1
  # A run is admitted by an in-process semaphore and Co-STORM sessions are local files, so a second
  # pod would enforce neither limit nor see the other's state. Recreate rather than RollingUpdate
  # for the same reason, and no HPA ever.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kvasir
  template:
    metadata:
      labels:
        app: kvasir
    spec:
      containers:
        - name: kvasir
          image: ghcr.io/brewcoua/kvasir:0.1.0@sha256:eec579d9c066878dd4ae6762a9f7c9c2d8345283a1d7b07e3ebfb88d2ffc8c48
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kvasir-config
            - secretRef:
                name: kvasir-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Required, not a convenience: knowledge_storm.encoder opens a litellm disk cache under
            # $HOME while being imported, and the image points HOME here. Without it the process
            # fails before it can serve anything.
            - name: tmp
              mountPath: /tmp
            # KVASIR_DATA_DIR, where Co-STORM writes one JSON file per session. Nothing writes here
            # while only STORM is wired, so there is nothing to keep and no PVC. Giving Co-STORM a
            # gateway that serves embeddings means a PVC and an entry in
            # infra/backup/config/schedules.yaml, not just a config change.
            - name: data
              mountPath: /data
          # /healthz checks nothing on purpose, so a gateway outage cannot restart the pod. /readyz
          # is the one that reaches out, and it costs two HTTP calls each time, which is why it runs
          # far less often than the liveness check.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            # A starting point rather than a measurement: torch and sentence-transformers are loaded
            # in-process for the paraphrase-MiniLM-L6-v2 weights the image bakes in, and a run works
            # across ten threads. Revisit once a real run has been watched.
            limits:
              cpu: 2000m
              memory: 3Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
