---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvasir
  namespace: kvasir
spec:
  replicas: 1
  # A run is admitted by an in-process semaphore and Co-STORM sessions are local files, so a second
  # pod would enforce neither limit nor see the other's state. Recreate rather than RollingUpdate
  # for the same reason, and no HPA ever.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kvasir
  template:
    metadata:
      labels:
        app: kvasir
    spec:
      containers:
        - name: kvasir
          image: ghcr.io/brewcoua/kvasir:0.4.0@sha256:4af425a84ce8a5aada47a08fd0cb881674a94c3ed41b722642d749563b7ae6a2
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kvasir-config
            - secretRef:
                name: kvasir-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Required, not a convenience: dspy creates its disk cache while being imported,
            # whether or not caching is on, and the image points DSPY_CACHEDIR here. A run's
            # scratch directory lands here too. Without it the process fails before it can serve
            # anything.
            - name: tmp
              mountPath: /tmp
            # KVASIR_DATA_DIR, where Co-STORM writes one JSON file per session. Nothing writes here
            # while only STORM is wired, so there is nothing to keep and no PVC. Wiring Co-STORM
            # means a PVC and an entry in infra/backup/config/schedules.yaml, not just a config
            # change; the embeddings it needs now exist, so that is the whole of what is left.
            - name: data
              mountPath: /data
          # /healthz checks nothing on purpose, so a gateway outage cannot restart the pod. /readyz
          # is the one that reaches out, and it costs two HTTP calls each time, which is why it runs
          # far less often than the liveness check.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            # A starting point rather than a measurement. Smaller than it was: nothing runs a model
            # in-process any more, embeddings included, so what is left is dspy and the outbound
            # work of KVASIR_MAX_THREADS threads. Revisit once a real run has been watched.
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
