---
# One key at /nodes/kenaz/kvasir: OPENAI_API_KEY, the virtual key bifrost issues this app.
# tofu/bifrost writes it here and the identical value to /nodes/kenaz/bifrost as VK_KVASIR, because
# both ends have to spell one token the same way. See docs/src/tofu/bifrost.md.
#
# No template block: the one key passes through under the name the app already expects, and a
# template would mean listing every key for no gain.
#
# This is the node tier: the auth it references lives in infisical-node-kenaz, an operator that
# has RBAC in no infra namespace at all, and the ValidatingAdmissionPolicy rejects any secretPath
# here that does not start with /nodes/kenaz.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: kvasir
  namespace: kvasir
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-node-kenaz
  sources:
    - secretPath: /nodes/kenaz/kvasir
  targets:
    - kind: Secret
      name: kvasir-secrets
      namespace: kvasir
      creationPolicy: Owner
  syncOptions:
    refreshInterval: 1m
