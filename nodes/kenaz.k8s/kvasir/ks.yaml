---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kvasir
spec:
  path: ./nodes/kenaz.k8s/kvasir/app
  dependsOn:
    - name: infra-policies
    - name: infisical-operator-config
    - name: traefik-internal
    # app/ingress.yaml names auth-sso@kubernetescrd, which is infra/auth's Middleware. This app has
    # no login of its own, so that Middleware is the only thing in front of the runs page.
    - name: auth
    - name: substitutions
  # No `storage`: both writable paths are emptyDir, because only STORM is wired and STORM keeps
  # nothing.
  #
  # The ingress host is spelled from cluster-values. Neither backend URL needs it: bifrost, searxng
  # and the pipe function calling in all use cluster-internal Services.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-values
