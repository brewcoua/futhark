---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actual
spec:
  path: ./nodes/kenaz.k0s/actual/app
  dependsOn:
    - name: infra-policies
    - name: traefik-internal
    - name: infisical-operator-config
    # app/pvc-user-files.yaml uses storageClassName: storagebox-crypt — previously reached
    # only transitively via infra-policies.
    - name: storage
    - name: substitutions
  # The internal hostname (ingress host, OIDC hostname) and the edge one (Pocket ID's discovery
  # URL) are both spelled from the same Secret.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: dns
