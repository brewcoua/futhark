---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actual
spec:
  path: ./nodes/kenaz.k0s/actual/app
  dependsOn:
    - name: infra-configs
    - name: traefik-internal
    - name: infisical-operator-config
    # app/pvc-user-files.yaml uses storageClassName: storagebox-crypt — previously reached
    # only transitively via infra-configs.
    - name: storage
    - name: substitutions
  # INT_DOMAIN (ingress host, OIDC hostname) is committed SOPS-encrypted in infra/substitutions;
  # DOMAIN (the edge domain, for Pocket ID's discovery URL) is published from the same place, out
  # of config/domain/domain.env.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: int-domain
      - kind: ConfigMap
        name: domain
