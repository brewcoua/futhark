---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
# Reusable Kustomize Component: generates a `domain` ConfigMap (DOMAIN, INT_DOMAIN) from
# domain.env, the single source of truth for this repo's base domains — centralized here
# rather than under infra/ because ansible reads the same file too (see
# ansible/inventory/group_vars/all.yml). Any app/ that needs a hostname adds
# `components: [../../../config/domain]` plus its own `replacements` block to splice a key
# into the right field — see docs/src/conventions/domains.md and infra/monitoring/app/kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: domain
    envs:
      - domain.env
generatorOptions:
  disableNameSuffixHash: true
# Components can't set a top-level `namespace:` (reserved to the root Kustomization), so the
# generated ConfigMap above would otherwise carry none and fail to apply. Every consumer
# needs the same namespace regardless of its own target namespace, so it's patched here once.
patches:
  - target:
      kind: ConfigMap
      name: domain
    patch: |
      - op: add
        path: /metadata/namespace
        value: flux-system
