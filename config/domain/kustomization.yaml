---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
# Reusable Kustomize Component: generates a `domain` ConfigMap (DOMAIN only) from domain.env,
# the single source of truth for the edge base domain. Any app/ that needs an edge hostname adds
# `components: [../../../config/domain]` plus its own `replacements` block to splice DOMAIN
# into the right field — see docs/src/conventions/domains.md.
#
# INT_DOMAIN lives elsewhere: infra/substitutions/app/int-domain.sops.yaml, a SOPS-encrypted
# Secret, consumed as ${INT_DOMAIN} via postBuild.substituteFrom (see infra/monitoring/ks.yaml
# for the reference wiring). Unlike DOMAIN it's not committed in the clear.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: domain
    envs:
      - domain.env
generatorOptions:
  disableNameSuffixHash: true
# Components can't set a top-level `namespace:` (reserved to the root Kustomization), so the
# generated ConfigMap above would otherwise carry none and fail to apply. Every consumer
# needs the same namespace regardless of its own target namespace, so it's patched here once.
patches:
  - target:
      kind: ConfigMap
      name: domain
    patch: |
      - op: add
        path: /metadata/namespace
        value: flux-system
