---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
# Exists only so infra/substitutions can reference this directory: kustomize refuses to load a
# *file* outside the kustomization's own root, but follows a directory anywhere in the repo.
#
# cluster.sops.yaml is the whole list. ops.sops.yaml is deliberately absent: the cluster cannot
# decrypt it and must never be handed it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster.sops.yaml
