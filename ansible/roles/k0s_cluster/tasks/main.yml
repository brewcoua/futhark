---
# Renders k0sctl.yaml from every workflow: k0s host in inventory and converges the
# whole fleet in one k0sctl apply — runs once per play (hosts: localhost), not per-host.
- name: Ensure the generated-artifacts directory exists
  ansible.builtin.file:
    path: "{{ generated_dir }}"
    state: directory
    mode: "0700"

# Used by the template to identify which host is the k0s controller.
- name: Determine the k0s controller host
  ansible.builtin.set_fact:
    k0s_cluster_controller_host: >-
      {{ groups['all'] | map('extract', hostvars) |
      selectattr('node.workflow', 'equalto', 'k0s') |
      selectattr('node.k0s_role', 'search', 'controller') |
      map(attribute='node.hostname') | first }}

# Mesh IPs come from each node's own `tailscale ip -4`, recorded into
# ansible/nodes/<host>/host.sops.yml by the tailscale role at join time and surfaced here as
# node.mesh_ip (host_vars/<host>/host.sops.yml symlinks to it). Read from inventory rather
# than resolved per-run: this play is `hosts: localhost` in a separate run from setup.yml, so
# a MagicDNS lookup here would require the operator's own workstation to be on the tailnet and
# would lag a node's join by seconds. See docs/src/ansible/index.md#k0s_cluster.
- name: Assert every k0s host has a recorded mesh IP
  ansible.builtin.assert:
    that: hostvars[item].node.mesh_ip | default('') | length > 0
    fail_msg: >-
      {{ item }} has no node.mesh_ip recorded — run playbooks/setup.yml against it first, which
      joins the tailnet and writes the address into ansible/nodes/{{ item }}/host.sops.yml.
  loop: "{{ groups['all'] }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item].node.workflow == 'k0s'

# k0s would otherwise self-detect spec.api.address from the default-route interface — the
# public IP — and join tokens would carry an address workers can't reach.
- name: Set the controller's mesh IP fact
  ansible.builtin.set_fact:
    k0s_cluster_controller_mesh_ip: "{{ hostvars[k0s_cluster_controller_host].node.mesh_ip }}"

# A recorded address that is no longer a tailnet address (node deleted and re-registered into
# a different pool, value hand-edited) would otherwise get baked silently into
# spec.api.address and every kubelet's --node-ip. Tailscale's CGNAT pool is 100.64.0.0/10 —
# second octet 64-127. privateInterface only feeds spec.api.address/etcd peerAddress, never
# kubelet: under --cloud-provider=external kubelet won't self-assign InternalIP without an
# explicit --node-ip, so every k0s host's own mesh IP is checked here, not just the
# controller's.
- name: Assert every recorded mesh IP is inside the tailnet's CGNAT range
  ansible.builtin.assert:
    that: >-
      hostvars[item].node.mesh_ip is
      regex('^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.')
    fail_msg: >-
      {{ item }} has node.mesh_ip {{ hostvars[item].node.mesh_ip }}, which isn't a
      100.64.0.0/10 tailnet address — stale value in ansible/nodes/{{ item }}/host.sops.yml?
  loop: "{{ groups['all'] }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item].node.workflow == 'k0s'

- name: Render k0sctl.yaml from inventory
  ansible.builtin.template:
    src: k0sctl.yaml.j2
    dest: "{{ generated_dir }}/k0sctl.yaml"
    mode: "0600"

- name: Converge the k0s cluster
  ansible.builtin.command:
    cmd: "k0sctl apply --config {{ generated_dir }}/k0sctl.yaml"
  changed_when: true

- name: Fetch the cluster kubeconfig
  ansible.builtin.command:
    cmd: "k0sctl kubeconfig --config {{ generated_dir }}/k0sctl.yaml"
  register: k0s_cluster_kubeconfig_fetch
  changed_when: true
  no_log: true

# Written explicitly at 0600 rather than via a shell redirect (which inherits umask) — this
# holds the cluster-admin client key.
- name: Write the kubeconfig
  ansible.builtin.copy:
    content: "{{ k0s_cluster_kubeconfig_fetch.stdout }}"
    dest: "{{ generated_dir }}/kubeconfig"
    mode: "0600"
  no_log: true

# kubelet can only ever register --node-ip as InternalIP, so the public IP arrives via this
# annotation, which the k0s cloud provider reads. node.ip comes from the SOPS-encrypted
# host.sops.yml — never committed in the clear.
- name: Annotate nodes with their external IP (k0s cloud provider)
  ansible.builtin.command:
    cmd: >-
      kubectl annotate node {{ hostvars[item].node.hostname }}
      k0sproject.io/node-ip-external={{ hostvars[item].node.ip }} --overwrite
  environment:
    KUBECONFIG: "{{ generated_dir }}/kubeconfig"
  loop: "{{ groups['all'] }}"
  when: hostvars[item].node.workflow == 'k0s'
  changed_when: true
