---
# Renders k0sctl.yaml from every workflow: k0s host in inventory and converges the
# whole fleet in one k0sctl apply — runs once per play (hosts: localhost), not per-host.
- name: Ensure the generated-artifacts directory exists
  ansible.builtin.file:
    path: "{{ generated_dir }}"
    state: directory
    mode: "0700"

# Used by the template to identify which host is the k0s controller.
- name: Determine the k0s controller host
  ansible.builtin.set_fact:
    k0s_cluster_controller_host: >-
      {{ groups['all'] | map('extract', hostvars) |
      selectattr('node.workflow', 'equalto', 'k0s') |
      selectattr('node.k0s_role', 'search', 'controller') |
      map(attribute='node.hostname') | first }}

# k0s otherwise self-detects spec.api.address from the default-route interface, which on
# these hosts is the public IP — join tokens then carry that address, and workers can't
# reach it (no route to host). Resolve the controller's mesh address the same way
# ansible_host does (via MagicDNS), using getent instead of a dig lookup so no extra
# python dependency (dnspython) is required.
- name: Resolve the controller's mesh IP
  ansible.builtin.command:
    cmd: "getent hosts {{ k0s_cluster_controller_host }}.{{ tailnet_domain }}"
  register: k0s_cluster_controller_getent
  changed_when: false

- name: Set the controller's mesh IP fact
  ansible.builtin.set_fact:
    k0s_cluster_controller_mesh_ip: "{{ k0s_cluster_controller_getent.stdout_lines[0].split()[0] }}"

# privateInterface only feeds spec.api.address/etcd peerAddress above, never kubelet — under
# --enable-cloud-provider=true (kubelet --cloud-provider=external) kubelet won't self-assign
# InternalIP at all without an explicit --node-ip, so every k0s host needs its own mesh IP
# resolved the same way, passed straight to kubelet via installFlags in the template.
- name: Resolve every k0s host's mesh IP (for kubelet --node-ip)
  ansible.builtin.command:
    cmd: "getent hosts {{ hostvars[item].node.hostname }}.{{ tailnet_domain }}"
  register: k0s_cluster_mesh_ip_getent
  changed_when: false
  loop: "{{ groups['all'] }}"
  when: hostvars[item].node.workflow == 'k0s'

- name: Build a hostname -> mesh IP map
  ansible.builtin.set_fact:
    k0s_cluster_mesh_ips: >-
      {{ k0s_cluster_mesh_ips | default({}) |
      combine({hostvars[item.item].node.hostname: item.stdout_lines[0].split()[0]}) }}
  loop: "{{ k0s_cluster_mesh_ip_getent.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (item.skipped | default(false))

- name: Render k0sctl.yaml from inventory
  ansible.builtin.template:
    src: k0sctl.yaml.j2
    dest: "{{ generated_dir }}/k0sctl.yaml"
    mode: "0600"

- name: Converge the k0s cluster
  ansible.builtin.command:
    cmd: "k0sctl apply --config {{ generated_dir }}/k0sctl.yaml"
  changed_when: true

- name: Fetch the cluster kubeconfig
  ansible.builtin.shell:
    cmd: "k0sctl kubeconfig --config {{ generated_dir }}/k0sctl.yaml > {{ generated_dir }}/kubeconfig"
  changed_when: true

# kubelet can only ever register --node-ip as InternalIP (never ExternalIP), so the public
# IP has to arrive some other way — the k0s cloud provider (--enable-cloud-provider=true /
# --enable-k0s-cloud-provider=true above) reads it from this annotation instead. node.ip is
# a pass:// lookup, so the public IP is never committed.
- name: Annotate nodes with their external IP (k0s cloud provider)
  ansible.builtin.command:
    cmd: >-
      kubectl annotate node {{ hostvars[item].node.hostname }}
      k0sproject.io/node-ip-external={{ hostvars[item].node.ip }} --overwrite
  environment:
    KUBECONFIG: "{{ generated_dir }}/kubeconfig"
  loop: "{{ groups['all'] }}"
  when: hostvars[item].node.workflow == 'k0s'
  changed_when: true
