---
# Renders k0sctl.yaml from every workflow: k0s host in inventory and converges the
# whole fleet in one k0sctl apply — runs once per play (hosts: localhost), not per-host.
- name: Ensure the generated-artifacts directory exists
  ansible.builtin.file:
    path: "{{ generated_dir }}"
    state: directory
    mode: "0700"

# Used by the template to identify which host is the k0s controller.
- name: Determine the k0s controller host
  ansible.builtin.set_fact:
    k0s_cluster_controller_host: >-
      {{ groups['all'] | map('extract', hostvars) |
      selectattr('node.workflow', 'equalto', 'k0s') |
      selectattr('node.k0s_role', 'search', 'controller') |
      map(attribute='node.hostname') | first }}

# k0s would otherwise self-detect spec.api.address from the default-route interface — the
# public IP — and join tokens would carry an address workers can't reach. getent rather than a
# dig lookup so no dnspython dependency. See docs/src/ansible/index.md#k0s_cluster.
- name: Resolve the controller's mesh IP
  ansible.builtin.command:
    cmd: "getent hosts {{ k0s_cluster_controller_host }}.{{ tailnet_domain }}"
  register: k0s_cluster_controller_getent
  changed_when: false
  # MagicDNS can lag a few seconds behind a peer's tailnet join, and this runs on the
  # operator's own machine — requires it to be on the tailnet itself.
  retries: 6
  delay: 5
  until: k0s_cluster_controller_getent.rc == 0

- name: Set the controller's mesh IP fact
  ansible.builtin.set_fact:
    k0s_cluster_controller_mesh_ip: "{{ k0s_cluster_controller_getent.stdout_lines[0].split()[0] }}"

# A stale MagicDNS entry (deleted node, re-keyed host) resolving to a non-tailnet address
# would otherwise get baked silently into spec.api.address and every kubelet's --node-ip.
# Tailscale's CGNAT pool is 100.64.0.0/10 — second octet 64-127.
- name: Assert the controller's mesh IP is actually inside the tailnet's CGNAT range
  ansible.builtin.assert:
    that: >-
      k0s_cluster_controller_mesh_ip is regex('^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.')
    fail_msg: >-
      {{ k0s_cluster_controller_host }}.{{ tailnet_domain }} resolved to
      {{ k0s_cluster_controller_mesh_ip }}, which isn't a 100.64.0.0/10 tailnet address —
      stale MagicDNS entry?

# privateInterface only feeds spec.api.address/etcd peerAddress, never kubelet — under
# --cloud-provider=external kubelet won't self-assign InternalIP without an explicit --node-ip,
# so every k0s host needs its own mesh IP passed via installFlags in the template.
- name: Resolve every k0s host's mesh IP (for kubelet --node-ip)
  ansible.builtin.command:
    cmd: "getent hosts {{ hostvars[item].node.hostname }}.{{ tailnet_domain }}"
  register: k0s_cluster_mesh_ip_getent
  changed_when: false
  retries: 6
  delay: 5
  until: k0s_cluster_mesh_ip_getent.rc == 0
  loop: "{{ groups['all'] }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item].node.workflow == 'k0s'

- name: Build a hostname -> mesh IP map
  ansible.builtin.set_fact:
    k0s_cluster_mesh_ips: >-
      {{ k0s_cluster_mesh_ips | default({}) |
      combine({hostvars[item.item].node.hostname: item.stdout_lines[0].split()[0]}) }}
  loop: "{{ k0s_cluster_mesh_ip_getent.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (item.skipped | default(false))

- name: Render k0sctl.yaml from inventory
  ansible.builtin.template:
    src: k0sctl.yaml.j2
    dest: "{{ generated_dir }}/k0sctl.yaml"
    mode: "0600"

- name: Converge the k0s cluster
  ansible.builtin.command:
    cmd: "k0sctl apply --config {{ generated_dir }}/k0sctl.yaml"
  changed_when: true

- name: Fetch the cluster kubeconfig
  ansible.builtin.command:
    cmd: "k0sctl kubeconfig --config {{ generated_dir }}/k0sctl.yaml"
  register: k0s_cluster_kubeconfig_fetch
  changed_when: true
  no_log: true

# Written explicitly at 0600 rather than via a shell redirect (which inherits umask) — this
# holds the cluster-admin client key.
- name: Write the kubeconfig
  ansible.builtin.copy:
    content: "{{ k0s_cluster_kubeconfig_fetch.stdout }}"
    dest: "{{ generated_dir }}/kubeconfig"
    mode: "0600"
  no_log: true

# kubelet can only ever register --node-ip as InternalIP, so the public IP arrives via this
# annotation, which the k0s cloud provider reads. node.ip is a pass:// lookup — never committed.
- name: Annotate nodes with their external IP (k0s cloud provider)
  ansible.builtin.command:
    cmd: >-
      kubectl annotate node {{ hostvars[item].node.hostname }}
      k0sproject.io/node-ip-external={{ hostvars[item].node.ip }} --overwrite
  environment:
    KUBECONFIG: "{{ generated_dir }}/kubeconfig"
  loop: "{{ groups['all'] }}"
  when: hostvars[item].node.workflow == 'k0s'
  changed_when: true
