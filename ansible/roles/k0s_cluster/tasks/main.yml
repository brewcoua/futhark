---
# Renders k0sctl.yaml from every workflow: k0s host in inventory and converges the
# whole fleet in one k0sctl apply — runs once per play (hosts: localhost), not per-host.
- name: Ensure the generated-artifacts directory exists
  ansible.builtin.file:
    path: "{{ generated_dir }}"
    state: directory
    mode: "0700"

# "the k0s hosts" was previously re-derived at each of five use sites — three `when:` guards
# here plus a `{% if %}` in the template — so a change to what counts as a k0s host had five
# places to miss. Derived once; everything below loops over this.
- name: Select the k0s hosts from inventory
  ansible.builtin.set_fact:
    k0s_cluster_hosts: >-
      {{ groups['all'] | map('extract', hostvars) |
      selectattr('node.workflow', 'equalto', 'k0s') |
      map(attribute='inventory_hostname') | list }}

# Used by the template to identify which host is the k0s controller.
- name: Determine the k0s controller host
  ansible.builtin.set_fact:
    k0s_cluster_controller_host: >-
      {{ k0s_cluster_hosts | map('extract', hostvars) |
      selectattr('node.k0s_role', 'search', 'controller') |
      map(attribute='inventory_hostname') | first }}

# Mesh IPs come from each node's own `netbird status`, recorded into
# ansible/nodes/<host>/host.sops.yml by the netbird role at join time and surfaced here as
# node.mesh_ip (host_vars/<host>/host.sops.yml symlinks to it). Read from inventory rather
# than resolved per-run: this play is `hosts: localhost` in a separate run from setup.yml, so
# resolving a peer name here would require the operator's own workstation to be on the mesh and
# would lag a node's join by seconds. See docs/src/ansible/index.md#k0s_cluster.
#
# The range check catches a recorded address that is no longer a mesh address (node deleted
# and re-registered into a different pool, value hand-edited) before it gets baked silently
# into spec.api.address and every kubelet's --node-ip. privateInterface only feeds
# spec.api.address/etcd peerAddress, never kubelet: under --cloud-provider=external kubelet
# won't self-assign InternalIP without an explicit --node-ip, so every k0s host's own mesh IP
# is checked, not just the controller's.
- name: Assert every k0s host has a recorded mesh IP inside the mesh pool
  ansible.builtin.assert:
    that:
      - hostvars[item].node.mesh_ip | default('') | length > 0
      - hostvars[item].node.mesh_ip is regex(mesh_cidr_regex)
    fail_msg: >-
      {{ item }} has node.mesh_ip
      '{{ hostvars[item].node.mesh_ip | default('') }}', which isn't an address in the mesh's
      {{ mesh_cidr }} pool — run playbooks/setup.yml against it first, which joins the mesh
      and writes the address into ansible/nodes/{{ item }}/host.sops.yml, or check that file
      for a stale value.
  loop: "{{ k0s_cluster_hosts }}"
  loop_control:
    label: "{{ item }}"

# k0s would otherwise self-detect spec.api.address from the default-route interface — the
# public IP — and join tokens would carry an address workers can't reach.
- name: Set the controller's mesh IP fact
  ansible.builtin.set_fact:
    k0s_cluster_controller_mesh_ip: "{{ hostvars[k0s_cluster_controller_host].node.mesh_ip }}"

- name: Render k0sctl.yaml from inventory
  ansible.builtin.template:
    src: k0sctl.yaml.j2
    dest: "{{ generated_dir }}/k0sctl.yaml"
    mode: "0600"

# --kubeconfig-out writes the admin kubeconfig as part of the same apply, so there is no second
# `k0sctl kubeconfig` invocation whose --config could drift from this one's.
- name: Converge the k0s cluster
  ansible.builtin.command:
    cmd: >-
      k0sctl apply --config {{ generated_dir }}/k0sctl.yaml
      --kubeconfig-out {{ generated_dir }}/kubeconfig
  register: k0s_cluster_apply
  no_log: true
  # k0sctl has no "nothing to do" signal: it walks its whole phase list every run and exits 0
  # either way, which is why this task used to be `changed_when: true` and reported changed on
  # a fully-converged fleet. These are the lines it prints only when it actually mutates a
  # host. Re-check them against real output after a k0sctl bump — a marker that quietly stops
  # matching turns this into "never changed", which is the failure mode to watch for.
  changed_when: >-
    k0s_cluster_apply.stdout is search('is now installed|Upgrading|Reinstalling|restart the k0s service')

# k0sctl's output file mode is not part of its contract, and this holds the cluster-admin
# client key.
- name: Restrict the kubeconfig to the operator
  ansible.builtin.file:
    path: "{{ generated_dir }}/kubeconfig"
    mode: "0600"

# kubelet can only ever register --node-ip as InternalIP, so the public IP arrives via this
# annotation, which the k0s cloud provider reads. node.ip comes from the SOPS-encrypted
# host.sops.yml — never committed in the clear.
- name: Annotate nodes with their external IP (k0s cloud provider)
  ansible.builtin.command:
    cmd: >-
      kubectl annotate node {{ hostvars[item].node.hostname }}
      k0sproject.io/node-ip-external={{ hostvars[item].node.ip }} --overwrite
  environment:
    KUBECONFIG: "{{ generated_dir }}/kubeconfig"
  loop: "{{ k0s_cluster_hosts }}"
  loop_control:
    label: "{{ item }}"
  register: k0s_cluster_annotate
  # kubectl prints "node/x annotated" when the value moved and "node/x not annotated" when
  # --overwrite found it already correct. Its own idempotency report, so use it.
  changed_when: "'not annotated' not in k0s_cluster_annotate.stdout"
