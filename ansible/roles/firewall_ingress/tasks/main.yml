---
# Opens the public zone for edge ingress. TLS only — no plaintext HTTP, so 80 stays closed.
# Gated by node.public_ingress in playbooks/setup.yml — nothing in here branches on hostname,
# same convention as roles/netbird (any future node opts in just by setting node.public_ingress: true).
- name: Open HTTPS in firewalld's public zone
  ansible.posix.firewalld:
    port: "443/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: node.os == 'fedora'

- name: Close plaintext HTTP in firewalld's public zone (previously opened, no longer served)
  ansible.posix.firewalld:
    port: "80/tcp"
    permanent: true
    immediate: true
    state: disabled
  when: node.os == 'fedora'

# traefik-edge runs hostNetwork + non-root, so it binds 443 in this host's own network
# namespace. This node's containerd (2.3.3) never populates the inheritable/ambient capability
# sets, so a granted NET_BIND_SERVICE capability gets wiped the moment the container drops to
# non-root — see containerd/containerd#5644. Lowering the host's unprivileged port floor below
# 443 sidesteps that entirely: no capability needed to bind it. Host-level because hostNetwork
# pods share the host's netns, so the per-pod securityContext.sysctls form doesn't apply here.
- name: Allow unprivileged binds down to 443 (works around containerd not setting ambient caps)
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "443"
    sysctl_set: true
    state: present
    reload: true
