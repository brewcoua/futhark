---
# Opens the public zone for edge ingress. TLS only — no plaintext HTTP, so 80 stays closed.
# Gated by node.public_ingress in playbooks/setup.yml — nothing in here branches on hostname,
# same convention as roles/tailscale (any future node opts in just by setting node.public_ingress: true).
- name: Open HTTPS in firewalld's public zone
  ansible.posix.firewalld:
    port: "443/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: node.os == 'fedora'

- name: Close plaintext HTTP in firewalld's public zone (previously opened, no longer served)
  ansible.posix.firewalld:
    port: "80/tcp"
    permanent: true
    immediate: true
    state: disabled
  when: node.os == 'fedora'
