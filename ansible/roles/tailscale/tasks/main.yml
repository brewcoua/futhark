---
# Generic Tailscale mesh join. Gated by node.mesh in playbooks/setup.yml — nothing in here
# branches on hostname or workflow, so any future node opts in just by setting node.mesh: true.
- name: Install the Tailscale repo
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    dest: /etc/yum.repos.d/tailscale.repo
    mode: "0644"
  when: node.os == 'fedora'

- name: Install tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present
  when: node.os == 'fedora'

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Check current Tailscale status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Get an OAuth access token scoped to auth-key creation
  ansible.builtin.uri:
    url: https://api.tailscale.com/api/v2/oauth/token
    method: POST
    body_format: form-urlencoded
    body:
      client_id: "{{ lookup('protonpass', 'pass://futharkd/tailscale/client id') }}"
      client_secret: "{{ lookup('protonpass', 'pass://futharkd/tailscale/client secret') }}"
    status_code: 200
  register: tailscale_oauth_token
  no_log: true
  when: >-
    tailscale_status.rc != 0 or
    (tailscale_status.stdout | from_json).BackendState != 'Running'

# Single-use, tag-scoped, short-lived — minted fresh for this join instead of reading a
# standing reusable authkey out of Proton Pass.
- name: Mint a single-use auth key
  ansible.builtin.uri:
    url: https://api.tailscale.com/api/v2/tailnet/-/keys
    method: POST
    headers:
      Authorization: "Bearer {{ tailscale_oauth_token.json.access_token }}"
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: false
            ephemeral: false
            preauthorized: true
            tags: ["tag:futhark-node"]
      expirySeconds: 300
    status_code: 200
  register: tailscale_authkey
  no_log: true
  when: tailscale_oauth_token is not skipped

- name: Join the tailnet
  ansible.builtin.command:
    cmd: >
      tailscale up
      --authkey={{ tailscale_authkey.json.key }}
      --advertise-tags=tag:futhark-node
      --ssh
  when: tailscale_authkey is not skipped
  changed_when: true
  no_log: true

# Bind tailscale0 to firewalld's built-in "trusted" zone: the tailnet is the mesh's own
# trust boundary (see ansible/nodes/README.md's mesh note), so anything a node binds to its
# tailscale0 address (k0s's API server, OpenBao, ...) is reachable over it without punching
# per-port holes in the public zone (ens3), which stays limited to the hardened SSH port.
- name: Put tailscale0 in firewalld's trusted zone
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    permanent: true
    immediate: true
    state: enabled
  when: node.os == 'fedora'

# The CNI bridge is in no zone, so it lands in the default "public" zone, which is
# deliberately limited to the hardened SSH port and 80/443. Trust the cluster's own dataplane
# explicitly instead — standard practice for firewalld-on-Kubernetes hosts, and it keeps the
# CNI path reproducible from this tree rather than resting on ad-hoc --direct rules.
- name: Trust the CNI bridge and cluster CIDRs in firewalld
  ansible.posix.firewalld:
    zone: trusted
    permanent: true
    immediate: true
    state: enabled
    interface: "{{ item.interface | default(omit) }}"
    source: "{{ item.source | default(omit) }}"
  loop:
    - interface: kube-bridge
    - source: "{{ k0s_pod_cidr }}"
    - source: "{{ k0s_service_cidr }}"
  loop_control:
    label: "{{ item.interface | default(item.source) }}"
  when: node.os == 'fedora'

# A pod dialing a mesh peer's own address (as opposed to the peer's pod CIDR) is broken twice
# over, and both halves have to be fixed. konnectivity-agent does exactly this — it dials the
# controller's konnectivity-server over the mesh — so while it's broken, kubectl
# exec/logs/port-forward are down cluster-wide.
#
# 1. kube-router installs `from <this node's pod CIDR> lookup 77` at pref 5209 for the IPIP
#    overlay it builds between nodes (kenaz/ogma share no L2), and puts the peer's mesh IP in
#    table 77 pointing at the tunnel. That outranks Tailscale's own pref 5270 (lookup 52), so
#    the packet is routed into the very tunnel whose transport endpoint IS that address.
#
# 2. Even with routing corrected, tailscaled drops packets whose source is not the node's own
#    tailnet IP, as anti-spoofing — so pod-sourced packets still die on egress. They have to be
#    masqueraded to the node's mesh IP. (Nothing else does this: kube-proxy's KUBE-POSTROUTING
#    only masquerades service traffic carrying the 0x4000 mark.)
#
# Both fixes are one narrow rule per mesh peer, matching only that peer's single mesh IP and
# never the pod CIDR ranges, so kube-router's legitimate pod-to-pod overlay routing is
# untouched. Neither `ip rule` nor iptables state survives a reboot, hence the systemd oneshot
# — same reasoning as everything else here being reproducible from scratch.
- name: Resolve every other mesh peer's mesh IP
  ansible.builtin.command:
    cmd: "getent hosts {{ hostvars[item].node.hostname }}.{{ tailnet_domain }}"
  register: tailscale_peer_getent
  loop: "{{ groups['all'] }}"
  loop_control:
    label: "{{ item }}"
  when:
    - item != inventory_hostname
    - hostvars[item].node.mesh | default(false)
  changed_when: false
  # A from-scratch multi-node run, or setup.yml limited to one host at a time, can hit this
  # before every peer has finished its own "Join the tailnet" task above and MagicDNS has
  # propagated the new peer. Retry instead of aborting the whole play on the first race.
  retries: 6
  delay: 5
  until: tailscale_peer_getent.rc == 0

- name: Build a hostname -> peer mesh IP map
  ansible.builtin.set_fact:
    tailscale_peer_ips: >-
      {{ tailscale_peer_ips | default({}) |
         combine({item.item: item.stdout_lines[0].split()[0]}) }}
  loop: "{{ tailscale_peer_getent.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.skipped is not defined

- name: Install the pod -> mesh routing/SNAT script
  ansible.builtin.template:
    src: futhark-mesh-routes.sh.j2
    dest: /usr/local/bin/futhark-mesh-routes.sh
    mode: "0755"
  when: node.os == 'fedora' and tailscale_peer_ips is defined

- name: Install the pod -> mesh routing/SNAT systemd unit
  ansible.builtin.template:
    src: futhark-mesh-routes.service.j2
    dest: /etc/systemd/system/futhark-mesh-routes.service
    mode: "0644"
  when: node.os == 'fedora' and tailscale_peer_ips is defined

- name: Enable and (re)run the pod -> mesh routing/SNAT service now
  ansible.builtin.systemd:
    name: futhark-mesh-routes
    daemon_reload: true
    enabled: true
    state: restarted
  when: node.os == 'fedora' and tailscale_peer_ips is defined
