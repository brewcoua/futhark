---
# Generic Tailscale mesh join. Gated by node.mesh in playbooks/setup.yml — nothing in here
# branches on hostname or workflow, so any future node opts in just by setting node.mesh: true.
- name: Install the Tailscale repo
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    dest: /etc/yum.repos.d/tailscale.repo
    mode: "0644"
  when: node.os == 'fedora'

- name: Install tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present
  when: node.os == 'fedora'

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Check current Tailscale status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Get an OAuth access token scoped to auth-key creation
  ansible.builtin.uri:
    url: https://api.tailscale.com/api/v2/oauth/token
    method: POST
    body_format: form-urlencoded
    body:
      client_id: "{{ lookup('bitwarden.secrets.lookup', bws_ids.tailscale_client_id, base_url=bws_base_url) }}"
      client_secret: "{{ lookup('bitwarden.secrets.lookup', bws_ids.tailscale_client_secret, base_url=bws_base_url) }}"
    status_code: 200
  register: tailscale_oauth_token
  no_log: true
  when: >-
    tailscale_status.rc != 0 or
    (tailscale_status.stdout | from_json).BackendState != 'Running'

# Single-use, tag-scoped, short-lived — minted fresh for this join instead of reading a
# standing reusable authkey out of Proton Pass.
- name: Mint a single-use auth key
  ansible.builtin.uri:
    url: https://api.tailscale.com/api/v2/tailnet/-/keys
    method: POST
    headers:
      Authorization: "Bearer {{ tailscale_oauth_token.json.access_token }}"
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: false
            ephemeral: false
            preauthorized: true
            tags: ["tag:futhark-node"]
      expirySeconds: 300
    status_code: 200
  register: tailscale_authkey
  no_log: true
  when: tailscale_oauth_token is not skipped

- name: Join the tailnet
  ansible.builtin.command:
    cmd: >
      tailscale up
      --authkey={{ tailscale_authkey.json.key }}
      --advertise-tags=tag:futhark-node
      --ssh
  when: tailscale_authkey is not skipped
  changed_when: true
  no_log: true

# The tailnet assigns the mesh address at registration — it can't be chosen (nodeAttrs ipPool
# constrains the pool, and ACL rules can't target a hostname at all), so it can only be read
# back from the node itself. Recorded into the node's SOPS file rather than resolved per-run
# because the consumers are all outside this run: playbooks/k0s.yml is a separate invocation
# on localhost, and tofu/bunny needs the same value from outside Ansible entirely.
# Unconditional — `tailscale up` above is skipped on an already-joined node, but the address
# still has to be readable on every run.
- name: Read the node's mesh IP
  ansible.builtin.command:
    cmd: tailscale ip -4
  register: tailscale_mesh_ip
  changed_when: false
  # Registration completes a moment after `tailscale up` returns.
  retries: 6
  delay: 5
  until: tailscale_mesh_ip.rc == 0 and tailscale_mesh_ip.stdout | trim | length > 0

# sops re-encrypts on every write and the ciphertext changes even when the plaintext doesn't,
# so writing unconditionally would leave a spurious diff after every converge. Compare first.
- name: Read the mesh IP currently recorded for this node
  ansible.builtin.command:
    cmd: sops -d --extract '["node_mesh_ip"]' {{ tailscale_node_sops_file }}
  register: tailscale_recorded_mesh_ip
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false

- name: Record the mesh IP in the node's SOPS file
  ansible.builtin.command:
    cmd: >-
      sops set {{ tailscale_node_sops_file }}
      '["node_mesh_ip"]' '"{{ tailscale_mesh_ip.stdout | trim }}"'
  when: tailscale_recorded_mesh_ip.stdout | trim != tailscale_mesh_ip.stdout | trim
  changed_when: true
  delegate_to: localhost
  become: false

# The tailnet is the mesh's own trust boundary, so anything a node binds to tailscale0 (k0s's
# API server) is reachable over it without punching per-port holes in the public zone,
# which stays limited to the hardened SSH port. See docs/src/ansible/index.md.
- name: Put tailscale0 in firewalld's trusted zone
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    permanent: true
    immediate: true
    state: enabled
  when: node.os == 'fedora'

# The CNI bridge is in no zone, so it would land in the default "public" zone, which is
# limited to the hardened SSH port and 80/443. Trust the cluster's own dataplane explicitly.
- name: Trust the CNI bridge and cluster CIDRs in firewalld
  ansible.posix.firewalld:
    zone: trusted
    permanent: true
    immediate: true
    state: enabled
    interface: "{{ item.interface | default(omit) }}"
    source: "{{ item.source | default(omit) }}"
  loop:
    - interface: kube-bridge
    - source: "{{ k0s_pod_cidr }}"
    - source: "{{ k0s_service_cidr }}"
  loop_control:
    label: "{{ item.interface | default(item.source) }}"
  when: node.os == 'fedora'

# A pod dialing a mesh peer's own address is broken twice over — routing and source address —
# and the fix is one narrow rule per peer. konnectivity-agent does exactly this, so while it's
# broken, kubectl exec/logs/port-forward are down cluster-wide. Full write-up:
# docs/src/ansible/networking.md. The systemd oneshot exists because neither `ip rule` nor
# iptables state survives a reboot.
- name: Resolve every other mesh peer's mesh IP
  ansible.builtin.command:
    cmd: "getent hosts {{ hostvars[item].node.hostname }}.{{ tailnet_domain }}"
  register: tailscale_peer_getent
  loop: "{{ groups['all'] }}"
  loop_control:
    label: "{{ item }}"
  when:
    - item != inventory_hostname
    - hostvars[item].node.mesh | default(false)
  changed_when: false
  # A from-scratch multi-node run, or setup.yml limited to one host at a time, can hit this
  # before every peer has finished its own "Join the tailnet" task above and MagicDNS has
  # propagated the new peer. Retry instead of aborting the whole play on the first race.
  retries: 6
  delay: 5
  until: tailscale_peer_getent.rc == 0

- name: Build a hostname -> peer mesh IP map
  ansible.builtin.set_fact:
    tailscale_peer_ips: >-
      {{ tailscale_peer_ips | default({}) |
         combine({item.item: item.stdout_lines[0].split()[0]}) }}
  loop: "{{ tailscale_peer_getent.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.skipped is not defined

- name: Install the pod -> mesh routing/SNAT script
  ansible.builtin.template:
    src: futhark-mesh-routes.sh.j2
    dest: /usr/local/bin/futhark-mesh-routes.sh
    mode: "0755"
  when: node.os == 'fedora' and tailscale_peer_ips is defined

- name: Install the pod -> mesh routing/SNAT systemd unit
  ansible.builtin.template:
    src: futhark-mesh-routes.service.j2
    dest: /etc/systemd/system/futhark-mesh-routes.service
    mode: "0644"
  when: node.os == 'fedora' and tailscale_peer_ips is defined

- name: Enable and (re)run the pod -> mesh routing/SNAT service now
  ansible.builtin.systemd:
    name: futhark-mesh-routes
    daemon_reload: true
    enabled: true
    state: restarted
  when: node.os == 'fedora' and tailscale_peer_ips is defined
