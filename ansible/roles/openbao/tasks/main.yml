---
# Day-2: init (once) + idempotent namespace/mount/auth/policy bootstrap. Invoked by
# ansible/playbooks/bao.yml (task bao:status / task bao:policy-sync), never by k0s.yml —
# prep.yml (Namespace + seal Secret) is the only piece that has to run before Flux.
# Assumes infra/openbao has already reconciled: the StatefulSet exists and its pod is
# reachable via kubectl exec, no podman/SSH involved.

- name: Wait for the OpenBao pod to answer
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig={{ generated_dir }}/kubeconfig -n openbao exec openbao-0 --
      bao status -format=json
  register: openbao_status
  until: openbao_status.rc in [0, 2] # 0 = unsealed, 2 = sealed-but-reachable (shouldn't linger — seal is kmip, auto-unseals)
  retries: 30
  delay: 5
  changed_when: false
  failed_when: false

- name: Initialize OpenBao (kmip seal — auto-unseals on every start, no Shamir key to manage)
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig={{ generated_dir }}/kubeconfig -n openbao exec openbao-0 --
      bao operator init -format=json
  register: openbao_init
  when: not (openbao_status.stdout | from_json).initialized
  changed_when: true

- name: Print the recovery keys and root token for one-time manual copy into Proton Pass
  ansible.builtin.debug:
    msg: >-
      Save these now, they are never written to disk. Copy the root token into Proton Pass
      as futharkd/openbao/root token before re-running this role — later tasks read it back
      from there. Recovery keys (needed only to generate a new root token later, not for
      day-to-day unseal — the kmip seal handles that) =
      {{ (openbao_init.stdout | from_json).recovery_keys_b64 }}, root token =
      {{ (openbao_init.stdout | from_json).root_token }}
  when: openbao_init is not skipped

- name: Stop here after a fresh init — copy the printed values into Proton Pass first
  ansible.builtin.meta: end_play
  when: openbao_init is not skipped

- name: Resolve the OpenBao root token
  ansible.builtin.set_fact:
    openbao_root_token: "{{ lookup('protonpass', 'pass://futharkd/openbao/root token') }}"
  no_log: true
  tags: [always]

- name: Read the k0s API server details from the generated kubeconfig
  ansible.builtin.set_fact:
    openbao_kubeconfig: "{{ lookup('ansible.builtin.file', generated_dir + '/kubeconfig') | from_yaml }}"
  tags: [always]

# node-<hostname> namespaces are for k0s nodes that run their own tenant apps
# (nodes/<hostname>.k0s/<app>/) — not every workflow: k0s host. ogma runs no tenant apps
# (it's the infra tier: openbao, auth), so it's deliberately excluded here rather than
# getting a pointless empty namespace.
- name: Find node app directories (nodes/<hostname>.k0s/)
  ansible.builtin.find:
    paths: "{{ repo_root }}/nodes"
    patterns: "*.k0s"
    file_type: directory
  register: openbao_k0s_app_dirs
  delegate_to: localhost
  become: false

- name: Bootstrap namespaces, mounts, auth methods, and policies
  ansible.builtin.include_tasks: namespaces.yml
  loop: >-
    {{ ['infra'] + (openbao_k0s_app_dirs.files
      | map(attribute='path')
      | map('basename')
      | map('regex_replace', '\.k0s$', '')
      | map('regex_replace', '^(.*)$', 'node-\1')
      | list) }}
  loop_control:
    loop_var: openbao_namespace
  tags: [openbao_namespaces]
