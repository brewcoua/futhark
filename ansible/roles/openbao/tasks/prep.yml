---
# Runs before Flux exists, against the k0s API directly (kubectl, not podman) — creates
# what infra/openbao/app/statefulset.yaml needs mounted on its first reconcile: the
# Namespace and the seal Secret. All values are identifying (this repo is public) so none
# of this is committed; it's read from Proton Pass each run, same exception CONVENTIONS.md
# already carves out for the git deploy key.
- name: Ensure the openbao namespace exists (may run before Flux creates it)
  kubernetes.core.k8s:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openbao
  delegate_to: localhost
  become: false

# `seal key id` must hold the *KMIP object* UID — `okms kmip create symmetric --alg AES
# --size 256 --usage encrypt,decrypt`, then `okms kmip activate <id>`, since OpenBao rejects a
# key that is not in the active state. It is NOT the OVH service/domain key id or its URN:
# `okms keys` and `okms kmip` are separate namespaces, and OpenBao never creates key material
# itself. Feeding it a service key id fails at startup with a KMIP ItemNotFound on
# GetAttributes, which reads as "the key was deleted" and is not.
#
# The other seal failure is `Operation is not authorized` on GetAttributes. That one is not
# about the key id at all — it means the mTLS credential has no KMIP rights on the OKMS, so
# *every* operation is refused. Tell the two apart before touching the key id:
#   okms kmip locate --endpoint <kmip endpoint> --auth-method mtls \
#     --cert client-cert.pem --key client-key.pem --ca kmip-ca.pem
# A bare Locate that also returns "not authorized" is the credential, not the object; fix it
# in the OVH manager (grant the credential KMIP access, or issue one that has it) and only
# then re-create/activate the key.
- name: Write the seal Secret (KMIP endpoint/key id/mTLS material, all identifying)
  kubernetes.core.k8s:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: openbao-seal
        namespace: openbao
      type: Opaque
      stringData:
        seal.hcl: |
          seal "kmip" {
            endpoint    = "{{ lookup('protonpass', 'pass://futharkd/ovh-kms/kmip endpoint') }}"
            kms_key_id  = "{{ lookup('protonpass', 'pass://futharkd/ovh-kms/seal key id') }}"
            client_cert = "/openbao/config/client-cert.pem"
            client_key  = "/openbao/config/client-key.pem"
            ca_cert     = "/openbao/config/kmip-ca.pem"
          }
        client-cert.pem: "{{ lookup('protonpass', 'pass://futharkd/ovh-kms/client cert') }}"
        client-key.pem: "{{ lookup('protonpass', 'pass://futharkd/ovh-kms/client key') }}"
        kmip-ca.pem: "{{ lookup('protonpass', 'pass://futharkd/ovh-kms/kmip ca') }}"
  delegate_to: localhost
  become: false
  no_log: true
