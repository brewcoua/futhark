---
# Runs before Flux exists, against the k0s API directly (kubectl, not podman) — creates
# what infra/openbao/app/statefulset.yaml needs mounted on its first reconcile: the
# Namespace and the seal Secret. All values are identifying (this repo is public) so none
# of this is committed; it's read from Proton Pass each run, same exception docs/src/conventions/secrets.md
# already carves out for the git deploy key.
- name: Ensure the openbao namespace exists (may run before Flux creates it)
  kubernetes.core.k8s:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openbao
  delegate_to: localhost
  become: false

# `seal key id` must hold the KMIP *object* UID, not the OVH service key id, and the OVH
# credential needs exactly three IAM actions. Both are easy to get wrong and both fail at
# startup in misleading ways — docs/src/operations/setup.md#the-openbao-seal.
- name: Write the seal Secret (KMIP endpoint/key id/mTLS material, all identifying)
  kubernetes.core.k8s:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: openbao-seal
        namespace: openbao
      type: Opaque
      stringData:
        seal.hcl: |
          seal "kmip" {
            endpoint    = "{{ lookup('protonpass', 'pass://futharkd/ovh-kms/kmip endpoint') }}"
            kms_key_id  = "{{ lookup('protonpass', 'pass://futharkd/ovh-kms/seal key id') }}"
            client_cert = "/openbao/config/client-cert.pem"
            client_key  = "/openbao/config/client-key.pem"
            ca_cert     = "/openbao/config/kmip-ca.pem"
          }
        client-cert.pem: "{{ lookup('protonpass', 'pass://futharkd/ovh-kms/client cert') }}"
        client-key.pem: "{{ lookup('protonpass', 'pass://futharkd/ovh-kms/client key') }}"
        kmip-ca.pem: "{{ lookup('protonpass', 'pass://futharkd/ovh-kms/kmip ca') }}"
  delegate_to: localhost
  become: false
  no_log: true
