---
# Talks to the cluster over the network via the kubeconfig k8s_cluster fetched — no SSH,
# no become, this isn't executing "on" a node.
- name: Install the Flux Operator
  kubernetes.core.helm:
    name: flux-operator
    chart_ref: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    chart_version: "{{ flux_bootstrap_operator_chart_version }}"
    release_namespace: flux-system
    create_namespace: true
    kubeconfig: "{{ generated_dir }}/kubeconfig"

# A blind ssh-keyscan trusts whatever answers on first contact (TOFU, no verification at all).
# GitHub publishes its own host keys over HTTPS instead — authenticated by the system's CA
# trust store, not by hoping nothing intercepted this specific TCP connection.
- name: Fetch GitHub's published SSH host keys
  ansible.builtin.uri:
    url: https://api.github.com/meta
    return_content: true
  register: flux_bootstrap_github_meta

- name: Build known_hosts from GitHub's published keys
  ansible.builtin.set_fact:
    # Double-quoted so YAML turns \n into a real newline before Jinja sees it; a folded (>-)
    # scalar would hand Jinja a literal backslash-n and Flux rejects the one-line known_hosts.
    flux_bootstrap_known_hosts_content:
      "{{ flux_bootstrap_github_meta.json.ssh_keys
      | map('regex_replace', '^', 'github.com ') | join('\n') }}"

- name: Bridge the Flux git deploy key
  kubernetes.core.k8s:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: git-deploy-key
        namespace: flux-system
      type: Opaque
      stringData:
        # Stored base64 in Proton Pass, decoded here. pass-cli inject splices the resolved value
        # into a double-quoted YAML scalar, and YAML folds a multi-line PEM's newlines into
        # spaces, which reaches Flux as `ssh: no key found`. One base64 line survives intact.
        identity: "{{ secrets.flux.deploy_key | b64decode }}"
        known_hosts: "{{ flux_bootstrap_known_hosts_content }}"
  no_log: true

# Flux declares all of these itself, in infra/namespaces/app/namespaces.yaml, and takes
# ownership on its first reconcile. They are created here only so the Secrets below have
# somewhere to land, since Flux does not exist yet. flux-system is already present — the Helm
# install above created it.
#
# Deleting one of these namespaces later destroys the seed Secret inside it, and nothing in the
# Flux tree puts it back — re-run this role. See docs/src/conventions/secrets.md.
- name: Create the namespaces the seed Secrets land in
  kubernetes.core.k8s:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop: "{{ flux_bootstrap_seed_namespaces }}"

# The two secrets that exist to seed the ones Flux resolves for itself, so neither can come from
# Flux. Everything else in the cluster arrives through the Infisical operator.
#
#   sops-age                  Flux needs it to decrypt config/sops/cluster.sops.yaml, the only
#                             encrypted file it is sealed to.
#   infisical-universal-auth  the operator's only credential, one copy per tier namespace so a
#                             tier's scoped RBAC is what gates access to it.
#
# See docs/src/conventions/secrets.md.
- name: Bridge the SOPS cluster age key
  kubernetes.core.k8s:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: sops-age
        namespace: flux-system
      type: Opaque
      stringData:
        # The filename suffix is load-bearing: Flux's kustomize-controller scans the Secret for
        # keys ending in .agekey to build its age identity set.
        age.agekey: "{{ secrets.sops.age_key }}"
  no_log: true

- name: Bridge the Infisical universal-auth credential into each tier namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: infisical-universal-auth
        namespace: "{{ item }}"
      type: Opaque
      stringData:
        clientId: "{{ secrets.infisical.cluster_reader.client_id }}"
        clientSecret: "{{ secrets.infisical.cluster_reader.client_secret }}"
  loop: "{{ flux_bootstrap_infisical_namespaces }}"
  no_log: true

# Same Secret name and shape, different identity. backup_reader is the only one granted
# /infra/velero in the Infisical console, and cluster_reader is denied it — that pairing is what
# keeps the keys protecting every backup out of reach of the credential every other tier holds.
- name: Bridge the backup tier's Infisical credential
  kubernetes.core.k8s:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: infisical-universal-auth
        namespace: "{{ flux_bootstrap_backup_namespace }}"
      type: Opaque
      stringData:
        clientId: "{{ secrets.infisical.backup_reader.client_id }}"
        clientSecret: "{{ secrets.infisical.backup_reader.client_secret }}"
  no_log: true

- name: Wait for the Flux Operator to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    kind: Pod
    namespace: flux-system
    label_selectors:
      - app.kubernetes.io/name=flux-operator
  register: flux_bootstrap_operator_pods
  until: flux_bootstrap_operator_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
  retries: 30
  delay: 10

- name: Apply the FluxInstance
  kubernetes.core.k8s:
    kubeconfig: "{{ generated_dir }}/kubeconfig"
    state: present
    src: "{{ repo_root }}/flux/cluster.yaml"
