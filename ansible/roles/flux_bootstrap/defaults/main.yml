---
# Namespaces that need a copy of the Infisical universal-auth credential — one per operator
# tier, matching infra/infisical-operator/app/namespace.yaml. Each tier's operator has scoped
# RBAC in its own namespace only, so a shared copy in one place would be unreadable by the
# others. Add a line here when adding a node tier.
flux_bootstrap_infisical_namespaces:
  - infisical-infra
  - infisical-node-kenaz

# Namespaces this role must create before Flux exists, because it writes Secrets into them.
# Flux re-declares and takes ownership of all of these on its first reconcile; creating them
# here is only about ordering.
flux_bootstrap_seed_namespaces: "{{ flux_bootstrap_infisical_namespaces + ['external-secrets'] }}"
