---
# The operator that owns every Flux controller in the cluster. Unpinned, this role installed
# whatever the registry called latest at the moment it ran, so two bootstraps months apart
# produced two different clusters from the same commit. The FluxInstance's own
# distribution.version (flux/cluster.yaml) is pinned for the same reason.
# renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/charts/flux-operator
flux_bootstrap_operator_chart_version: "0.57.0"

# Namespaces that need a copy of the Infisical universal-auth credential — one per operator
# tier. Each tier's operator has scoped RBAC in its own namespace only, so a shared copy in one
# place would be unreadable by the others.
#
# Derived rather than listed, so this and infra/namespaces/app/namespaces.yaml can't drift: the
# infra tier always exists, and a node tier exists for each host that carries apps — the
# `node.app_tier: true` opt-in in ansible/nodes/<host>/host.yml, same shape as node.mesh and
# node.public_ingress. Deliberately not "every k0s host": ogma is a worker with no
# nodes/<host>.k0s/ tree, and seeding a credential into a namespace Flux never adopts would
# leave it unmanaged and unpruned.
flux_bootstrap_infisical_namespaces: >-
  {{ ['infisical-infra'] + (groups['all'] | map('extract', hostvars) |
  selectattr('node.app_tier', 'defined') | selectattr('node.app_tier') |
  map(attribute='node.hostname') | map('regex_replace', '^', 'infisical-node-') | list) }}

# The backup tier, kept out of the derived list above because it is the one tier that does not
# share the cluster-reader identity: it authenticates as backup_reader, which alone can read the
# B2 keys. Folding a second credential into that list would mean turning it into a list of dicts
# for one entry. See docs/src/conventions/secrets.md.
flux_bootstrap_backup_namespace: infisical-backup

# Namespaces this role must create before Flux exists, because it writes Secrets into them.
# Flux re-declares and takes ownership of all of these on its first reconcile; creating them
# here is only about ordering.
flux_bootstrap_seed_namespaces: >-
  {{ flux_bootstrap_infisical_namespaces + [flux_bootstrap_backup_namespace] }}
