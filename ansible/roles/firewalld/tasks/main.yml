---
# Just "firewalld is up and answering". Four roles write firewalld rules — ssh_harden, fail2ban,
# tailscale, firewall_ingress — and each one used to depend on ssh_harden having started the
# daemon earlier in the playbook's role list. That made the ordering invisible: `--tags mesh`
# would run tailscale against a daemon nobody had started. Now each of them names this role in
# meta/main.yml, and Ansible's role dedupe means it still runs once per play.
- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
  when: node.os == 'fedora'

# systemd reports firewalld started before the daemon finishes loading its config, so an
# `immediate: true` rule can race it ("firewall is not currently running"). --state is the
# daemon's own readiness check.
- name: Wait for firewalld to accept commands
  ansible.builtin.command: firewall-cmd --state
  register: firewalld_state
  until: firewalld_state.rc == 0
  retries: 10
  delay: 2
  changed_when: false
  when: node.os == 'fedora'
