# Brute-force bans on every node. Runs after ssh_harden in playbooks/setup.yml so the sshd
# jail's port matches an sshd already listening there. The ban action is Fedora's packaged
# jail.d/00-firewalld.conf (firewallcmd-rich-rules) — same firewalld everything else uses.
#
# The `fail2ban` metapackage carries no files and pulls its parts as weak deps, so name
# them: fail2ban-server owns /etc/fail2ban (fail2ban.d, jail.d), fail2ban-firewalld ships
# the firewalld ban action above.
- name: Install fail2ban
  ansible.builtin.dnf:
    name:
      - fail2ban-server
      - fail2ban-firewalld
    state: present
  when: node.os == 'fedora'

- name: Ensure the drop-in directories exist
  ansible.builtin.file:
    path: "/etc/fail2ban/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - fail2ban.d
    - jail.d

- name: Log to a file instead of the journal
  ansible.builtin.template:
    src: 10-futhark.conf.j2
    dest: /etc/fail2ban/fail2ban.d/10-futhark.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Install the jails
  ansible.builtin.template:
    src: 10-futhark.local.j2
    dest: /etc/fail2ban/jail.d/10-futhark.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

# The recidive jail polls this path, and fail2ban validates every jail's logpath before it has
# written a line to its own logtarget — so on a fresh node the file it is about to create does
# not exist yet, and the whole server aborts with "Have not found any log file for recidive
# jail", taking the sshd jail down with it. Seeding it breaks the cycle. Only ever needed once:
# logrotate.conf sets `create` globally, so rotation puts the file back.
- name: Seed fail2ban's own log for the recidive jail
  ansible.builtin.file:
    path: /var/log/fail2ban.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    access_time: preserve
    modification_time: preserve

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
