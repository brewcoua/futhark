---
node:
  hostname: kenaz
  os: fedora
  workflow: k0s
  k0s_role: controller+worker
  mesh: true
  public_ingress: true
  # This node carries apps of its own, under nodes/kenaz.k0s/ in the Flux tree — so it gets an
  # infisical-node-kenaz operator tier, which roles/flux_bootstrap seeds a credential into.
  # ogma is a worker with no such tree and so sets nothing here.
  app_tier: true
  # Identifying, so the literal lives encrypted in host.sops.yml beside this file. Kept as a
  # reference rather than moved out of `node:` so every hostvars[x].node.ip in the roles and
  # k0sctl template keeps working unchanged.
  ip: "{{ node_ip }}"
  # Written back into host.sops.yml by the netbird role after the join — the management server
  # assigns it, so it can't be known before first contact. Defaulted so a cold bootstrap (where the
  # key does not exist yet) parses; k0s_cluster asserts it is non-empty before converging.
  mesh_ip: "{{ node_mesh_ip | default('') }}"
  initial_user: fedora
  initial_port: 22
