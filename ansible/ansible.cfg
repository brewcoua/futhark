[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# community.sops auto-decrypts *.sops.yml under group_vars/host_vars. host_group_vars must stay
# listed: naming any plugin here replaces the default set rather than adding to it.
vars_plugins_enabled = host_group_vars,community.sops.sops
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
