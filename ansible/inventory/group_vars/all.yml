# Shared defaults for every node. Per-node overrides live in
# ansible/nodes/<host>/host.yml under the `node:` key.

# Resolved from the Proton Pass vault `futharkd`, item `ssh-ops`, fields
# `username`/`public-key` — see ansible/plugins/lookup/protonpass.py.
admin:
  user: "{{ lookup('protonpass', 'pass://futharkd/ssh-ops/username') }}"
  ssh_pubkey: "{{ lookup('protonpass', 'pass://futharkd/ssh-ops/public key') }}"

# The tailnet's MagicDNS suffix (e.g. foo-bar.ts.net) — identifying, so it's a pass://
# lookup like the rest of ansible/roles/tailscale's Proton Pass item, never committed.
tailnet_domain: "{{ lookup('protonpass', 'pass://futharkd/tailscale/magicdns domain') }}"

ssh_port: 2222

# Cluster CIDRs. These are k0s's own defaults, pinned here so they're a single source of
# truth: k0s_cluster writes them into the ClusterConfig, and the tailscale role needs the
# pod CIDR to scope its pod -> mesh SNAT rule (see roles/tailscale/templates). Leaving them
# implicit would mean that SNAT rule hardcodes a value nothing else declares.
# Private RFC1918 ranges, not identifying, so plain literals rather than pass:// lookups.
#
# pod_cidr is the cluster-wide /16; kube-router carves a /24 out of it per node. The SNAT
# rule must match the /16, or a peer's pods aren't covered.
k0s_pod_cidr: 10.244.0.0/16
k0s_service_cidr: 10.96.0.0/12

# Real Ansible connection vars, always-on: k0sctl's SSH to each host (rendered from this
# same node.hostname + tailnet_domain, see ansible/roles/k0s_cluster) and re-runs of task
# ans:setup both target already-bootstrapped hosts, so neither needs ssh_identity's
# fresh-vs-hardened probe. setup.yml still overrides these via set_fact for first-time
# provisioning — facts win over inventory vars, so that dynamic dance is untouched. Guarded
# on `node is defined` because k0s_cluster/flux_bootstrap/bao run against hosts: localhost
# (implicit, not in inventory, no `node` var) — the ternary's false branch is never
# evaluated, so it can't blow up on a plain omit.
#
# Mesh nodes are addressed by Tailscale MagicDNS name, not a stored mesh IP — the tailnet's
# own resolver keeps it correct across re-keys/reassignments with nothing in this repo to
# update. See ansible/nodes/README.md.
ansible_host: "{{ (node.hostname + '.' + tailnet_domain if node.mesh | default(false) else node.ip) if node is defined else omit }}"
ansible_user: "{{ admin.user }}"
ansible_port: "{{ ssh_port }}"

# Repo-relative paths used by cluster-provisioning roles (k0s_cluster, flux_bootstrap)
# to render and read artifacts that never get committed — see .gitignore. playbook_dir,
# not inventory_dir: those roles run against hosts: localhost (implicit, not in
# inventory), which has no inventory_dir; playbook_dir is play-scoped, not host-scoped.
repo_root: "{{ playbook_dir }}/../.."
generated_dir: "{{ repo_root }}/ansible/.generated"

# Same source of truth as config/domain/domain.env (Kustomize's DOMAIN/INT_DOMAIN, used
# across Flux-managed apps, see config/domain) — read straight from that file so ansible
# and k8s never drift.
domain_env_file: "{{ lookup('ansible.builtin.file', repo_root + '/config/domain/domain.env') }}"
domain: "{{ (domain_env_file | regex_findall('^DOMAIN=(.*)$', multiline=True))[0] }}"
int_domain: "{{ (domain_env_file | regex_findall('^INT_DOMAIN=(.*)$', multiline=True))[0] }}"
