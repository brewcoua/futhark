---
# k3s cluster + Flux bootstrap. Runs after setup.yml.
#
# Two plays over the same role rather than one fleet-wide pass: an agent's config needs the
# controller's join token, which k3s only mints on the server's first start. Ansible runs a play
# host-by-host in parallel, so the ordering has to be a play boundary — a `when:` inside one play
# would not give it.
- name: Install the k3s controller
  hosts: all
  become: true
  gather_facts: false
  roles:
    - role: k8s_cluster
      when: node.workflow == 'k8s' and node.k8s_role == 'controller'
      tags: k8s

- name: Join the k3s workers
  hosts: all
  become: true
  gather_facts: false
  roles:
    - role: k8s_cluster
      when: node.workflow == 'k8s' and node.k8s_role == 'worker'
      tags: k8s

# The StorageClass everything else waits on comes from k3s's own bundled local-path provisioner
# (see k8s_cluster's k8s_cluster_disable — `local-storage` is deliberately not in it), so there
# is nothing to install between the cluster coming up and Flux taking over.
- name: Bootstrap Flux
  hosts: localhost
  connection: local
  gather_facts: false
  # The crown jewels, resolved from Proton Pass by `just ans render-secrets` before this runs.
  # Read from here rather than from group_vars because the un-rendered template holds `{{ }}`
  # references that Jinja would try to evaluate — see .just/ansible.just.
  vars_files:
    - "{{ playbook_dir }}/../.generated/secrets.yml"
  roles:
    - role: flux_bootstrap
      tags: flux
