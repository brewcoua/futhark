---
# k0s cluster + Flux bootstrap. Runs after setup.yml. Fleet-wide, not per-host: one k0sctl
# apply converges every workflow: k0s node in inventory at once.
- name: Provision k0s cluster
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: k0s_cluster
      tags: k0s

# Nothing in the Flux-managed tree can provision a StorageClass for itself, and monitoring,
# auth and nodes/kenaz.k0s/actual all bind local-path PVCs on their first reconcile. (This used
# to be justified by OpenBao's PVC, which was the root of the Flux graph; OpenBao is gone, the
# other PVCs are not.)
- name: Install the local-path StorageClass
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: local_path_provisioner
      tags: storage

- name: Bootstrap Flux
  hosts: localhost
  connection: local
  gather_facts: false
  # The crown jewels, resolved from Proton Pass by `task ans:render-secrets` before this runs.
  # Read from here rather than from group_vars because the un-rendered template holds `{{ }}`
  # references that Jinja would try to evaluate — see .taskfiles/ansible/Taskfile.yaml.
  vars_files:
    - "{{ playbook_dir }}/../.generated/secrets.yml"
  roles:
    - role: flux_bootstrap
      tags: flux
