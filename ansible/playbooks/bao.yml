---
# Day-2 OpenBao ops, wrapped by .taskfiles/bao/Taskfile.yaml. Select the action via
# -e bao_task=status|policy-sync. Runs against the k0s API (kubectl exec into the
# openbao-0 pod), not SSH — ogma is a plain k0s worker now, nothing podman-specific left
# to connect to directly.
- name: OpenBao ops
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Status
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig={{ generated_dir }}/kubeconfig -n openbao exec openbao-0 --
          bao status
      register: bao_status
      changed_when: false
      failed_when: false
      when: bao_task == 'status'

    - name: Namespace/mount/auth/policy bootstrap (idempotent, re-runnable)
      ansible.builtin.import_role:
        name: openbao
      when: bao_task == 'policy-sync'

    - name: Print the result
      ansible.builtin.debug:
        msg: "{{ bao_status.stdout_lines | default([]) }}"
      when: bao_status is defined
