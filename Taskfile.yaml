---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# The tool version pins, shared with .github/workflows/{validate,docs}.yml — see
# config/versions.env. Declared here and not in .taskfiles/operator/, which is the only consumer:
# go-task rejects a `dotenv:` in an included Taskfile, and a root-level one reaches every task.
dotenv:
  - config/versions.env

includes:
  ans: .taskfiles/ansible/Taskfile.yaml
  ops: .taskfiles/operator/Taskfile.yaml
  tf: .taskfiles/tofu/Taskfile.yaml
  k0s: .taskfiles/k0s/Taskfile.yaml
  fx: .taskfiles/flux/Taskfile.yaml
  docs: .taskfiles/docs/Taskfile.yaml

tasks:
  default:
    silent: true
    cmd: task --list
