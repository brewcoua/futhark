---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd/flux2/main/manifests/bases/crds/kustomize.toolkit.fluxcd.io_kustomizations.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra
  # Stated in full here, not patched: flux/ has no kustomization.yaml of its own — Flux
  # auto-generates one from cluster.yaml's sync.path. See docs/src/gitops/flux.md.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
