---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/main/config/crd/bases/fluxcd.controlplane.io_fluxinstances.json
# Applied once by ansible/roles/flux_bootstrap — not itself reconciled by Flux, to
# avoid a self-sync loop. Everything it points at (infra/, nodes/) IS reconciled.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    # Pinned exactly, not "2.x": the operator resolves a floating range at every reconcile, so
    # the controllers could move without a commit. Renovate raises the bump instead.
    # renovate: datasource=github-releases depName=fluxcd/flux2 extractVersion=^v(?<version>.+)$
    version: "2.9.4"
    registry: ghcr.io/fluxcd
  # Both controllers requeue a dependsOn-blocked object every 30s by default, so a chain of N
  # Kustomizations costs ~30s per link even when each one is already ready. 5s keeps a cold
  # bootstrap from idling through it; the cluster is small enough that the extra reconciles
  # are free.
  kustomize:
    patches:
      - target:
          kind: Deployment
          name: (kustomize-controller|helm-controller)
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
  sync:
    kind: GitRepository
    url: ssh://git@github.com/brewcoua/futhark.git
    ref: refs/heads/master
    path: flux
    pullSecret: git-deploy-key
