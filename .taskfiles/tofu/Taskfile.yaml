---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  TOFU_DIR: "{{.ROOT_DIR}}/tofu"

env:
  # The organisation is on Bitwarden's EU cloud; bws defaults to the US one and rejects an
  # EU access token with a bare `400 invalid_client`. Set here rather than via
  # `bws config server-base` so a fresh workstation needs no per-machine state. Mirrors
  # `bws_base_url` in ansible/inventory/group_vars/all/main.yml.
  BWS_SERVER_URL: https://vault.bitwarden.eu

tasks:
  init:
    desc: "Init tofu module(s) [-- <module>] (no secrets needed: provider download only)"
    dir: "{{.ROOT_DIR}}"
    cmd: |
      for d in {{if .CLI_ARGS}}tofu/{{.CLI_ARGS}}{{else}}$(find tofu -mindepth 1 -maxdepth 1 -type d){{end}}; do
        (cd "$d" && tofu init -input=false)
      done

  # Both stores, composed. `bws run` injects the Bitwarden project's secrets as environment
  # variables named after the secrets themselves, so credentials need no committed pointer at
  # all; `sops exec-env` then layers on the module's identifying values. Neither ever writes a
  # value to disk. Needs BWS_ACCESS_TOKEN in the environment and the GPG card for sops.
  plan:
    desc: "Plan a tofu module -- <module>"
    dir: "{{.TOFU_DIR}}/{{.CLI_ARGS}}"
    cmd: bws run -- 'sops exec-env secrets.sops.env "tofu plan"'

  apply:
    desc: "Apply a tofu module -- <module>"
    dir: "{{.TOFU_DIR}}/{{.CLI_ARGS}}"
    cmd: bws run -- 'sops exec-env secrets.sops.env "tofu apply"'

  validate:
    desc: "Validate a tofu module -- <module>"
    dir: "{{.TOFU_DIR}}/{{.CLI_ARGS}}"
    cmd: tofu validate
