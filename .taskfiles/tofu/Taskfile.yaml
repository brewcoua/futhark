---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  TOFU_DIR: "{{.ROOT_DIR}}/tofu"

  # Resolves a module's node-refs.env, if it has one. Each line maps a tofu variable to a value
  # in a node's SOPS file — `TF_VAR_kenaz_public_ip=kenaz:node_ip` reads the `node_ip` key from
  # ansible/nodes/kenaz/host.sops.yml. The file holds only references, never values, so it is
  # committed in the clear; a module opts in by creating one, and this Taskfile never needs to
  # know which modules or which variables exist.
  #
  # `< "$f"` rather than a pipe on purpose: a pipeline would run the loop in a subshell and the
  # exports would not survive it.
  NODE_REFS: |
    f=node-refs.env
    if [ -f "$f" ]; then
      while IFS='=' read -r var ref; do
        case "$var" in ''|\#*) continue ;; esac
        host=${ref%%:*}; key=${ref##*:}
        src="{{.ROOT_DIR}}/ansible/nodes/$host/host.sops.yml"
        val=$(sops -d --extract "[\"$key\"]" "$src") || {
          echo "node-refs.env: cannot read $key from $src" >&2; exit 1; }
        export "$var=$val"
      done < "$f"
    fi

tasks:
  init:
    desc: "Init tofu module(s) [-- <module>] (no secrets needed: provider download only)"
    dir: "{{.ROOT_DIR}}"
    cmd: |
      for d in {{if .CLI_ARGS}}tofu/{{.CLI_ARGS}}{{else}}$(find tofu -mindepth 1 -maxdepth 1 -type d){{end}}; do
        (cd "$d" && tofu init -input=false)
      done

  # Both stores, composed, in this order and no other. `sops exec-env` puts the module's whole
  # secrets.sops.env into the environment — identifying values as themselves, credentials as
  # bare `pass://` URIs — and `pass-cli run` then rewrites every variable whose value is such a
  # URI into the real secret before exec'ing tofu. Neither ever writes a value to disk. Needs a
  # Proton Pass session (`pass-cli info`) and the GPG card for sops.
  #
  # Braces are deliberately absent here, unlike config/secrets.sops.yaml: `run` resolves bare
  # URIs and ignores braced ones, which is the exact inverse of `inject`. Getting it backwards
  # fails by passing the literal string through to the provider, which reads as a bad credential.
  #
  # A third source, for node addresses only: ansible/nodes/<host>/host.sops.yml is canonical
  # (the tailscale role writes node_mesh_ip back into it after each join), so a module that
  # needs one declares it in node-refs.env instead of keeping a second encrypted copy in its
  # own secrets.sops.env. Two copies of an address drift silently; both paths seal to the same
  # operator key, so this costs no extra card touch.
  plan:
    desc: "Plan a tofu module -- <module>"
    dir: "{{.TOFU_DIR}}/{{.CLI_ARGS}}"
    cmd: |
      {{.NODE_REFS}}
      sops exec-env secrets.sops.env 'pass-cli run -- tofu plan'

  apply:
    desc: "Apply a tofu module -- <module>"
    dir: "{{.TOFU_DIR}}/{{.CLI_ARGS}}"
    cmd: |
      {{.NODE_REFS}}
      sops exec-env secrets.sops.env 'pass-cli run -- tofu apply'

  validate:
    desc: "Validate a tofu module -- <module>"
    dir: "{{.TOFU_DIR}}/{{.CLI_ARGS}}"
    cmd: tofu validate
