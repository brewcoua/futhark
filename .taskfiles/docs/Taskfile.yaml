---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  DOCS_DIR: "{{.ROOT_DIR}}/docs"

tasks:
  build:
    desc: Build the documentation book into docs/book
    cmd: "mdbook build {{.DOCS_DIR}}"

  serve:
    desc: Serve the documentation with live reload
    cmd: "mdbook serve {{.DOCS_DIR}} --open"
