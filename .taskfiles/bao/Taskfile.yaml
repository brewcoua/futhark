---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  ANSIBLE_DIR: "{{.ROOT_DIR}}/ansible"

tasks:
  status:
    desc: Show OpenBao's seal/init status
    dir: "{{.ANSIBLE_DIR}}"
    cmd: ansible-playbook playbooks/bao.yml -e bao_task=status

  policy-sync:
    desc: Re-run the namespace/mount/auth/policy bootstrap idempotently
    dir: "{{.ANSIBLE_DIR}}"
    cmd: ansible-playbook playbooks/bao.yml -e bao_task=policy-sync

  kv:
    desc: "Run 'bao kv' in-cluster, root token piped over stdin (never argv) [-- put -namespace=<ns> <path> key=value ...]"
    dir: "{{.ANSIBLE_DIR}}"
    cmd: >-
      pass-cli item view 'pass://futharkd/openbao/root token' --output human |
      kubectl --kubeconfig=.generated/kubeconfig -n openbao exec -i openbao-0 --
      sh -c 'IFS= read -r BAO_TOKEN; export BAO_TOKEN; exec bao kv {{.CLI_ARGS}}'
