---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  KUBECONFIG: "{{.ROOT_DIR}}/ansible/.generated/kubeconfig"

env:
  KUBECONFIG: "{{.KUBECONFIG}}"

tasks:
  get:
    desc: List Kustomizations and their sync status
    cmd: flux get kustomizations -A

  sources:
    desc: List GitRepository sources and their sync status
    cmd: flux get sources git -A

  hr:
    desc: List HelmReleases and their sync status
    cmd: flux get helmreleases -A

  failing:
    desc: List only Kustomizations and HelmReleases that aren't Ready
    cmd: |
      flux get kustomizations -A --status-selector ready=false
      flux get helmreleases -A --status-selector ready=false

  redeploy:
    desc: "Force a HelmRelease to reinstall/upgrade even if its chart is unchanged -- <name>"
    cmd: |
      [ -n "{{.CLI_ARGS}}" ] || { echo 'usage: task fx:redeploy -- <name>' >&2; exit 1; }
      # `flux reconcile` has no -A, and most (not all) HelmReleases live in flux-system.
      ns=$(kubectl get helmrelease -A -o "jsonpath={.items[?(@.metadata.name=='{{.CLI_ARGS}}')].metadata.namespace}")
      [ -n "$ns" ] || { echo "no HelmRelease named '{{.CLI_ARGS}}' (see: task fx:hr)" >&2; exit 1; }
      flux reconcile helmrelease {{.CLI_ARGS}} -n "$ns" --force

  reconcile:
    desc: "Force-reconcile a Kustomization, or all of them [-- <name>]"
    cmd: |
      {{if .CLI_ARGS}}
      flux reconcile kustomization {{.CLI_ARGS}} --with-source
      {{else}}
      flux get kustomizations -A --no-header | awk 'NF {print $1, $2}' | while read -r ns ks; do
        flux reconcile kustomization "$ks" -n "$ns" --with-source
      done
      {{end}}

  logs:
    desc: "Tail controller logs [-- <controller>, default kustomize-controller]"
    cmd: "flux logs --follow --controller={{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}kustomize-controller{{end}}"
