---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# The $*_VERSION pins below come from config/versions.env, loaded by the root Taskfile — go-task
# rejects a `dotenv:` in an included Taskfile, so it can only be declared there. Referenced as
# `$FOO` rather than `{{.FOO}}`: dotenv entries land in the environment, not the template scope.
vars:
  ANSIBLE_DIR: "{{.ROOT_DIR}}/ansible"

tasks:
  setup:
    desc: Fully set up this machine as a futhark operator (packages + collections + hooks + tofu)
    cmds:
      - task: deps
      - task: collections
      - task: hooks
      - task: ":tf:init"
      - task: pass-session

  # The one credential a new operator machine needs out of band, alongside the GPG smartcard
  # that opens SOPS. pass-cli persists a session after login, so this is a once-per-machine
  # step and not a per-command prompt.
  pass-session:
    desc: Check this machine has a Proton Pass session, and explain how to get one if not
    silent: true
    cmd: |
      pass-cli info > /dev/null 2>&1 && { echo "Proton Pass session OK"; exit 0; }
      echo "No Proton Pass session. Mint a personal access token in the Proton Pass"
      echo "web app, then:"
      echo
      echo "  PROTON_PASS_PERSONAL_ACCESS_TOKEN=pst_… pass-cli login"
      exit 1

  deps:
    desc: >-
      Install required packages (ansible-core, ansible-lint, yamllint, sops, age, pass-cli,
      pre-commit, kubectl, helm, kustomize, k0sctl, flux, tofu, mdbook)
    cmds:
      # opentofu (dnf) provides /usr/bin/tofu — the upstream install-opentofu.sh's rpm method
      # ships a same-path conflicting package literally named `tofu`, don't use it here.
      #
      # gnupg2/pcsc-lite/pinentry are the smartcard path: the SOPS operator recipient is a GPG
      # key whose encryption subkey lives on a token, so every `sops -d` goes through gpg-agent
      # to the card reader. age is only ever used to generate/hold the *cluster* recipient.
      - sudo dnf install -y ansible-core yamllint kubernetes-client helm opentofu age gnupg2 pcsc-lite pinentry
      - sudo systemctl enable --now pcscd.socket
      # kubernetes.core.helm's idempotency check shells out to this plugin if present.
      - helm plugin list | grep -q ^diff || helm plugin install --verify=false https://github.com/databus23/helm-diff
      - uv tool install --upgrade ansible-lint
      - uv tool install --upgrade pre-commit
      # kubernetes.core's modules (flux_bootstrap) import `kubernetes` directly, not the kubectl
      # binary above. It goes into /usr/bin/python3's site-packages, since that is the interpreter
      # ansible-core actually runs modules with, not a uv tool's isolated venv.
      - sudo uv pip install --python /usr/bin/python3 kubernetes
      # Pinned release binaries. sops decrypts everything committed here; pass-cli resolves the
      # crown-jewel secrets that are deliberately not committed at all, in either order depending
      # on the plane — see docs/src/conventions/secrets.md.
      - >-
        command -v sops > /dev/null ||
        (curl -fsSL -o /tmp/sops
        https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64 &&
        sudo install -m 755 /tmp/sops /usr/local/bin/sops)
      - >-
        command -v pass-cli > /dev/null ||
        (curl -fsSL -o /tmp/pass-cli
        https://github.com/protonpass/pass-cli/releases/download/${PASS_CLI_VERSION}/pass-cli-linux-x86_64 &&
        sudo install -m 755 /tmp/pass-cli /usr/local/bin/pass-cli)
      # Pinned release binary, not curl-to-sudo-bash of the installer script tracking master.
      - >-
        command -v kustomize > /dev/null ||
        (curl -fsSL -o /tmp/kustomize.tar.gz
        https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz &&
        tar -xzf /tmp/kustomize.tar.gz -C /tmp &&
        sudo install -m 755 /tmp/kustomize /usr/local/bin/kustomize)
      - curl -fsSL https://github.com/k0sproject/k0sctl/releases/download/${K0SCTL_VERSION}/k0sctl-linux-amd64 -o /tmp/k0sctl && sudo install -m 755 /tmp/k0sctl /usr/local/bin/k0sctl
      # Every fx:* task and k0s:status (via flux get) needs this; nothing else here installed it.
      - command -v flux > /dev/null || curl -fsSL https://fluxcd.io/install.sh | sudo bash
      # Every bak:* task shells out to this. Not needed on the cluster — the server side is the
      # HelmRelease in infra/backup — only on the operator machine driving a restore.
      - >-
        command -v velero > /dev/null ||
        (curl -fsSL -o /tmp/velero.tar.gz
        https://github.com/velero-io/velero/releases/download/${VELERO_VERSION}/velero-${VELERO_VERSION}-linux-amd64.tar.gz &&
        tar -xzf /tmp/velero.tar.gz -C /tmp &&
        sudo install -m 755 /tmp/velero-${VELERO_VERSION}-linux-amd64/velero /usr/local/bin/velero)
      # Same pin .github/workflows/docs.yml reads, so a local `task docs:build` renders what CI publishes.
      - >-
        command -v mdbook > /dev/null ||
        (curl -fsSL -o /tmp/mdbook.tar.gz
        https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz &&
        tar -xzf /tmp/mdbook.tar.gz -C /tmp &&
        sudo install -m 755 /tmp/mdbook /usr/local/bin/mdbook)
      # The docs render their graphs from ```d2 fences. mdbook-d2 is the preprocessor mdbook
      # invokes; it shells out to the `d2` binary, so both have to be present or `mdbook build`
      # leaves every diagram as a code block. Release binaries for both, so no Rust toolchain.
      - >-
        command -v d2 > /dev/null ||
        (curl -fsSL -o /tmp/d2.tar.gz
        https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz &&
        tar -xzf /tmp/d2.tar.gz -C /tmp &&
        sudo install -m 755 /tmp/d2-${D2_VERSION}/bin/d2 /usr/local/bin/d2)
      - >-
        command -v mdbook-d2 > /dev/null ||
        (curl -fsSL -o /tmp/mdbook-d2.tar.gz
        https://github.com/danieleades/mdbook-d2/releases/download/${MDBOOK_D2_VERSION}/mdbook-d2-x86_64-unknown-linux-gnu.tar.gz &&
        tar -xzf /tmp/mdbook-d2.tar.gz -C /tmp &&
        sudo install -m 755 /tmp/mdbook-d2 /usr/local/bin/mdbook-d2)
    preconditions:
      - which dnf
      - which uv

  age-key:
    desc: Generate the SOPS cluster age keypair (run once, at cold bootstrap)
    silent: true
    cmd: |
      set -eu
      # Explicit modes rather than `umask 077`: go-task runs this through mvdan/sh, which has
      # no umask builtin. mktemp -d is 0700 already; the chmod is belt and braces.
      dir=$(mktemp -d)
      out="$dir/cluster.agekey"
      age-keygen -o "$out" 2>/dev/null
      chmod 600 "$out"
      echo
      echo "Public recipient — put this in .sops.yaml under the (infra|nodes|config) rule:"
      grep -o 'age1[a-z0-9]*' "$out" | head -1
      echo
      echo "Private key is at $out and is NOT in the repo. Store it in Proton Pass as the"
      echo "'age key' field of the 'sops' item in the futharkd vault, then shred it:"
      echo "  shred -u $out"
      echo "config/secrets.sops.yaml points at it; flux_bootstrap creates flux-system/sops-age."

  sops:
    desc: "Edit an encrypted file, creating it from its .example if absent -- <file>"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmd: |
      set -eu
      f="{{.CLI_ARGS}}"
      if [ -z "$f" ]; then
        echo "usage: task ops:sops -- <path/to/thing.sops.yaml>"
        echo
        echo "Files still to create:"
        for e in $(find . -name '*.sops.*.example' -not -path './.git/*' | sort); do
          [ -f "${e%.example}" ] || echo "  ${e%.example}"
        done
        exit 2
      fi
      # Accept either name, so tab-completing the template does the right thing.
      f="${f%.example}"
      if [ -f "$f" ]; then
        # sops exits 200 when the edit changed nothing, which is a normal outcome here, not a
        # failure worth a red task.
        sops "$f" || { rc=$?; [ "$rc" = 200 ] || exit "$rc"; }
        exit 0
      fi
      [ -f "$f.example" ] || { echo "no $f, and no $f.example to seed it from"; exit 1; }
      cp "$f.example" "$f"
      # Fail closed at both steps. An aborted edit or a failed encrypt must never leave a
      # plaintext file sitting at a *.sops.* path — that is the one mistake this whole
      # convention exists to prevent.
      if ! "${EDITOR:-vi}" "$f"; then
        rm -f "$f"; echo "editor exited non-zero, removed $f"; exit 1
      fi
      if ! sops -e -i "$f"; then
        rm -f "$f"; echo "encryption failed, removed plaintext $f"; exit 1
      fi
      echo "created and encrypted $f"

  hooks:
    desc: Install the repo's pre-commit hooks
    dir: "{{.ROOT_DIR}}"
    cmd: pre-commit install

  collections:
    desc: Install the Ansible collections futhark's roles depend on
    dir: "{{.ANSIBLE_DIR}}"
    cmd: ansible-galaxy collection install -r requirements.yml
