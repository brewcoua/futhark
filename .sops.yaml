---
# Which recipients each encrypted file is sealed to. See docs/src/conventions/secrets.md.
#
# The PGP entry is the *primary* key's full fingerprint, deliberately:
#   - primary, not a subkey, so rotating or renewing the encryption subkey never touches this
#     file — gpg picks the current encryption-capable subkey at encrypt time;
#   - the full 40-hex fingerprint, not the 16-hex long ID, because 64-bit key IDs are
#     collision-generatable and this file decides who can read every secret in the repo.
# The encryption subkey lives on a smartcard, so every decrypt needs the token and its PIN.
#
# A GPG fingerprint and an age public key are neither credentials nor identifying values, so
# unlike everything else in this repo they are committed literally.
# Two files, two rules, and no pattern that could match a third: a path this file does not name
# fails to encrypt at all rather than being sealed to the wrong recipients.
# Both are anchored on a path separator as well as the start, so an absolute `sops -e -i` matches.
creation_rules:
  # Operator only — the Ansible, node and OpenTofu planes. The cluster age key is deliberately
  # absent: this file is a map to the Flux deploy key and to the age key that decrypts everything
  # else, so a compromise of flux-system must not be able to follow it. That is the one boundary
  # this repo is built around.
  - path_regex: (^|/)config/sops/ops\.sops\.yaml$
    pgp: 100E6328B87F82112F2A932F7B5D8E73CC72848C

  # Cluster plane — operator, so it stays editable, plus the cluster age key that Flux mounts as
  # flux-system/sops-age to decrypt at apply time.
  - path_regex: (^|/)config/sops/cluster\.sops\.yaml$
    pgp: 100E6328B87F82112F2A932F7B5D8E73CC72848C
    age: age18nxkppuywt7zwzupqz3x5mcvrym7995wfgcuyc7fj9pp6fm03yss97483a
